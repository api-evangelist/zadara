aid: zadara
name: Zadara
description: Zadara is an edge cloud and storage-as-a-service provider offering zStorage (VPSA Storage Array and Flash Array block/file storage, VPSA Object Storage) and zCompute, delivered fully managed
  in its own and partner data centers. Its public API documentation at api-doc.zadara.com publishes Swagger 2.0 contracts for the VPSA Storage Array, Object Storage, Command Center and Provisioning Portal
  REST APIs, each authenticated with an X-Access-Key header.

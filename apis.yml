  name: Zadara VPSA Storage Array REST API
  description: 'REST API for managing a Zadara VPSA Storage Array or Flash Array: volumes, pools, drives, servers, snapshots, mirrors, consistency groups, controllers and users. Served by each customer
    VPSA at its own hostname under /api (spec host is localhost).'

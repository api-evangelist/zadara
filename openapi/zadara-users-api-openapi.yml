                type: object
                properties:
                  status:
                    type: string
                    example: success
                  api_key:
                    type: string
                    example: '...'
                    xml:
                      name: api-key
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  api_key:
                    type: string
                    example: '...'
                    xml:

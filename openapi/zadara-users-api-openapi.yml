                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      firstname:
                        type: string
                        example: fdmfd
                      lastname:
                        type: string
                        example: mvkdlvd
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      firstname:
                        type: string
                        example: fdmfd
                      lastname:
                        type: string
                        example: mvkdlvd
      summary: Get user
      x-summary-source: derived
    put:
      tags:
      - Users
      description: Update user.
      operationId: update_user
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: email
                  example: john@doe.com
                firstname:
                  type: string
                  example: john
                lastname:
                  type: string
                  example: doe
                admin:
                  type: boolean
                  example: true
                role_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 3
                current_password:
                  type: string
                  example: currentpassword
                password:
                  type: string
                  example: newpassword
        required: true
      summary: Update user
      x-summary-source: derived
    delete:
      tags:
      - Users
      description: Delete user.
      operationId: delete_user
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      summary: Delete user
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /users/token.json:
    post:
      tags:
      - Users
      description: Returns user's API key.
      operationId: get_user_api_key
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:

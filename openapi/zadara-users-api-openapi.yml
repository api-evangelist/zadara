openapi: 3.2.0
info:
  title: Zadara Users API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Users across 8 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-object-storage-25.07.yml, zadara-provisioning-portal-25.07.yml, zadara-vpsa-25.07.yml, zadara-command-center-openapi.yml, zadara-object-storage-openapi.yml, zadara-provisioning-portal-openapi.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
- url: https://localhost/api/v2
tags:
- name: Users
  description: Operations involving Command Center users.
paths:
  /users.json:
    get:
      tags:
      - Users
      description: Return Users list.
      operationId: get_all_users
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: fdmfd
                        lastname:
                          type: string
                          example: mvkdlvd
                      xml:
                        name: user
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: fdmfd
                        lastname:
                          type: string
                          example: mvkdlvd
                      xml:
                        name: user
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all users
      x-summary-source: derived
    post:
      tags:
      - Users
      description: Create user.
      operationId: create_user
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        example: testtest.com
                      firstname:
                        type: string
                        example: harel
                      lastname:
                        type: string
                        example: feldman
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              example: raid groups manage role
                          xml:
                            name: role
                        xml:
                          wrapped: true
                      admin:
                        type: boolean
                      password:
                        type: string
                        example: AbCdEf
                      authentication_token:
                        type: string
                        xml:
                          name: authentication-token
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        example: testtest.com
                      firstname:
                        type: string
                        example: harel
                      lastname:
                        type: string
                        example: feldman
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              example: raid groups manage role
                          xml:
                            name: role
                        xml:
                          wrapped: true
                      admin:
                        type: boolean
                      password:
                        type: string
                        example: AbCdEf
                      authentication_token:
                        type: string
                        xml:
                          name: authentication-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: john@doe.com
                    firstname:
                      type: string
                      example: john
                    lastname:
                      type: string
                      example: doe
                    admin:
                      type: boolean
                      example: true
                    role_ids:
                      type: array
                      items:
                        type: integer
                      example:
                      - 1
                      - 3
        required: true
      summary: Create user
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /users/{id}.json:
    get:
      tags:
      - Users
      description: Returns a User.
      operationId: get_user
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:

        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  api_key:
                    type: string
                    example: '...'
                    xml:
                      name: api-key
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  api_key:
                    type: string
                    example: '...'
                    xml:
                      name: api-key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
        required: true
      summary: Regenerate user api token
      x-summary-source: derived
    servers:
    - url: https://localhost/api

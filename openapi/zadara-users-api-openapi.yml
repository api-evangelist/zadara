        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
        required: true
      summary: Get user api key
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /users/regenerate_token.json:
    post:
      tags:
      - Users
      description: Regenerates and returns a user's API key.
      operationId: regenerate_user_api_token

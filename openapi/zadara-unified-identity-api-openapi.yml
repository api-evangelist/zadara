components:
  schemas:
    UnifiedIDNode:
      type: object
      properties:
        server_id:
          type: integer
          example: 1
          xml:
            name: server-id
        vsa_id:
          type: integer
          example: 204
          xml:
            name: vsa-id
        hostname:
          type: string
          example: vsa-000000cc-zadara-qa17.zadarazios.com
        role:
          type: string
          enum:
          - active
          - standby
          example: active
        state:
          type: string
          enum:
          - normal
          - pending_registration
          - restore
          - stopped
          - degraded
          - failed
          example: normal
        gtid_executed:
          type: string
          example: d54f1f04-2a54-11f0-8cca-aaaa2222220a:597
          xml:
            name: gtid-executed
        version:
          type: string
          example: 25.07-104
      xml:
        name: uso-node
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Access-Key
      in: header

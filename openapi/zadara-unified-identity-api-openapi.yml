                        xml:
                          name: uso-nodes
                          wrapped: true
      summary: Show nodes
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /zios/unified_identity/nodes/{id}.json:
    get:
      tags:
      - Unified Identity
      description: Retrieves details of a specific node. To be run from either active or standby node.
      operationId: show_one_node
      parameters:
      - in: path
        name: id
        description: The ID of the server to retrieve details for.
        required: true
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                        example: 0
                      uso_node:
                        $ref: '#/components/schemas/UnifiedIDNode'
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                        example: 0
                      uso_node:
                        $ref: '#/components/schemas/UnifiedIDNode'
      summary: Show one node
      x-summary-source: derived
    delete:
      tags:
      - Unified Identity
      description: Removes a standby node which is pending registration. to be run from active node.
      operationId: remove_unified_id_standby_node
      parameters:
      - in: path
        name: id
        required: true
        description: The domain name of the standby node to remove.
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: error has occured
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Successfully removed the requested Standby Node.
                      status:
                        type: integer
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: error has occured
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Successfully removed the requested Standby Node.
                      status:
                        type: integer
                    xml:
                      name: response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: string
                  description: force the removal of standby instance in 'unavailable' state.
                  enum:
                  - 'YES'
                  - 'NO'
      summary: Remove unified id standby node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

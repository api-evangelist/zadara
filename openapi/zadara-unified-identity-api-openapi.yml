openapi: 3.2.0
info:
  title: Zadara Unified Identity API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Unified Identity across 2 of this provider''s published API definitions: zadara-object-storage-25.07.yml, zadara-object-storage-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Unified Identity
  description: Operations for Unified Identity.
paths:
  /zios/unified_identity/register_unified_id_active_node.json:
    post:
      tags:
      - Unified Identity
      description: Registers the current node as a active. To be run from a node with no unified id role.
      operationId: register_unified_id_active_node
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
      summary: Register unified id active node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /zios/unified_identity/add_unified_id_standby_node.json:
    post:
      tags:
      - Unified Identity
      description: Adds a new standby node to active. To be run from a active node.
      operationId: add_unified_id_standby_node

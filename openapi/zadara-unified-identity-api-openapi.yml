  /zios/unified_identity/nodes.json:
    get:
      tags:
      - Unified Identity
      description: Retrieves a list of all nodes in the cluster. To be run from either active or standby node.
      operationId: show_nodes
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                        example: 0
                      nodes_count:
                        type: integer
                        example: 1
                        xml:
                          name: nodes-count
                      uso_nodes:
                        type: array
                        items:
                          $ref: '#/components/schemas/UnifiedIDNode'
                        xml:
                          name: uso-nodes

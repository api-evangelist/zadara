          application/json:
            schema:
              type: object
              properties:
                standby_node_domain:
                  type: string
        description: Parameters for adding the standby.
        required: true
      summary: Add unified id standby node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /zios/unified_identity/register_unified_id_standby_node.json:
    post:
      tags:
      - Unified Identity
      description: Registers the current node as a standby. To be run from a node with no unified id role.
      operationId: register_unified_id_standby_node
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - active_node_domain
              - active_node_access
              - active_node_secret
              - interface
              properties:
                active_node_domain:
                  type: string
                  description: The domain name of the active.
                  example: active.example.com
                active_node_access:
                  type: string
                  description: The access key for the active.
                  example: access_key
                active_node_secret:
                  type: string
                  description: The secret key for the active.
                  example: secret_key
                interface:
                  type: string
                  enum:
                  - fe
                  - outnet
                  description: The network interface to use for connection.
                  example: fe
                test_only:
                  type: boolean
                  description: If true, performs a test connection to active node without persisting changes.
                  example: false
        description: Parameters for registering the standby.
        required: true
      summary: Register unified id standby node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /zios/unified_identity/detach_unified_id_node.json:
    post:
      tags:

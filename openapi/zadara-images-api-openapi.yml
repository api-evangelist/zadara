components:
  schemas:
    Image:
      type: object
      properties:
        name:
          type: string
          example: vc-00.00-1389.img
        size:
          type: integer
          example: 1961
        checksum:
          type: string
          example: b6b49dc25a4478b9e290b2d2a3a4ab26
        internal_id:
          type: integer
          example: 111
          xml:
            name: internal-id
        image_type:
          type: string
          example: vc
          xml:
            name: image-type
        recommended_vpsa_image:
          type: boolean
          example: false
          xml:
            name: recommended-vpsa-image
        default_vpsa_image:
          type: boolean
          example: false
          xml:
            name: default-vpsa-image
        default_zios_image:
          type: boolean
          example: false
          xml:
            name: default-zios-image
        default_zios_gen2_image:
          type: boolean
          example: false
          xml:
            name: default-zios-gen2-image
      xml:
        name: image
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
  parameters:
    perPageParam:
      name: per_page
      in: query
      required: false
      description: The total number of records to return.
      schema:
        type: integer
        default: 30
    pageParam:
      name: page
      in: query
      required: false
      description: The page number to start from.
      schema:
        type: integer
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Token
      in: header

                            display_name:
                              type: string
                              example: nginx
                              xml:
                                name: display-name
                            status:
                              type: string
                              example: normal
                            is_layered:
                              type: string
                              example: 'True'
                              xml:
                                name: is-layered
                            docker_id:
                              type: string
                              example: a785ba7493fd9009be71023045790697f334486b11a45f7e830652d39665a451
                              xml:
                                name: docker-id
                            license_state:
                              type: integer
                              xml:
                                name: license-state
                            capacity_mb:
                              type: integer
                              xml:
                                name: capacity-mb
                            repository:
                              type: string
                              example: nginx
                            tag:
                              type: string
                              example: latest
                            volume_id:
                              type: integer
                              xml:
                                name: volume-id
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: image
                        xml:
                          wrapped: true
                    xml:
                      name: show-images-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: img-00000001
                            display_name:
                              type: string
                              example: nginx
                              xml:
                                name: display-name
                            status:
                              type: string
                              example: normal
                            is_layered:
                              type: string
                              example: 'True'
                              xml:
                                name: is-layered
                            docker_id:
                              type: string
                              example: a785ba7493fd9009be71023045790697f334486b11a45f7e830652d39665a451
                              xml:
                                name: docker-id
                            license_state:
                              type: integer
                              xml:
                                name: license-state
                            capacity_mb:
                              type: integer
                              xml:
                                name: capacity-mb
                            repository:
                              type: string
                              example: nginx
                            tag:
                              type: string
                              example: latest
                            volume_id:
                              type: integer
                              xml:

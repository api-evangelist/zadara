                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: image
                        xml:
                          wrapped: true
                    xml:
                      name: show-images-response
      summary: Get all zcs images
      x-summary-source: derived
    post:
      tags:
      - Images
      description: Create an Image.
      operationId: create_zcs_image
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      image_name:
                        type: string
                        example: img-00000001
                        xml:
                          name: image-name
                      status:
                        type: integer
                    xml:
                      name: create-image-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      image_name:
                        type: string
                        example: img-00000001
                        xml:
                          name: image-name
                      status:
                        type: integer
                    xml:
                      name: create-image-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - mode
              - path
              properties:
                name:
                  type: string
                  description: Image display name
                  example: image1
                mode:
                  type: string
                  description: docker or volume
                  example: docker
                volume:
                  type: string
                  pattern: ^volume-[0-9a-f]{8}$
                  description: when importing from volume , provide the volume name (e.g volume-00000001)
                path:
                  type: string
                  description: 'The image path: when importing from volume provide path to image . when pulling from repository , provide image name. examples: docker/redis.tar (from volume)  /  ubuntu (from docker)'
                  example: busybox
        required: true
      summary: Create zcs image
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

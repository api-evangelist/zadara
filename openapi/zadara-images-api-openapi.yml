openapi: 3.2.0
info:
  title: Zadara Images API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Images across 4 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-vpsa-25.07.yml, zadara-command-center-openapi.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Images
  description: Operations involving images.
paths:
  /clouds/{cloud_name}/images.json:
    get:
      tags:
      - Images
      description: Returns a list of Cloud's registered images.
      operationId: get_all_images
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all images
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/images/{id}.json:
    get:
      tags:
      - Images
      description: Returns a single image's details.
      operationId: get_image
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  image:
                    $ref: '#/components/schemas/Image'
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  image:
                    $ref: '#/components/schemas/Image'
      summary: Get image
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/images/{id}/set_default.json:
    post:
      tags:
      - Images
      description: Sets an image as the default for a Cloud.
      operationId: set_default_image
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      summary: Set default image
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/images/{id}/recommended.json:
    post:
      tags:
      - Images
      description: Sets an image as the recommended VPSA image for a Cloud.
      operationId: set_recommended
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:

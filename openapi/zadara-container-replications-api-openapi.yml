components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ReplicationJob:
      type: object
      properties:
        created_at:
          type: string
          format: date_time
          xml:
            name: created-at
        modified_at:
          type: string
          format: date_time
          xml:
            name: modified-at
        state:
          type: string
          example: enabled
        display_name:
          type: string
          example: local job
          xml:
            name: display-name
        source_account:
          type: string
          example: 104248df08414c659b269e09b355b08b
          xml:
            name: source-account
        source_bucket:
          type: string
          example: src1
          xml:
            name: source-bucket
        destination_bucket:
          type: string
          example: target1
          xml:
            name: destination-bucket
        destination_ssl:
          type: boolean
          example: true
          xml:
            name: destination-ssl
        target_id:
          type: string
          example: replication-target-1727775350
          xml:
            name: target-id
        prefix:
          type: string
          example: abc
        methods:
          type: array
          items:
            type: string
            xml:
              name: method

openapi: 3.2.0
info:
  title: Zadara Container Replications API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Container Replications across 2 of this provider''s published API definitions: zadara-object-storage-25.07.yml, zadara-object-storage-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Container Replications
  description: Operations for Container Replications
paths:
  /zios/container_replications.json:
    get:
      tags:
      - Container Replications
      x-roles: account_admin
      description: Show container replication jobs.
      operationId: show_container_replication_jobs
      parameters:
      - in: query
        name: src_bucket
        description: Filter by source bucket of replication.
        schema:
          type: string
      - in: query
        name: include_deleted
        description: Show also deleted replication jobs.
        schema:
          type: boolean
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    xml:
                      name: show-container-replications-response
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                        example: 0
                      replication_jobs_count:
                        type: integer
                        example: 1
                        xml:
                          name: replication-jobs-count
                      replication_jobs:
                        type: array
                        xml:
                          name: replication-jobs
                          wrapped: true
                        items:
                          $ref: '#/components/schemas/ReplicationJob'
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    xml:
                      name: show-container-replications-response
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                        example: 0
                      replication_jobs_count:
                        type: integer
                        example: 1
                        xml:
                          name: replication-jobs-count
                      replication_jobs:
                        type: array
                        xml:
                          name: replication-jobs
                          wrapped: true
                        items:
                          $ref: '#/components/schemas/ReplicationJob'
      summary: Show container replication jobs
      x-summary-source: derived
    post:
      tags:
      - Container Replications
      x-roles: account_admin
      description: Create a container replication job.
      operationId: create_container_replication
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: create-container-replication-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: create-container-replication-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - src_bucket
              - target_id
              - dst_bucket
              properties:
                display_name:
                  type: string
                  description: Display Name for container replication
                  example: replication 1
                src_bucket:
                  type: string
                  description: Source bucket name for replication
                  example: bucket1
                target_id:
                  type: string
                  description: Replication Target ID
                  example: target-7162313
                dst_bucket:
                  type: string
                  description: Destination bucket name for replication
                  example: us-east-1
                prefix:
                  type: string
                  description: Bucket objects prefix to replicate
                  example: abc
                  default: ''
                delete_propagation:
                  type: boolean
                  description: Delete propagation
                  example: true
                  default: false
                delete_marker_propagation:
                  type: boolean
                  description: Delete marker propagation
                  example: true
                  default: false
                force_dest_bucket_creation:
                  type: boolean
                  description: Force destination bucket creation
                  example: true
                  default: false
        required: true
      summary: Create container replication
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

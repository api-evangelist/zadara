openapi: 3.2.0
info:
  title: Zadara Snapshot Policies API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Snapshot Policies across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Snapshot Policies
  description: Operations for Snapshot Policies.
paths:
  /snapshot_policies.json:
    get:
      tags:
      - Snapshot Policies
      description: Return a list of Snapshot Policies.
      operationId: get_all_snapshot_policies
      security:
      - api_key: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      snapshot_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: policy-00000002
                            display_name:
                              type: string
                              example: Hourly Snapshots for a Day
                              xml:
                                name: display-name
                            create_policy:
                              type: string
                              example: 0 * * * *
                              xml:
                                name: create-policy
                            delete_policy:
                              type: string
                              example: N24
                              xml:
                                name: delete-policy
                            destination_delete_policy:
                              type: string
                              example: N24
                              xml:
                                name: destination-delete-policy
                            paused:
                              type: string
                              example: 'NO'
                            create_empty:
                              type: boolean
                              xml:
                                name: create-empty
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: snapshot-policy
                        xml:
                          name: snapshot-policies
                          wrapped: true
                    xml:
                      name: show-snapshot-policies-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      snapshot_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: policy-00000002
                            display_name:
                              type: string
                              example: Hourly Snapshots for a Day
                              xml:
                                name: display-name
                            create_policy:
                              type: string
                              example: 0 * * * *
                              xml:
                                name: create-policy
                            delete_policy:
                              type: string
                              example: N24
                              xml:
                                name: delete-policy
                            destination_delete_policy:
                              type: string
                              example: N24
                              xml:
                                name: destination-delete-policy
                            paused:
                              type: string
                              example: 'NO'
                            create_empty:
                              type: boolean
                              xml:
                                name: create-empty
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: snapshot-policy
                        xml:
                          name: snapshot-policies
                          wrapped: true
                    xml:
                      name: show-snapshot-policies-response
      summary: Get all snapshot policies
      x-summary-source: derived
    post:
      tags:
      - Snapshot Policies
      description: Create a Snapshot Policy.
      operationId: create_snapshot_policy
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000005
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
                    xml:
                      name: create-snapshot-policy-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000005
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
                    xml:
                      name: create-snapshot-policy-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - create_policy
              - delete_policy
              properties:
                name:
                  type: string
                  description: Snapshot policy name
                  example: my-policy
                create_policy:
                  type: string
                  description: Define the minimal interval of snapshot creation. The format is similar to a cron job - Minute, Hour, Day of Month, Month, Day Of Week (Minute supports random value - D0)
                  example: 5 * * * *
                delete_policy:
                  type: string
                  description: minutes hours days or N number_of_snapshots_to_keep.
                  example: N7
                destination_policy:
                  type: string
                  description: Relevant only for Remote Mirroring where the remote Volume snapshot deletion policy is different than the source Volume. Set N number_of_snapshots_to_keep.
                  example: N6
                empty:
                  type: string
                  description: Allow empty creation snapshots (snapshot even when no data has changed)
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'NO'
                attach:
                  type: string
                  description: Attach policy by default for new volumes
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'NO'
        required: true
      summary: Create snapshot policy
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /snapshot_policies/{id}.json:
    get:
      tags:
      - Snapshot Policies
      description: Show a Snapshot Policy.
      operationId: get_snapshot_policy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^policy-[0-9a-f]{8}$
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'

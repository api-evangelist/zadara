            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      snapshot_policy:
                        type: object
                        properties:
                          name:
                            type: string
                            example: policy-00000002
                          display_name:
                            type: string
                            example: Hourly Snapshots for a Day
                            xml:
                              name: display-name
                          create_policy:
                            type: string
                            example: 0 * * * *
                            xml:
                              name: create-policy
                          delete_policy:
                            type: string
                            example: N24
                            xml:
                              name: delete-policy
                          destination_delete_policy:
                            type: string
                            example: N24
                            xml:
                              name: destination-delete-policy
                          paused:
                            type: string
                            example: 'NO'
                          created_at:
                            type: string
                            format: date_time
                            xml:
                              name: created-at
                          modified_at:
                            type: string
                            format: date_time
                            xml:
                              name: modified-at
                          create_empty:
                            type: string
                            xml:
                              name: create-empty
                          attach:
                            type: string
                          destination:
                            type: string
                        xml:
                          name: snapshot-policy
                    xml:
                      name: show-one-snapshot-policy-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      snapshot_policy:
                        type: object
                        properties:
                          name:
                            type: string
                            example: policy-00000002
                          display_name:
                            type: string
                            example: Hourly Snapshots for a Day
                            xml:
                              name: display-name
                          create_policy:
                            type: string
                            example: 0 * * * *
                            xml:
                              name: create-policy
                          delete_policy:
                            type: string
                            example: N24
                            xml:
                              name: delete-policy
                          destination_delete_policy:
                            type: string
                            example: N24
                            xml:
                              name: destination-delete-policy
                          paused:
                            type: string
                            example: 'NO'
                          created_at:
                            type: string
                            format: date_time
                            xml:
                              name: created-at
                          modified_at:
                            type: string
                            format: date_time
                            xml:
                              name: modified-at
                          create_empty:
                            type: string
                            xml:
                              name: create-empty
                          attach:
                            type: string
                          destination:
                            type: string
                        xml:
                          name: snapshot-policy
                    xml:
                      name: show-one-snapshot-policy-response
      summary: Get snapshot policy
      x-summary-source: derived
    delete:
      tags:
      - Snapshot Policies
      description: Delete a Snapshot Policy. The policy must not be attached to any Volume
      operationId: delete_snapshot_policy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000005
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
                    xml:
                      name: delete-snapshot-policy-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000005
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
                    xml:
                      name: delete-snapshot-policy-response
      summary: Delete snapshot policy
      x-summary-source: derived
    put:
      tags:
      - Snapshot Policies
      description: Update a Snapshot Policy creation and deletion rules. The update will apply to all Volumes to which this policy is applied
      operationId: update_snapshot_policy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000003
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_policy_name:
                        type: string
                        example: policy-00000003
                        xml:
                          name: snapshot-policy-name
                      status:
                        type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - create_policy
              - delete_policy
              properties:
                displayname:
                  type: string
                  description: Snapshot policy name
                  example: my-policy
                create_policy:
                  type: string
                  description: Define the minimal interval of snapshot creation. The format is similar to a cron job - Minute, Hour, Day of Month, Month, Day Of Week (Minute supports random value - D0)
                  example: 5 * * * *
                delete_policy:
                  type: string
                  description: minutes hours days or N number_of_snapshots_to_keep.
                  example: N7
                destination_policy:
                  type: string
                  description: Relevant only for Remote Mirroring where the remote Volume snapshot deletion policy is different than the source Volume. Set N number_of_snapshots_to_keep.
                  example: N6
                empty:
                  type: string
                  description: Allow empty creation snapshots (snapshot even when no data has changed)
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'NO'
        required: true
      summary: Update snapshot policy
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

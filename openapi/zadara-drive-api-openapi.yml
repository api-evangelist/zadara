openapi: 3.2.0
info:
  title: Zadara Drive API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Drive across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Drive
  description: Operations involving drives.
paths:
  /clouds/{cloud_name}/drives.json:
    get:
      tags:
      - Drive
      description: Returns a list of all the drives in a Zadara Storage Cloud.
      operationId: get_all_drives
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drive'
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drive'
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all drives
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/drives/{id}.json:
    get:
      tags:
      - Drive
      description: Returns detailed information about a single drive.
      operationId: get_drive
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drive:
                    $ref: '#/components/schemas/Drive'
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drive:
                    $ref: '#/components/schemas/Drive'
      summary: Get drive
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/drives/{id}/comments.json:
    get:
      tags:
      - Drive
      description: Returns the list of the drive comments.
      operationId: list_drive_comments
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  comments:
                    type: object
                    properties:
                      comment:
                        type: object
                        properties:
                          content:
                            type: string
                            example: '**test comment**'
                          severity_id:
                            type: string
                            example: '0'
                            xml:
                              name: severity-id
                          severity_name:
                            type: string
                            example: critical
                            xml:
                              name: severity-name
                          created_by:
                            type: string
                            example: '1'
                            xml:
                              name: created-by
                          created_at:
                            type: string
                            example: '2017-01-04T12:23:02+02:00'
                            xml:
                              name: created-at
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  comments:
                    type: object
                    properties:
                      comment:
                        type: object
                        properties:
                          content:
                            type: string
                            example: '**test comment**'
                          severity_id:
                            type: string
                            example: '0'
                            xml:
                              name: severity-id
                          severity_name:
                            type: string
                            example: critical
                            xml:
                              name: severity-name
                          created_by:
                            type: string
                            example: '1'
                            xml:
                              name: created-by
                          created_at:
                            type: string
                            example: '2017-01-04T12:23:02+02:00'
                            xml:
                              name: created-at
                  count:
                    type: integer
      summary: List drive comments
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/drives/{id}/replace.json:
    post:
      tags:
      - Drive
      description: Replaces a drive which is allocated to a VPSA. This command will allocate a new drive of the same drive type for the VPSA, replace the drive in the RaidGroup and free the replaced drive back to the Zadara Cloud repository.
      operationId: replace_allocated_drive
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faulty:
                  type: boolean
      summary: Replace allocated drive
      x-summary-source: derived
    servers:
    - url: https://localhost/api

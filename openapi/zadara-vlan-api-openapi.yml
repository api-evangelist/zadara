openapi: 3.2.0
info:
  title: Zadara VLAN API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged VLAN across 4 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-provisioning-portal-25.07.yml, zadara-command-center-openapi.yml, zadara-provisioning-portal-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: https://localhost/api/v2
tags:
- name: VLAN
  description: Operations involving VLAN.
paths:
  /clouds/{cloud_name}/vlans.json:
    get:
      tags:
      - VLAN
      description: Return the list of cloud provisioned vlans.
      operationId: get_vlans
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vlans:
                    type: array
                    items:
                      type: object
                      properties:
                        comment:
                          type: string
                          example: my comment
                        tenants:
                          type: array
                          items:
                            type: integer
                            xml:
                              name: tenant
                          xml:
                            wrapped: true
                        allocated:
                          type: boolean
                        reserved:
                          type: boolean
                        vlan_id:
                          type: integer
                          xml:
                            name: vlan-id
                        all_vrids:
                          type: string
                          xml:
                            name: all-vrids
                      xml:
                        name: vlan
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vlans:
                    type: array
                    items:
                      type: object
                      properties:
                        comment:
                          type: string
                          example: my comment
                        tenants:
                          type: array
                          items:
                            type: integer
                            xml:
                              name: tenant
                          xml:
                            wrapped: true
                        allocated:
                          type: boolean
                        reserved:
                          type: boolean
                        vlan_id:
                          type: integer
                          xml:
                            name: vlan-id
                        all_vrids:
                          type: string
                          xml:
                            name: all-vrids
                      xml:
                        name: vlan
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get vlans
      x-summary-source: derived
    post:
      tags:
      - VLAN
      description: Add provisioned vlan or a range to the cloud.
      operationId: add_provisioned_vlan_or_range
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  allocated_vlan:
                    type: integer
                    xml:
                      name: allocated-vlan
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  allocated_vlan:
                    type: integer
                    xml:
                      name: allocated-vlan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - range_start
              properties:
                range_start:
                  type: integer
                  example: 55
                range_end:
                  type: integer
                  example: 80
                  description: If not provided, range_start will be added as single vlan
        required: true
      summary: Add provisioned vlan or range
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/vlans/{vlan_id}.json:

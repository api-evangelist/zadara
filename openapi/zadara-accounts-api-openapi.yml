                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                        example: 1
                      accounts:
                        type: array
                        xml:
                          wrapped: true
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: zios_admin
                            id:
                              type: string
                              example: 91ea5bd5cdc04adb9f5e3c00a346c463
                          xml:
                            name: account
                    xml:

openapi: 3.2.0
info:
  title: Zadara Accounts API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Accounts across 2 of this provider''s published API definitions: zadara-object-storage-25.07.yml, zadara-object-storage-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Accounts
  description: Operations for Accounts.
paths:
  /zios/accounts.json:
    get:
      tags:
      - Accounts
      description: List all accounts.
      operationId: get_all_accounts
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      - in: query
        name: active
        description: Retrieves only active accounts. Relevant only when using remote authentication.
        schema:
          type: boolean
      - in: query
        name: filter_field
        description: A field to filter the accounts by.
        schema:
          type: string
          enum:
          - name
          - id
      - in: query
        name: filter_value
        description: A substring to filter the accounts by.
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            update_time:
                              type: string
                              example: '146182175.08'
                              xml:
                                name: update-time
                            name:
                              type: string
                              example: zios_admin
                            is_system_account:
                              type: string
                              example: 'True'
                              xml:
                                name: is-system-account
                            public_url_list:
                              type: array
                              items:
                                type: string
                                example: https://vsa-0000018f-zadara.zadarazios.com:443/v1/AUTH_91ea5bd5cdc04adb9f5e3c00a346c463
                                xml:
                                  name: public-url
                              xml:
                                name: public-url-list
                                wrapped: true
                            enabled:
                              type: string
                              example: 'True'
                            email:
                              type: string
                              example: eyalzadarastorage.com
                            state:
                              type: string
                              example: normal
                            create_time:
                              type: string
                              example: '1461821754.96'
                              xml:
                                name: create-time
                            id:
                              type: string
                              example: 91ea5bd5cdc04adb9f5e3c00a346c463
                            description:
                              type: string
                              example: None
                          xml:
                            name: account
                        xml:
                          wrapped: true
                    xml:
                      name: show-accounts-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            update_time:
                              type: string
                              example: '146182175.08'
                              xml:
                                name: update-time
                            name:
                              type: string
                              example: zios_admin
                            is_system_account:
                              type: string
                              example: 'True'
                              xml:
                                name: is-system-account
                            public_url_list:
                              type: array
                              items:
                                type: string
                                example: https://vsa-0000018f-zadara.zadarazios.com:443/v1/AUTH_91ea5bd5cdc04adb9f5e3c00a346c463
                                xml:
                                  name: public-url
                              xml:
                                name: public-url-list
                                wrapped: true
                            enabled:
                              type: string
                              example: 'True'
                            email:
                              type: string
                              example: eyalzadarastorage.com
                            state:
                              type: string
                              example: normal
                            create_time:
                              type: string
                              example: '1461821754.96'
                              xml:
                                name: create-time
                            id:
                              type: string
                              example: 91ea5bd5cdc04adb9f5e3c00a346c463
                            description:
                              type: string
                              example: None
                          xml:
                            name: account
                        xml:
                          wrapped: true
                    xml:
                      name: show-accounts-response
      summary: Get all accounts
      x-summary-source: derived
    post:
      tags:
      - Accounts
      description: Adds a new account.
      operationId: create_account
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      account_id:
                        type: string
                        example: da39fd0e8a484156af0c22e84d936da0
                        xml:
                          name: account-id
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      account_id:
                        type: string
                        example: da39fd0e8a484156af0c22e84d936da0
                        xml:
                          name: account-id
                    xml:
                      name: response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Account name
        required: true
      summary: Create account
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /zios/accounts/account_names.json:

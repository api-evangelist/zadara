                              example: 91ea5bd5cdc04adb9f5e3c00a346c463
                          xml:
                            name: account
                    xml:
                      name: show-account-names-response
      summary: Get all account names
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

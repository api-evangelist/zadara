                      wrapped: true
                    items:
                      type: object
                      xml:
                        name: virtual-controller
                      properties:
                        name:
                          type: string
                          example: vc-0:test
                        state:
                          type: string
                          example: Active
                        type:
                          type: string
                          example: '200'
                        node:
                          type: string
                          example: node1
                        be_ip:
                          type: string
                          xml:
                            name: be-ip
                          example: 150.50.3.103
                        be_vlan_id:
                          type: integer
                          xml:
                            name: be-vlan-id
                          example: 119
                        fe_ip:
                          type: string
                          example: 150.50.2.103
                          xml:
                            name: fe-ip
                        fe_vlan_id:
                          type: integer
                          xml:
                            name: fe-vlan-id
                          example: 220
                        hb_ip:
                          type: string
                          example: 150.50.0.101
                          xml:
                            name: hb-ip
                        hb_vlan_id:
                          type: integer
                          example: 221
                          xml:
                            name: hb-vlan-id
                  count:
                    type: integer
      summary: List vpsas vc
      x-summary-source: derived
    servers:

openapi: 3.2.0
info:
  title: Zadara VPSA API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged VPSA across 4 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-provisioning-portal-25.07.yml, zadara-command-center-openapi.yml, zadara-provisioning-portal-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: https://localhost/api/v2
tags:
- name: VPSA
paths:
  /clouds/{cloud_name}/vpsas.json:
    get:
      tags:
      - VPSA
      description: Returns a list of all VPSA.
      operationId: get_all_vpsas
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vpsas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vpsa'
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vpsas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vpsa'
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all vpsas
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/vpsas/{id}.json:
    get:
      tags:
      - VPSA
      description: Returns the details for a single VPSA.
      operationId: get_vpsa_from_cloud
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA 'id' or 'internal-name' value as returned by get_all_vpsas.
        required: true
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vpsa:
                    $ref: '#/components/schemas/Vpsa'
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  vpsa:
                    $ref: '#/components/schemas/Vpsa'
      summary: Get vpsa from cloud
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/vpsas/{id}/drives.json:
    get:
      tags:
      - VPSA
      description: Returns the list of a VPSA's drives.
      operationId: get_all_vpsa_drives
      parameters:
      - in: path
        name: cloud_name
        description: The cloud 'name' as returned by get_all_clouds. example zadaralab01
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA 'id' or 'internal-name' value as returned by get_all_vpsas.
        required: true
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-00000012
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: ubuntu_sata-51
                        size:
                          type: integer
                        type:
                          type: string
                          example: SAS 136GB 15000RPM
                        address:
                          type: string
                          example: 0:0:6 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: SEAGATE ST3300657SS-H
                          xml:
                            name: product-id
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-00000012
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: ubuntu_sata-51
                        size:
                          type: integer
                        type:
                          type: string
                          example: SAS 136GB 15000RPM
                        address:
                          type: string
                          example: 0:0:6 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: SEAGATE ST3300657SS-H
                          xml:
                            name: product-id
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all vpsa drives
      x-summary-source: derived
    post:
      tags:
      - VPSA
      description: Add drives to VPSA.
      operationId: add_drives
      parameters:
      - in: path
        name: cloud_name
        description: The cloud 'name' as returned by get_all_clouds. example zadaralab01
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA 'id' or 'internal-name' value as returned by get_all_vpsas.
        required: true
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  message:
                    type: string
                    example: Request sent successfully. Check central log for details
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  message:
                    type: string
                    example: Request sent successfully. Check central log for details
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - drive_type
              - quantity
              - skip_validation
              properties:
                drive_type:
                  type: string
                  example: SATA_2793GB_5940RPM
                  description: Drive type internal name
                quantity:
                  type: integer
                  example: 2
                  description: Number of drives to add
                skip_validation:
                  type: boolean
                  example: true
                  description: Skips maximum drive validation. Use for admin only. Please notice that exceeding the number of drives allowed will waive the support for the VPSA
        required: true
      summary: Add drives
      x-summary-source: derived
    servers:
    - url: https://localhost/api

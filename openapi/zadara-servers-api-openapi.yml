openapi: 3.2.0
info:
  title: Zadara Servers API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Servers across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Servers
  description: Operations involving Servers.
paths:
  /servers.json:
    get:
      tags:
      - Servers
      description: Show all Servers.
      operationId: get_all_servers
      security:
      - api_key: []
      parameters:
      - in: query
        name: extname
        description: server ID to filter by.
        schema:
          type: string
      - in: query
        name: displayname
        description: server display name to filter by.
        schema:
          type: string
      - in: query
        name: comment
        description: server comment content to filter by.
        schema:
          type: string
      - in: query
        name: tagkey
        description: server tag key to filter by.
        schema:
          type: string
      - in: query
        name: tagvalue
        description: server tag value to filter by.
        schema:
          type: string
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      servers:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              pattern: ^srv-[0-9a-f]{8}$
                              example: srv-00000001
                            display_name:
                              type: string
                              example: server01
                              xml:
                                name: display-name
                            iqn:
                              type: string
                              example: 127.0.0.1
                            iscsi_ip:
                              type: string
                              example: None
                              xml:
                                name: iscsi-ip
                            ipsec_iscsi:
                              type: string
                              example: '0'
                              xml:
                                name: ipsec-iscsi
                            ipsec_nfs:
                              type: string
                              example: '0'
                              xml:
                                name: ipsec-nfs
                            status:
                              type: string
                              example: Active
                            os:
                              type: string
                              example: None
                            registered:
                              type: string
                              example: 'no'
                            last_check_time:
                              type: string
                              format: date_time
                              xml:
                                name: last-check-time
                            last_state_change_time:
                              type: string
                              format: date_time
                              xml:
                                name: last-state-change-time
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: server
                        xml:
                          wrapped: true
                    xml:
                      name: show-servers-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      servers:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              pattern: ^srv-[0-9a-f]{8}$
                              example: srv-00000001
                            display_name:
                              type: string
                              example: server01
                              xml:
                                name: display-name
                            iqn:
                              type: string
                              example: 127.0.0.1
                            iscsi_ip:
                              type: string
                              example: None
                              xml:
                                name: iscsi-ip
                            ipsec_iscsi:
                              type: string
                              example: '0'
                              xml:
                                name: ipsec-iscsi
                            ipsec_nfs:
                              type: string
                              example: '0'
                              xml:
                                name: ipsec-nfs
                            status:
                              type: string
                              example: Active
                            os:
                              type: string
                              example: None
                            registered:
                              type: string
                              example: 'no'
                            last_check_time:
                              type: string
                              format: date_time
                              xml:
                                name: last-check-time
                            last_state_change_time:
                              type: string
                              format: date_time
                              xml:
                                name: last-state-change-time
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: server
                        xml:
                          wrapped: true
                    xml:
                      name: show-servers-response
      summary: Get all servers
      x-summary-source: derived
    post:
      tags:
      - Servers
      description: Create a new Server. IQN or iSCSI ip or FC WWPN must be provided.
      operationId: create_server
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: create-server-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: create-server-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  description: The new server display name
                  example: my-server
                os:
                  type: string
                  description: Server's OS
                  enum:
                  - Windows
                  - Linux
                  - Solaris
                  - AIX
                  - ESXi
                  example: Windows
                vpsachapuser:
                  type: string
                  description: VPSA chap user.
                  example: johndoe
                vpsachapsecret:
                  type: string
                  description: VPSA chap secret. 12-16 characters.
                  example: tgbujmedcrfv
                hostchapuser:
                  type: string
                  description: Host chap user.
                hostchapsecret:
                  type: string
                  description: Host chap secret. 12-16 characters.
                iqn:
                  type: string
                  pattern: ^(?:iqn.[0-9]{4}-[0-9]{2}(?:.[A-Za-z])).+
                  description: iSCSI Qualified Name
                iscsi:
                  type: string
                  description: The server's iSCSI IP
                  example: 10.11.12.13
                ipsec_iscsi:
                  type: string
                  description: Enable ipsec for iscsi for the server
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                ipsec_nfs:
                  type: string
                  description: Enable ipsec for nfs for the server
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                wwpns:
                  type: array
                  items:
                    type: string
                  description: Fibre channel wwpns
                  example:
                  - 21000024ff7bc174
                  - 21000024ff7bc175
                force:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                  description: force server creation
                  default: 'NO'
                  example: 'YES'
        required: true
      summary: Create server
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /servers/{id}.json:
    get:
      tags:
      - Servers
      description: Show a single Server.
      operationId: get_server
      parameters:
      - in: path

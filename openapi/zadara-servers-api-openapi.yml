                              xml:
                                name: access-type
                            initiator:
                              type: string
                              example: iqn.1991-05.com.microsoft:vm91_win2008r2.zadara.lab
                            target:
                              type: string
                              example: iqn.test.com.zadarastorage:vsa-00000000:1
                            count:
                              type: integer
                            vc:
                              type: integer
                            connected:
                              type: integer
                            server_name:
                              type: string
                              example: srv-00000003
                              xml:
                                name: server-name
                            server_display_name:
                              type: string
                              example: VM91_WIN2008R2
                              xml:
                                name: server-display-name
                          xml:
                            name: session
                        xml:
                          wrapped: true
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      count:
                        type: integer
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            access_type:
                              type: string
                              example: ISCSI
                              xml:
                                name: access-type
                            initiator:
                              type: string
                              example: iqn.1991-05.com.microsoft:vm91_win2008r2.zadara.lab
                            target:
                              type: string
                              example: iqn.test.com.zadarastorage:vsa-00000000:1
                            count:
                              type: integer
                            vc:
                              type: integer
                            connected:
                              type: integer
                            server_name:
                              type: string
                              example: srv-00000003
                              xml:
                                name: server-name
                            server_display_name:
                              type: string
                              example: VM91_WIN2008R2
                              xml:
                                name: server-display-name
                          xml:
                            name: session
                        xml:
                          wrapped: true
                    xml:
                      name: response
      summary: List server sessions
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /servers/session.json:
    delete:
      tags:
      - Servers
      description: Delete server's session.
      operationId: delete_server_session
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - initiator
              - target
              properties:
                initiator:
                  type: string
                  description: Session's Initiator
                  example: '2109034534'
                target:
                  type: string
                  description: Session's Target
                  example: '2444034534'
        required: true
      summary: Delete server session
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /servers/{id}/rename.json:
    post:
      tags:
      - Servers
      description: Rename a Server.
      operationId: rename_server
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^srv-[0-9a-f]{8}$
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: rename-server-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: rename-server-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - new_name
              properties:
                new_name:
                  type: string
                  description: The server new name
                  example: new-server-name
        required: true
      summary: Rename server
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /servers/{id}/config.json:
    post:
      tags:
      - Servers
      description: Update a Server configuration.
      operationId: update_server
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^srv-[0-9a-f]{8}$
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: update-server-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: update-server-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                display_name:
                  type: string
                  description: The server display name
                os:
                  type: string
                  description: Server's OS
                  enum:
                  - Windows
                  - Linux
                  - Solaris
                  - AIX
                  - ESXi
                  example: Windows
                vpsachapuser:
                  type: string
                  description: VPSA chap user.
                vpsachapsecret:
                  type: string
                  description: VPSA chap secret. 12-16 characters.
                hostchapuser:
                  type: string
                  description: Host chap user.
                hostchapsecret:
                  type: string
                  description: Host chap secret. 12-16 characters.
                iqn:
                  type: string
                  pattern: ^(?:iqn\.[0-9]{4}-[0-9]{2}(?:\.[A-Za-z](?:[A-Za-z0-9\-]*[A-Za-z0-9])?)+(?::.*)?|eui\.[0-9A-Fa_f]{16})'
                iscsi:
                  type: string
                  description: The server's iSCSI IP
                ipsec_iscsi:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                ipsec_nfs:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                monitoring:
                  type: string
                  description: connectivity monitoring
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                remove_wwpns:
                  type: array
                  items:
                    type: string
                  description: wwpns to remove
                add_wwpns:
                  type: array
                  items:
                    type: string
                  description: wwpns to add
        required: true
      summary: Update server

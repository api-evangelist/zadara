                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server:
                        type: object
                        properties:
                          name:
                            type: string
                            example: srv-00000001
                          display_name:
                            type: string
                            example: server01
                            xml:
                              name: display-name
                          iqn:
                            type: string
                            example: 127.0.0.1
                          iscsi_ip:
                            type: string
                            example: None
                            xml:
                              name: iscsi-ip
                          ipsec_iscsi:
                            type: string
                            example: '0'
                            xml:
                              name: ipsec-iscsi
                          ipsec_nfs:
                            type: string
                            example: '0'
                            xml:
                              name: ipsec-nfs
                          status:
                            type: string
                            example: Active
                          os:
                            type: string
                            example: None
                          registered:
                            type: string
                            example: 'no'
                          last_check_time:
                            type: string
                            format: date_time
                            xml:
                              name: last-check-time
                          last_state_change_time:
                            type: string
                            format: date_time
                            xml:
                              name: last-state-change-time
                          created_at:
                            type: string
                            format: date_time
                            xml:
                              name: created-at
                          modified_at:
                            type: string
                            format: date_time
                            xml:
                              name: modified-at
                    xml:
                      name: show-one-server-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server:
                        type: object
                        properties:
                          name:
                            type: string
                            example: srv-00000001
                          display_name:
                            type: string
                            example: server01
                            xml:
                              name: display-name
                          iqn:
                            type: string
                            example: 127.0.0.1
                          iscsi_ip:
                            type: string
                            example: None
                            xml:
                              name: iscsi-ip
                          ipsec_iscsi:
                            type: string
                            example: '0'
                            xml:
                              name: ipsec-iscsi
                          ipsec_nfs:
                            type: string
                            example: '0'
                            xml:
                              name: ipsec-nfs
                          status:
                            type: string
                            example: Active
                          os:
                            type: string
                            example: None
                          registered:
                            type: string
                            example: 'no'
                          last_check_time:
                            type: string
                            format: date_time
                            xml:
                              name: last-check-time
                          last_state_change_time:
                            type: string
                            format: date_time
                            xml:
                              name: last-state-change-time
                          created_at:
                            type: string
                            format: date_time
                            xml:
                              name: created-at
                          modified_at:
                            type: string
                            format: date_time
                            xml:
                              name: modified-at
                    xml:
                      name: show-one-server-response
      summary: Get server
      x-summary-source: derived
    delete:
      tags:
      - Servers
      description: Delete a Server.
      operationId: delete_server
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: delete-server-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      server_name:
                        type: string
                        example: srv-00000001
                        xml:
                          name: server-name
                      status:
                        type: integer
                    xml:
                      name: delete-server-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                  description: force server deletion
                  default: 'NO'
                  example: 'YES'
      summary: Delete server
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /servers/{id}/sessions.json:
    get:
      tags:
      - Servers
      description: Lists server's sessions.
      operationId: list_server_sessions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^srv-[0-9a-f]{8}$
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      count:
                        type: integer
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            access_type:
                              type: string

  /volumes/{id}/update_protection.json:
    post:
      tags:
      - Volumes
      description: Sets capacity thresholds. A support ticket will be created when
        your Volume reaches specified capacity thresholds.
      operationId: update_protection
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        pattern: ^volume-[0-9a-f]{8}$
        required: true
      - in: body
        name: update_protection
        required: true
        schema:
          type: object
          properties:
            alertmode:
              type: integer
              description: Alert me when it is estimated that the Volume will be at
                full capacity in X minutes.
              example: 360
            emergencymode:
              type: integer
              description: When the Volume has less than this number of GB left, the
                volume will start deleting snapshots, starting with the oldest, and
                trigger auto expand.
              example: 360
            capacityhistory:
              type: integer
              description: Window size in minutes which is used to calculate the rate
                of which free Volume capacity is consumed. This rate is used to calculate
                the estimated time until a Volume is full
              example: 60
            autoexpand:
              type: string
              description: Enable capacity auto expand
              enum:
              - "YES"
              - "NO"
              example: "YES"
            maxcapacity:
              type: string
              description: Max Capacity to expand in GB followed by the letter G.
              example: 300G
            autoexpandby:
              type: string
              description: Capacity to expand by in GB followed by the letter G.
              example: 300G
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  vol_name:
                    type: string
                    example: volume-00000002
                    xml:
                      name: vol-name
                  status:
                    type: integer
                xml:
                  name: update-volume-capacity-thresholds-response
  /volumes/{id}/update_performance_thresholds.json:
    post:
      tags:
      - Volumes
      description: Sets performance thresholds. A support ticket will be created when
        your volume reaches specified performance thresholds.
      operationId: update_vol_perf_threshold
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        pattern: ^volume-[0-9a-f]{8}$
        required: true
      - in: body
        name: update_vol_perf_threshold
        required: true
        schema:
          type: object
          properties:
            read_iops_limit:
              type: integer
              description: Alert me when the average read IOPS for this volume exceeds
                this number of IOPS.
              example: 5000
            read_mbps_limit:
              type: integer
              description: Alert me when the average read throughput for this volume
                exceeds this number of MB/s.
              example: 100
            read_latency_limit:
              type: integer
              description: Alert me when the average read latency for this volume
                exceeds this number of ms.
              example: 50
            write_iops_limit:
              type: integer
              description: Alert me when the average write IOPS for this volume exceeds
                this number of IOPS.
              example: 5000
            write_mbps_limit:
              type: integer
              description: Alert me when the average write throughput for this volume
                exceeds this number of MB/s.
              example: 100
            write_latency_limit:
              type: integer
              description: Alert me when the average write latency for this volume
                exceeds this number of ms.
              example: 50
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  vol_name:
                    type: string
                    example: volume-00000005
                    xml:
                      name: vol-name
                  status:
                    type: integer
                xml:
                  name: update-volume-perf-thresholds-response

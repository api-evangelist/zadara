              example: s3.eu-central-1.amazonaws.com
            username:
              type: string
              description: Access Key ID for remote object storage / Account in Azure
                cloud
              example: my_s3_access_key or my_azure_account
            password:
              type: string
              description: Secret Access Key for remote object storage / Storage account
                key in Azure cloud.
              example: mys3password or my_azure_account_key
            connectVia:
              type: string
              description: Connection method to Azure cloud.
              enum:
              - fe
              - public
              - outnet
              example: public
            allow_lifecycle_policies:
              type: boolean
              example: true
              description: Allow bucket to have lifecycle policies. Not applicable
                to remote object storage type NGOS_S3.
            notify_on_failures:
              $ref: "#/definitions/NotifyOnFailures"
            proxyhost:
              type: string
              description: Proxy host
              example: 10.10.10.10
            proxyport:
              type: integer
              minimum: 1
              maximum: 65535
              description: Port for proxy
              example: 7878
            proxyuser:
              type: string
              description: Username for proxy
              example: user
            proxypassword:
              type: string
              description: Password for proxy
              example: password
            kmskeyid:
              type: string
              description: KMS Key ID
              example: my-kms-key-id

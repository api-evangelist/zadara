  /pools/{id}/update_protection.json:
    post:
      tags:
      - Pools
      description: Update free capacity alert notification settings for a Pool.
      operationId: update_pool_capacity_alerts
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        pattern: ^r?pool-[0-9a-f]{8}$
        required: true
      - in: body
        name: update_pool_capacity_alerts
        required: true
        schema:
          type: object
          properties:
            capacityhistory:
              type: integer
              description: Window size in minutes which is used to calculate the rate
                of which free Pool capacity is consumed. This rate is used to calculate
                the estimated time until a Pool is full.
            effectivecapacityhistory:
              type: integer
              description: Window size in minutes which is used to calculate the rate
                of which free Pool effective capacity is consumed. This rate is used
                to calculate the estimated time until a Pool is full.
              x-VpsaType: VPSA Flash Array
            alertmode:
              type: integer
              description: Send an alert when it is estimated that the Pool will be
                at full capacity in this many minutes.
            effectivealertmode:
              type: integer
              description: Send an alert when it is estimated that the Pool will be
                at full effective capacity in this many minutes.
              x-VpsaType: VPSA Flash Array
            protectedmode:
              type: integer
              description: Block Volume/Share/Pool creation when it's estimated that
                the Pool will be full in this many minutes.
            effectiveprotectedmode:
              type: integer
              description: Block Volume/Share/Pool creation when it's estimated that
                the Pool effective capacity will be full in this many minutes.
              x-VpsaType: VPSA Flash Array
            emergencymode:
              type: integer
              description: Delete snapshots, starting with the oldest, when the Pool
                has less than this number of GB left.
            effectiveemergencymode:
              type: integer
              description: Delete snapshots, starting with the oldest, when the Pool
                effective capacity has less than this number of GB left.
              x-VpsaType: VPSA Flash Array
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  pool_name:
                    type: string
                    example: pool-00000001
                    xml:
                      name: pool-name
                  status:
                    type: integer
                xml:
                  name: update-pool-capacity-alerts-response

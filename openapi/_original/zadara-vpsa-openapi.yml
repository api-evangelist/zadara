          - policy
          - wanoptimization
          - snapname
          - remote_snapname
          properties:
            displayname:
              type: string
              description: Display name for resumed mirror.
              example: my-mirror
            policy:
              type: string
              pattern: ^policy-[0-9a-f]{8}$
              description: Policy ID
              example: policy-00000001
            dedupe:
              type: string
              description: Enable Dedupe For Mirror.
              x-VpsaType: VPSA Flash Array
              enum:
              - "YES"
              - "NO"
              example: "YES"
            compress:
              type: string
              description: Enable Compression For Mirror.
              x-VpsaType: VPSA Flash Array
              enum:
              - "YES"
              - "NO"
              example: "YES"
            wanoptimization:
              type: string
              description: enable WAN optimization.
              enum:
              - "YES"
              - "NO"
              example: "YES"
            snapname:
              type: string
              pattern: ^snap-[0-9a-f]{8}$
              description: The local Snapshot ID.
              example: snap-00000001
            remote_snapname:
              type: string
              pattern: ^snap-[0-9a-f]{8}$
              description: ID of a Remote Snapshot to resume from.
              example: snap-00000003
            force:
              type: string
              enum:
              - "YES"
              - "NO"
              example: "YES"

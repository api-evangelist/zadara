              type: string
              enum:
              - 'YES'
              - 'NO'
              example: 'YES'
            ipsec_nfs:
              type: string
              enum:
              - 'YES'
              - 'NO'
              example: 'YES'
            monitoring:
              type: string
              description: connectivity monitoring
              enum:
              - 'YES'
              - 'NO'
              example: 'YES'
            remove_wwpns:
              type: array
              items:
                type: string
              description: wwpns to remove
            add_wwpns:
              type: array
              items:
                type: string
              description: wwpns to add
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error

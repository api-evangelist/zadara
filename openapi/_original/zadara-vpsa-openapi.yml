paths:
  /consistency_groups/suspend_cgs_for_snapshot_set.json:
    post:
      tags:
      - Consistency Groups
      description: Suspend consistency groups for a snapshot set.
      operationId: suspend_cgs_for_snapshot_set
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: suspend_cgs_for_snapshot_set
        required: true
        schema:
          type: object
          required:
          - snapsetid
          - cg
          properties:
            snapsetid:
              type: string
              description: The snapshot set id
            cg:
              type: array
              description: array of the cgs names
              items:
                type: "string"
              example: ["cg-00000075", "cg-00000076", "cg-00000077"]
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  snapshot_set_name:
                    type: object
                    properties:
                      emergency_threshold:
                        type: string
                        xml:
                          name: emergency-threshold
                    xml:
                      name: snapshot-set-name
                  status:
                    type: integer
                xml:
                  name: suspend-cgs-for-snapshot-set-response
  /consistency_groups/create_snapshot_set_and_resume.json:

    post:
      tags:
      - RAID Groups
      description: Create a RAID Group.Operation will fail if drives are not from
        the same capacity (override with force option)
      operationId: create_raid_group
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_raid_group
        required: true
        schema:
          type: object
          required:
          - display_name
          - protection
          - disk
          properties:
            display_name:
              type: string
              description: The RAID group display name
              example: my-raid-group
            protection:
              type: string
              enum:
              - RAID1
              - RAID5
              - RAID6
              description: protection type
              example: RAID1
            disk:
              type: string
              description: A comma-separated list of Drive IDs.
              example: volume-000002fe,volume-000002ff
            protection_width:
              type: integer
              description: Number of drives in the RAID protection, not including
                hot spare.
            stripe_size:
              type: integer
              enum:
              - 4
              - 16
              - 32
              - 64
              - 128
              - 256
              description: Size of the stripe per Disk. Required for RAID6.
            hot_spare:
              type: string
              enum:
              - 'YES'
              - 'NO'
            force:
              type: string
              enum:
              - 'YES'
              - 'NO'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:

                        type: string
                        format: date_time
                        xml:
                          name: created-at
                      modified_at:
                        type: string
                        format: date_time
                        xml:
                          name: modified-at
                    xml:
                      name: smb-ads
                xml:
                  name: show-smb-security-ads-response
    post:
      tags:
      - NAS
      description: Join an Active Directory Domain.
      operationId: join_active_directory
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: join_active_directory
        required: true
        schema:
          type: object
          required:
          - username
          - password
          - realm
          - workgroup
          - dns
          properties:
            force:
              type: string
              description: Force Active Directory Domain join
              enum:
              - 'YES'
              - 'NO'
              example: 'YES'
            username:
              type: string
              description: The domain user name
            adserver:
              type: string
            password:
              type: string
              description: The domain user name
              example: mysupersecretpassword
            realm:
              type: string
              description: The domain name.
              example: mycompany
            workgroup:
              type: string
              description: The domain NetBIOS name.
              example: MYCOMPANY
            dns:
              type: string
              description: The DNS IP(s). (use array to pass multiple)
              example: 11.22.33.44
            uid_range_low:
              type: integer
              example: 5000000
            uid_range_high:
              type: integer
              example: 15000000
            allow_trusted_domains:
              type: boolean
              description: Allow trusted domains
              example: true
            trusted_domains_discovery:
              type: boolean
              description: Trusted domains discovery. Using Trusted domains discovery
                mode is not recommended and should only be used if instructed by support.
                If turned off, trusted domains should be manually set in the Domains
                section post connecting the Active Directory parent domain.
              example: false
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:

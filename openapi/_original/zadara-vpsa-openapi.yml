    post:
      tags:
      - Containers
      description: Create a container.
      operationId: create_zcs_container
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_zcs_container
        required: true
        schema:
          type: object
          required:
          - name
          - imagename
          - use_public_ip
          properties:
            name:
              type: string
              description: A text label to assign to the ZCS container.  For example
                'web-01', 'database', etc.  May not contain a single quote (') character.  Required.
            imagename:
              type: string
              pattern: ^img-[0-9a-f]{8}$
            use_public_ip:
              type: string
              description: If set to 'YES', the ZCS container will listen on VPSA's
                public IP address (only valid on VPSAs with a public IP address).  If
                set to 'NO', the container will listen on the same private IP address
                that is used for addressing the storage.  Optional (set to 'NO' by
                default).
            start:
              type: string
              description: If set to 'YES', the ZCS container will be started immediately
                after creation.  If 'NO', it will not be started. Required.
            volumes:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    pattern: ^volume-[0-9a-f]{8}$
                    example: "volume-00000001"
                  path:
                    type: string
                    example: "/vol1"
                  access:
                    type: string
                    example: "rw"
              description: Volumes to attach to container (access_type:vol-name:path)
              example: [{"name": "volume-00000001", "path": "/vol1", "access": "rw"},
                {"name": "volume-00000002", "path": "/vol2", "access": "r"}]
            ports:
              type: array
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    example: "tcp"
                  low:
                    type: integer
                    example: 22
                  high:
                    type: integer
                    example: 35
                  internal_low:
                    type: integer
                    example: 9999
              description: Exposed ports (optional)
              example: [{"protocol": "tcp", "low": 22, "high": 35, "internal_low": 9999},
                {"protocol": "udp", "low": 33, "high": 35}]
            args:
              type: array
              items:
                type: string
              description: A Python list of Python dictionaries that contain arguments
                to pass to the ZCS container entry point program or script as defined
                by "entrypoint".  If passed as a string, a conversion to a Python
                list via json.loads will be attempted.  Every list item should be
                a dictionary that contains one key, "arg", whose value is the argument
                to pass to the ZCS container.  For example, if the entrypoint is "/usr/sbin/sshd"
                these arguments will be passed to sshd.  e.g. ' [{"arg":"-p 2222"},{"arg":"-f
                /etc/ssh/sshd_config"}]'
            envvars:
              type: array
              items:
                type: object
                properties:
                  variable:
                    type: string
                    example: "IP_ADDRESS"
                  value:
                    type: string
                    example: "172.20.125.100"
              description: Environment variables
              example: [{"variable": "IP_ADDRESS", "value": "172.20.125.100"}, {"variable": "USERNAME",
                  "value": "zcs_container_01"}, {"variable": "PASSWORD", "value": "very_strong_password"}]
            entrypoint:
              type: string
              description: The full path to the program or script inside the ZCS container
                to run when the container starts.  For exmple "/usr/local/bin/entry.sh"
            link:
              type: array
              items:
                type: string
              description: A Python list that contain container identifiers that will
                be linked to the new container An example would be '["container-00000001"
                , "container-00000002"]'
            memorypoolname:
              type: string
              description: Container memory pool
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  container_name:
                    type: string
                    example: container-00000001
                    xml:
                      name: container-name
                  status:
                    type: integer
                xml:
                  name: create-container-response

              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  server_name:
                    type: string
                    example: srv-00000001
                    xml:
                      name: server-name
                  status:
                    type: integer
                xml:
                  name: update-server-response

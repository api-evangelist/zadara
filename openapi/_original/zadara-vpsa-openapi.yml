        name: update_server
        required: true
        schema:
          type: object
          properties:
            force:
              type: string
              enum:
              - 'YES'
              - 'NO'
            display_name:
              type: string
              description: The server display name
            os:
              type: string
              description: Server's OS
              enum:
              - Windows
              - Linux
              - Solaris
              - AIX
              - ESXi
              example: Windows
            vpsachapuser:
              type: string
              description: VPSA chap user.
            vpsachapsecret:
              type: string
              description: VPSA chap secret. 12-16 characters.
            hostchapuser:
              type: string
              description: Host chap user.
            hostchapsecret:
              type: string
              description: Host chap secret. 12-16 characters.
            iqn:
              type: string
              pattern: 
                ^(?:iqn\.[0-9]{4}-[0-9]{2}(?:\.[A-Za-z](?:[A-Za-z0-9\-]*[A-Za-z0-9])?)+(?::.*)?|eui\.[0-9A-Fa_f]{16})'
            iscsi:
              type: string
              description: The server's iSCSI IP

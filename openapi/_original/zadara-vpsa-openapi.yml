    post:
      tags:
      - File Lifecycle Policies
      description: Create a new file lifecycle policy.
      operationId: create_flc_policy
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_flc_policy
        required: true
        schema:
          type: object
          required:
          - display_name
          - file_selection_criteria
          - lc_action
          properties:
            display_name:
              type: string
              description: Policy name.
              example: my_policy
            file_selection_criteria:
              type: string
              description: The criteria by which the policy files will be selected.
                Should be in a MongoDB $match aggregation format.
              example: '{ \"$and\": [ { \"$in\": [\"$extension\", [\"log\", \"tmp\"]]
                }, { \"$gt\": [\"$size\", 1024] } ] }'
            lc_action:
              type: string
              enum:
              - archive
              - expire
              description: The action that the policy performs on the selected files.
              example: expire
            enabled:
              type: string
              description: Controls enablement of the policy after it is created.
              enum:
              - 'YES'
              - 'NO'
            dry_run:
              type: string
              description: When the policy is in dry run mode, it'll only print its
                actions to the log instead of actually performing them.
              enum:
              - 'YES'
              - 'NO'
            use_recycle_bin:
              type: string
              description: When using recycle bin, files that are handled by the policy
                are also copied to the recycle bin.
              enum:
              - 'YES'
              - 'NO'
            whitelist_paths:
              type: string
              description: Comma delimited list of paths that the policy should only
                run on them.
            blacklist_paths:
              type: string
              description: Comma delimited list of paths that the policy should not
                run on.
            dest_obs_name:
              type: string
              description: Destination object storage to archive files to. Relevant
                only for archive policy.
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                xml:
                  name: create-life-cycle-policy-response

                        default: 'NO'
                        example: 'NO'
                      dns:
                        type: array
                        items:
                          type: string
                          example: 10.0.2.32
                          xml:
                            name: dns
                        xml:
                          wrapped: true
                      dc:
                        type: array
                        items:
                          type: string
                          example: 10.0.0.1
                          xml:
                            name: dc
                        xml:
                          wrapped: true
                      ad_server:
                        type: string
                        example: WIN-8AAAABBCCDD
                        xml:
                          name: ad-server

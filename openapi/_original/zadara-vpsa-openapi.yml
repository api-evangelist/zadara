              example: ["10.0.0.10", "10.0.0.11"]
            dns_lookup_realm:
              type: string
              description: Set auto realm lookup
              example: 'YES'
            dns_lookup_kdc:
              type: string
              description: Set auto realm kdc lookup
              example: 'YES'
            add_to_ignored_domains:
              type: array

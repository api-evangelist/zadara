    post:
      tags:
      - Settings
      description: Change encryption from using Master Encryption Password to use
        KMIP KMS.
      operationId: set_encryption_password_kmip
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: set_encryption_password_kmip
        required: true
        schema:
          type: object
          required:
          - current_encryption_pwd
          - host
          - key_id
          - key_name
          - connect_via
          - user
          - password
          properties:
            current_encryption_pwd:
              type: string
              description: Current master encryption password.
              example: mycurrentsecretpassword
            host:
              type: string
              description: The KMIP host to set.
              example: eu.smartkey.io
            key_id:
              type: string
              description: The KMIP key UUID to set.
              example: a1b2c3d4-9876-zyxw-aaaa-abcdefgh1234
            key_name:
              type: string
              description: The KMIP key name to set.
              example: nice-name
            connect_via:
              type: string
              description: The KMIP connection interface.
              enum:
              - public
              - fe
            user:
              type: string
              description: The KMIP username, can be used for authentication.
              example: a1b2c3d4-e5f6-g7h8-i9j0-ab12cd12ef12
            password:
              type: string
              description: The KMIP password, can be used for authentication.
              example: 
                z_a1b2c3d4a1b2c3d4a1b2c3d4qqqqq-a1b2c3d4a1b2c3d4a1b2c3d4l_a1b2c3d4a1b2c3d4a1b2c3d4zzz
            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: The KMIP host port to set.
              default: 5696
            version:
              type: string
              description: "The KMIP version to use:\n 0 (for unknown)\n 1 (for 1.0)\n
                2 (for 1.1)\n 3 (for 1.2)\n 4 (for 1.3)\n 5 (for 1.4)\n 6 (for 2.0)"
              enum:
              - "0"
              - "1"
              - "2"
              - "3"
              - "4"
              - "5"
              - "6"
              default: "3"
            ca_cert_file:
              type: string
              description: The location of the CA certificate file on the VPSA file
                system.
              default: /etc/ssl/certs/DigiCert_Global_Root_CA.pem
            proxy_host:
              type: string
              description: The proxy host, used if setting KMIP KMS with proxy.
              example: 1.2.3.4
            proxyport:
              type: integer
              minimum: 1
              maximum: 65535
              description: The proxy port, used if setting KMIP KMS with proxy.
              example: 3128
            proxy_username:
              type: string
              description: The proxy user name, used if setting KMIP KMS with authenticated
                proxy.
              example: username
            proxy_password:
              type: string
              description: The proxy password, used if setting KMIP KMS with authenticated
                proxy.
              example: mypass
            key_file_content:
              type: string
              description: The private key file content, can be used for authentication.
            cert_file_content:
              type: string
              description: The KMIP certificate file content, can be used for authentication.
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:

  /pools/{id}/expand.json:
    post:
      tags:
      - Pools
      description: Add additional RAID Groups Or OBS Tier to a Pool.
      operationId: expand_pool
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        pattern: ^r?pool-[0-9a-f]{8}$
        required: true
      - in: body
        name: expand_pool
        required: true
        schema:
          type: object
          properties:
            raid_groups:
              type: string
              description: Cannot be used with `obsdestname`. Comma separated list
                of RAID Group IDs.
              pattern: (?:RaidGroup-[0-9]+[,]?)+
              example: RaidGroup-4
            capacity:
              type: string
              minimum: 1
              description: Capacity in GB followed by the letter G.
              example: 30G
            obsdestname:
              type: string
              description: Object storage destination name. Cannot be used with `raid_groups`
              example: obsdst-00000001
            cloud_size:
              type: string
              description: Object storage size (multiple of 20).
              example: "40"
            sse:
              type: string
              description: Encryption type.
              example: AES256
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  pool_name:
                    type: string
                    example: pool-00000001
                    xml:
                      name: pool-name
                  status:
                    type: integer
                xml:
                  name: expand-pool-response

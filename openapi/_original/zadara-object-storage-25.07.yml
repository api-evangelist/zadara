- https
- http
paths:
  /zios/accounts.json:
    get:
      tags:
      - Accounts
      description: List all accounts.
      operationId: get_all_accounts
      produces:
      - application/json
      - application/xml
      parameters:
      - $ref: "#/parameters/startParam"
      - $ref: "#/parameters/limitParam"
      - in: query
        name: active
        type: boolean
        description: Retrieves only active accounts. Relevant only when using remote
          authentication.
      - in: query
        name: filter_field
        type: string
        description: A field to filter the accounts by.
        enum:
        - name
        - id
      - in: query
        name: filter_value
        type: string
        description: A substring to filter the accounts by.
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                  count:
                    type: integer
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        update_time:
                          type: string
                          example: "146182175.08"
                          xml:
                            name: update-time
                        name:
                          type: string
                          example: zios_admin
                        is_system_account:
                          type: string
                          example: "True"
                          xml:
                            name: is-system-account
                        public_url_list:
                          type: array
                          items:
                            type: string
                            example: 
                              https://vsa-0000018f-zadara.zadarazios.com:443/v1/AUTH_91ea5bd5cdc04adb9f5e3c00a346c463
                            xml:
                              name: public-url
                          xml:
                            name: public-url-list
                            wrapped: true
                        enabled:
                          type: string
                          example: "True"
                        email:
                          type: string
                          example: eyalzadarastorage.com
                        state:
                          type: string
                          example: normal
                        create_time:
                          type: string
                          example: "1461821754.96"
                          xml:
                            name: create-time
                        id:
                          type: string
                          example: 91ea5bd5cdc04adb9f5e3c00a346c463
                        description:
                          type: string
                          example: None
                      xml:
                        name: account
                    xml:
                      wrapped: true
                xml:
                  name: show-accounts-response
    post:
      tags:
      - Accounts
      description: Adds a new account.
      operationId: create_account
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_account
        required: true
        schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Account name
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                  account_id:
                    type: string
                    example: da39fd0e8a484156af0c22e84d936da0
                    xml:
                      name: account-id
                xml:
                  name: response

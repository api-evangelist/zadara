  /zios/usage_reports/generate.json:
    get:
      tags:
      - Usage Reports
      description: 'Generate a usage report. Each account lists the following for
        each policy: capacity, number of objects, number of containers, data transfer
        in, data transfer out'
      operationId: generate_usage_reports
      produces:
      - application/json
      - application/xml
      security:
      - api_key: []
      parameters:
      - in: query
        name: report_time
        type: string
        description: Type of time frame for report
        enum:
        - monthly
        - custom
        default: monthly
      - in: query
        name: report_type
        type: string
        description: Type of time frame for report
        enum:
        - summary
        - detailed
        default: detailed
      - in: query
        name: fromdate
        type: string
        format: date
        description: Start date (YYYY-MM-DD). Required for custom report, must be
          no more than 6 months old.
      - in: query
        name: todate
        type: string
        format: date
        description: End date (YYYY-MM-DD). Required for custom report, must be no
          more than 6 months old.
      - in: query
        name: month
        type: string
        description: Month of the year, (e.g. 4). Required for monthly report.
      - in: query
        name: account_id
        type: string

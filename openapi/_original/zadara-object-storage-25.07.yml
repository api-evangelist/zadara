parameters:
  startParam:
    name: start
    in: query
    required: false
    type: integer
    minimum: 0
    description: The item number to start from. 0 starts from the beginning.
  limitParam:
    name: limit
    in: query
    required: false
    type: integer
    description: The total number of records to return.
  interval:
    name: interval
    in: query
    required: false
    type: integer
    default: 60
    minimum: 1
    description: The interval between data points, in seconds
  count:
    name: count
    in: query
    type: integer
    required: false
    minimum: 1
    default: 30
    description: The number of data points
  subserver:
    in: query
    name: subserver
    type: string
    required: true
    description: e.g. object
  service:
    in: query
    name: service
    type: string
    required: true
    description: e.g. proxy
  lbgName:
    in: path
    name: id
    type: string
    pattern: ^lbg-[0-9]+
    required: true

                        example: "1461821755.08"
                        xml:
                          name: update-time
                      name:
                        type: string
                        example: zios_admin
                      is_system_account:
                        type: string
                        example: "True"
                        xml:
                          name: is-system-account
                      public_url_list:
                        type: array
                        items:
                          type: string
                          example: 
                            https://vsa-0000018f-zadara.zadarazios.com:443/v1/AUTH_91ea5bd5cdc04adb9f5e3c00a346c463
                          xml:
                            name: public-url
                        xml:
                          name: public-url-list
                          wrapped: true
                      enabled:
                        type: string
                        example: "True"
                      email:
                        type: string
                        example: eyalzadarastorage.com
                      state:
                        type: string
                        example: normal
                      create_time:
                        type: string
                        example: "1461821754.96"
                        xml:
                          name: create-time
                      id:
                        type: string
                        example: 91ea5bd5cdc04adb9f5e3c00a346c463
                      description:
                        type: string
                        example: None
                xml:
                  name: show-one-account-response
    delete:
      tags:
      - Accounts
      description: Delete an account.
      operationId: delete_account
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: account_id
        type: string
        required: true
      - in: body
        name: delete_account
        required: true
        schema:
          type: object
          required:
          - force
          properties:
            force:
              type: string
              description: force a deletion
              enum:
              - "YES"
              - "NO"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: xml
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              response:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
                  status_msg:
                    type: string
                    example: The request has been submitted, and it may take a few
                      moments to complete. Check event_log for further details
                    xml:
                      name: status-msg
                xml:

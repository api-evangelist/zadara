                            stripe_size:
                              type: integer
                              example: 0
                              xml:
                                name: stripe-size
                            protection_width:
                              type: integer
                              example: 3
                              xml:
                                name: protection-width
                            capacity:
                              type: integer
                              example: 462
                            available:

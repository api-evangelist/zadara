                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      min_resync_speed_default:
                        type: integer
                        example: 10
                        xml:
                          name: min-resync-speed-default
                      max_resync_speed_default:
                        type: integer
                        example: 200
                        xml:
                          name: max-resync-speed-default
                      raid_groups:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: RaidGroup-4
                            display_name:
                              type: string
                              example: raid_group

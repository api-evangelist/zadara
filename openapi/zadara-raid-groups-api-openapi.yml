openapi: 3.2.0
info:
  title: Zadara RAID Groups API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged RAID Groups across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: RAID Groups
  description: Operations involving RAID Groups.
paths:
  /raid_groups.json:

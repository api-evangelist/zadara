    post:
      tags:
      - RAID Groups
      description: Create a RAID Group.Operation will fail if drives are not from the same capacity (override with force option)
      operationId: create_raid_group
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      raidgroup_name:
                        type: string
                        example: RaidGroup-4
                        xml:
                          name: raidgroup-name
                      status:
                        type: integer
                    xml:
                      name: create-raid-group-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      raidgroup_name:
                        type: string
                        example: RaidGroup-4
                        xml:
                          name: raidgroup-name
                      status:
                        type: integer
                    xml:
                      name: create-raid-group-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - protection
              - disk
              properties:
                display_name:
                  type: string
                  description: The RAID group display name
                  example: my-raid-group
                protection:
                  type: string
                  enum:
                  - RAID1
                  - RAID5
                  - RAID6
                  description: protection type
                  example: RAID1
                disk:
                  type: string
                  description: A comma-separated list of Drive IDs.
                  example: volume-000002fe,volume-000002ff
                protection_width:
                  type: integer
                  description: Number of drives in the RAID protection, not including hot spare.
                stripe_size:
                  type: integer
                  enum:
                  - 4
                  - 16
                  - 32
                  - 64
                  - 128
                  - 256
                  description: Size of the stripe per Disk. Required for RAID6.
                hot_spare:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                force:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
        required: true
      summary: Create raid group
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

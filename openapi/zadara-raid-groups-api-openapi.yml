                              type: integer
                              example: 0
                              xml:
                                name: min-resync-speed
                            max_resync_speed:
                              type: integer
                              example: 0
                              xml:
                                name: max-resync-speed
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: raid-group
                        xml:
                          name: raid-groups
                          wrapped: true
                    xml:
                      name: show-raid-groups-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:

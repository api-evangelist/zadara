                            stripe_size:
                              type: integer
                              example: 0
                              xml:
                                name: stripe-size
                            protection_width:
                              type: integer
                              example: 3
                              xml:
                                name: protection-width
                            capacity:
                              type: integer
                              example: 462
                            available:
                              type: integer
                              example: 462
                            status:
                              type: string
                              example: Normal
                            ssd:
                              type: string
                              example: 'NO'
                            mismatch_count:
                              type: integer
                              xml:
                                name: mismatch-count
                            resync_speed:
                              type: integer
                              example: 0
                              xml:
                                name: resync-speed

  /vcontrollers/network_interfaces.json:
    get:
      tags:
      - Controllers
      description: Get the list of network interfaces.
      operationId: get_vcontrollers_network_interfaces
      security:
      - api_key: []
      parameters:
      - in: query
        name: no_public
        description: Omit public network interface.
        schema:
          type: boolean
      - in: query
        name: force_public
        description: Include a public network interface even when the VPSA has no public ip set.
        schema:
          type: boolean
      - in: query
        name: show_outnet
        description: Include outnet network interface.
        schema:
          type: boolean
      - in: query
        name: skip_vnis
        description: Omit Virtual Network Interface network interfaces.
        schema:
          type: boolean
      responses:
        default:
          description: Unexpected error

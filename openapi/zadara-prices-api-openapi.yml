          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      io_engines:
                        type: object
                        xml:
                          name: io-engines
                        properties:
                          additionalProperties:
                            type: object
                            properties:
                              currency:
                                type: string
                                example: $
                              type:
                                type: string
                                example: provider
                              name:
                                type: string
                                example: QA4_Single_Zone
                              cloud_name:
                                type: string
                                example: QA4_Single_Zone
                                xml:
                                  name: cloud-name
                              type_id:
                                type: integer
                                example: 9
                                xml:
                                  name: type-id
                              data:
                                type: object
                                properties:
                                  additionalProperties:
                                    type: object
                                    properties:
                                      value:
                                        type: number
                                        example: 0.49
                                      available_in_cloud:
                                        type: number
                                        example: 0.49
                                        xml:
                                          name: available-in-cloud
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      io_engines:
                        type: object
                        xml:
                          name: io-engines
                        properties:
                          additionalProperties:
                            type: object
                            properties:
                              currency:
                                type: string
                                example: $
                              type:
                                type: string
                                example: provider
                              name:
                                type: string
                                example: QA4_Single_Zone
                              cloud_name:
                                type: string
                                example: QA4_Single_Zone
                                xml:
                                  name: cloud-name
                              type_id:

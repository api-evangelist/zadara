  /remote_authentications/{auth_server_id}/users.json:
    get:
      tags:
      - Remote authentications
      description: Get user list of a remote directory.
      operationId: get_user_list_of_remote_directory
      parameters:
      - in: path
        name: auth_server_id
        required: true
        schema:
          type: string
      - in: query
        name: username
        description: remote administrator domain and username. Zadara doesn't store your username.
        required: true
        schema:
          type: string
      - in: query
        name: password
        description: remote administrator password. Zadara doesn't store your password. Your credentials are only used to authenticate session with your directory.
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  imported_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username
                          xml:
                            name: remote-username
                      xml:
                        name: imported-user
                    xml:
                      name: imported-users
                      wrapped: true
                  not_imported_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username
                          xml:

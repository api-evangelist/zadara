                        domain_alias:
                          type: string
                          example: zadara
                          xml:
                            name: domain-alias
                        port:
                          type: string
                          example: '389'
                        type:
                          type: string
                          example: active_directory
                        base:
                          type: string
                          example: DC=zadara,DC=com
                        dns:
                          type: array
                          items:
                            type: string
                            example: '"192.168.0.1"'
                            xml:
                              name: dns
                          xml:
                            wrapped: true
                      xml:
                        name: remote
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  remotes:
                    type: array
                    items:
                      type: object
                      properties:

                    type: string
                    example: success
                  imported_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username
                          xml:
                            name: remote-username
                      xml:
                        name: imported-user
                    xml:
                      name: imported-users
                      wrapped: true
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  imported_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username
                          xml:
                            name: remote-username
                      xml:
                        name: imported-user
                    xml:
                      name: imported-users
                      wrapped: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  description: username of a remote directory user. Zadara doesn't store usernames.
                  example: domain:username
                password:
                  type: string
                  description: password of a remote directory user. Zadara doesn't store passwords. Your credentials are only used to authenticate session with your directory.
                  example: secret1234
                users:
                  type: array
                  items:
                    type: string
                  description: array containing usernames of the users to be added
                  example:
                  - john
                  - peter20
        required: true
      summary: Import users from remote directory
      x-summary-source: derived
    servers:
    - url: https://localhost/api

                type: object
                properties:
                  status:
                    type: string
                    example: success
                  remote:
                    type: object
                    properties:
                      id:
                        type: integer
                      domain:
                        type: string
                        example: zadara.com
                      domain_alias:
                        type: string
                        example: zadara
                        xml:
                          name: domain-alias
                      port:
                        type: string
                        example: '389'
                      type:
                        type: string
                        example: active_directory
                      base:
                        type: string
                        example: DC=zadara,DC=com
                      dns:
                        type: array
                        items:
                          type: string
                          example: '"192.168.0.1"'
                          xml:
                            name: dns
                        xml:
                          wrapped: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              - domain_alias
              - base
              - type
              properties:
                domain:
                  type: string
                  example: zadara.com
                domain_alias:
                  type: string
                  example: zadara
                base:
                  type: string
                  example: DC=zadara,DC=com
                type:
                  type: string
                  example: active_directory
                port:
                  type: integer
                  description: If not specified 389 is the default
                  example: 389
                  default: 389
                dns:
                  type: array
                  items:
                    type: string
                  example:
                  - 192.168.0.1
                  - 192.168.0.2

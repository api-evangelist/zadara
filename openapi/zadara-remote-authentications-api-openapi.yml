                      wrapped: true
      summary: Get user list of remote directory
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /remote_authentications/{auth_server_id}/users/import.json:
    post:
      tags:
      - Remote authentications
      description: Imports users from remote directory.
      operationId: import_users_from_remote_directory
      parameters:
      - in: path
        name: auth_server_id
        required: true
        schema:

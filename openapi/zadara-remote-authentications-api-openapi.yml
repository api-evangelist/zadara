                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username
                          xml:
                            name: remote-username
                      xml:
                        name: imported-user
                    xml:
                      name: imported-users
                      wrapped: true
                  not_imported_users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        firstname:
                          type: string
                          example: Someone
                        lastname:
                          type: string
                          example: surname
                        remote_username:
                          type: string
                          example: username

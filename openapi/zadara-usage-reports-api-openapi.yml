                                    xml:
                                      name: end-time
                                xml:
                                  name: reporting-interval
                              zios_url:
                                type: string
                                example: https://vsa-000007de-testcloud.zadarazios.com:443
                                xml:
                                  name: zios-url
                            xml:
                              name: report-header
                    xml:
                      name: '  response'

  /consistency_groups/{id}/rate_limit.json:
    post:
      tags:
      - Consistency Groups
      description: Update a migration job rate limit
      operationId: consistency_groups_rate_limit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^cg-[0-9a-f]{8}$
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:

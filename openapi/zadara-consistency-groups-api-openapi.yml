                        xml:
                          name: snapshots-details
                          wrapped: true
                    xml:
                      name: create-snapshot-set-and-resume-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - snapsetid
              properties:
                snapsetid:
                  type: string
                  description: The snapshot set id
                  example: snapshot set id
                dsp_name:
                  type: array
                  items:
                    type: string
                  description: Display names for created snapshot
                  example:
                  - snap1
                  - snap2
                managed_for:
                  type: array
                  items:
                    type: string
                  description: For externally managed VPSA, set what the volume is managed for.
                  example:
                  - kuku31
                  - kuku34
                  - kuku33
        required: true
      summary: Create snapshot set and resume
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

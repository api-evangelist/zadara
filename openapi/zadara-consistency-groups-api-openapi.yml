components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    Snapshot:
      type: object
      xml:
        name: snapshot
      properties:
        managed_for:
          type: string
          example: VSC
          xml:
            name: managed-for
        volume_capacity_mb:
          type: integer
          example: 51200
          xml:
            name: volume-capacity-mb
        volume_display_name:
          type: string
          example: my-volume
          xml:
            name: volume-display-name
        volume_ext_name:
          type: string
          example: volume-00000048
          xml:
            name: volume-ext-name
        name:
          type: string
          example: snap-00000002
        status:
          type: string
          example: normal
        display_name:
          type: string
          example: zat_snapshot_pV9xmi
          xml:
            name: display-name
        cg_display_name:
          type: string
          example: zat_block_7eIkL3
          xml:
            name: cg-display-name
        cg_name:
          type: string
          example: cg-00000076
          xml:
            name: cg-name
        pool_name:
          type: string
          example: pool-00010002
          xml:
            name: pool-name
        application:
          type: string
          example: Snapshot Manager
        snapshot_set_id:
          type: string
          xml:
            name: snapshot-set-id
        created_at:
          type: string
          format: date_time
          example: 2021-09-09T16:31:28+0300
          xml:
            name: created-at
        modified_at:
          type: string
          format: date_time
          example: 2021-09-09T16:31:28+0300
          xml:
            name: modified-at
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Access-Key
      in: header

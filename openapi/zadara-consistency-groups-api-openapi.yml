openapi: 3.2.0
info:
  title: Zadara Consistency Groups API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Consistency Groups across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Consistency Groups
  description: Operations involving Consistency Groups.
paths:
  /consistency_groups/suspend_cgs_for_snapshot_set.json:
    post:
      tags:
      - Consistency Groups
      description: Suspend consistency groups for a snapshot set.
      operationId: suspend_cgs_for_snapshot_set
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_set_name:
                        type: object
                        properties:
                          emergency_threshold:
                            type: string
                            xml:
                              name: emergency-threshold
                        xml:
                          name: snapshot-set-name
                      status:
                        type: integer
                    xml:
                      name: suspend-cgs-for-snapshot-set-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      snapshot_set_name:
                        type: object
                        properties:
                          emergency_threshold:
                            type: string
                            xml:
                              name: emergency-threshold
                        xml:
                          name: snapshot-set-name
                      status:
                        type: integer
                    xml:
                      name: suspend-cgs-for-snapshot-set-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - snapsetid
              - cg
              properties:
                snapsetid:
                  type: string
                  description: The snapshot set id
                cg:
                  type: array
                  description: array of the cgs names
                  items:
                    type: string
                  example:
                  - cg-00000075
                  - cg-00000076
                  - cg-00000077
        required: true
      summary: Suspend cgs for snapshot set
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

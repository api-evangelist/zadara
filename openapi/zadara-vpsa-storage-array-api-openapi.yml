  /clouds/{cloud_name}/vpsas/{id}/capacity_trend.json:
    get:
      tags:
      - VPSA Storage Array
      description: Returns the VPSA capacity trend.
      operationId: get_vpsa_capacity_trend
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA 'id' or 'internal-name' value as returned by get_all_vpsas.
        required: true
        schema:
          type: integer
      - in: query
        required: true
        name: pool_id
        schema:
          type: string
          pattern: ^pool-[0-9a-f]{8}$
      - in: query
        name: start_date
        schema:
          type: string
          format: date_time
      - in: query
        name: end_date
        schema:
          type: string
          format: date_time
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  capacity_trend:
                    type: object
                    properties:
                      used:
                        type: array
                        items:
                          type: number
                          xml:
                            name: used
                        xml:
                          wrapped: true
                      dates:
                        type: object
                        properties:
                          start_date:
                            type: string
                            example: '2017-01-05'
                            xml:
                              name: start-date
                          end_date:
                            type: string
                            example: '2017-01-09'
                            xml:
                              name: end-date
                      categories:
                        type: array
                        items:
                          type: string
                          format: date_time
                          example: '2017-01-04T12:23:02+02:00'
                          xml:
                            name: category
                        xml:
                          wrapped: true
                      total:
                        type: array
                        items:
                          type: number
                          xml:
                            name: total
                        xml:
                          wrapped: true
                      metadata:
                        type: array
                        items:
                          type: number
                          xml:

                        be_ip:
                          type: string
                          xml:
                            name: be-ip
                          example: 150.50.3.103
                        be_vlan_id:
                          type: integer
                          xml:
                            name: be-vlan-id
                          example: 119
                        fe_ip:
                          type: string
                          example: 150.50.2.103
                          xml:
                            name: fe-ip
                        fe_vlan_id:
                          type: integer
                          xml:
                            name: fe-vlan-id
                          example: 220
                        hb_ip:
                          type: string
                          example: 150.50.0.101

      operationId: get_container_quota_settings
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      - in: path
        name: container_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      quota_enabled_containers:
                        type: array
                        items:
                          type: object
                          properties:
                            container_name:
                              type: string
                              example: cont1
                              xml:
                                name: container-name
                            total_bytes:
                              type: string
                              example: '0'
                              xml:
                                name: total-bytes
                            quota_bytes:
                              type: string
                              example: '1'
                              xml:
                                name: quota-bytes
                            warning_threshold:
                              type: string
                              example: '75'
                              xml:
                                name: warning-threshold
                            emergency_threshold:
                              type: string
                              example: '90'
                              xml:
                                name: emergency-threshold
                            notify_account_admin:
                              type: string
                              example: 'True'
                              xml:
                                name: notify-account-admin
                          xml:
                            name: quota-enabled-container
                        xml:
                          name: quota-enabled-containers
                          wrapped: true
                    xml:
                      name: get-container-quota-settings-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      quota_enabled_containers:
                        type: array
                        items:
                          type: object
                          properties:
                            container_name:
                              type: string
                              example: cont1
                              xml:
                                name: container-name
                            total_bytes:
                              type: string
                              example: '0'
                              xml:
                                name: total-bytes
                            quota_bytes:
                              type: string
                              example: '1'
                              xml:
                                name: quota-bytes
                            warning_threshold:
                              type: string
                              example: '75'
                              xml:
                                name: warning-threshold
                            emergency_threshold:
                              type: string
                              example: '90'
                              xml:
                                name: emergency-threshold
                            notify_account_admin:
                              type: string
                              example: 'True'
                              xml:
                                name: notify-account-admin
                          xml:
                            name: quota-enabled-container
                        xml:
                          name: quota-enabled-containers
                          wrapped: true
                    xml:
                      name: get-container-quota-settings-response
      summary: Get container quota settings
      x-summary-source: derived
    post:
      tags:
      - Containers
      description: Set the container's quota settings
      operationId: set_container_quota_settings
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      - in: path
        name: container_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: an error has occured
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                        example: an error has occured
                      status:
                        type: integer
                        example: 0
                    xml:
                      name: set-container-quota-settings-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: an error has occured
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                        example: an error has occured
                      status:
                        type: integer
                        example: 0
                    xml:
                      name: set-container-quota-settings-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - container_quota_bytes_toggle
              properties:
                container_quota_bytes_toggle:
                  type: boolean
                  description: Enable capacity quota
                  example: true
                container_quota_bytes_in_gib:
                  type: integer
                  description: Quota by capacity (in GiB)
                  example: 1
        required: true
      summary: Set container quota settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

openapi: 3.2.0
info:
  title: Zadara Containers API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Containers across 4 of this provider''s published API definitions: zadara-object-storage-25.07.yml, zadara-vpsa-25.07.yml, zadara-object-storage-openapi.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Containers
  description: Operations for Containers
paths:
  /zios/accounts/{account_id}/containers/{container_name}/quota.json:

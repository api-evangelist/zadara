openapi: 3.2.0
info:
  title: Zadara Custom Networks API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Custom Networks across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Custom Networks
  description: Operations involving Custom Networks.
paths:
  /clouds/{cloud_name}/custom_networks.json:
    get:
      tags:
      - Custom Networks
      description: Returns a list of the Custom Networks which are defined in the Zadara Storage Cloud.
      operationId: get_all_custom_networks
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  custom_networks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 81
                        internal_id:
                          type: integer
                          example: 62
                          xml:
                            name: internal-id
                        name:
                          type: string
                          example: vni1
                        user:
                          type: string
                          example: admin
                        cidr:
                          type: string
                          example: 10.51.84.160/29
                        ipv6_cidr:
                          type: string
                          example: 2001:0db8:85a3::/64
                          xml:
                            name: ipv6-cidr
                        gateway:
                          type: string
                          example: 10.51.84.167
                        gateway_zone_1:
                          type: string
                          example: 10.51.84.167
                          xml:
                            name: gateway-zone-1
                        ipv6_gateway:
                          type: string
                          example: fe80::1
                          xml:
                            name: ipv6-gateway
                        ipv6_gateway_zone_1:
                          type: string
                          example: fe80::1
                          xml:
                            name: ipv6-gateway-zone-1
                        vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: vlan-id
                        allocatable_ip_ranges:
                          xml:
                            name: allocatable-ip-ranges
                            wrapped: true
                          type: array
                          items:
                            type: string
                            example: 3.14.15.0-3.14.15.5
                            xml:
                              name: allocatable-ip-range
                        ipv6_allocatable_ip_ranges:
                          xml:
                            name: ipv6-allocatable-ip-ranges
                            wrapped: true
                          type: array
                          items:
                            type: string
                            example: 2001:0db8:85a3::/64-2001:0db8:85a4::/64
                            xml:
                              name: ipv6-allocatable-ip-range
                        allocated_ips:
                          xml:
                            name: allocated-ips
                            wrapped: true
                          type: array
                          items:
                            type: object
                            properties:
                              ip:
                                type: string
                                example: 3.14.15.2
                              vsa_id:
                                xml:
                                  name: vsa-id
                                type: integer
                                example: 217
                            xml:
                              name: allocated-ip
                        ipv6_allocated_ips:
                          xml:
                            name: ipv6-allocated-ips
                            wrapped: true
                          type: array
                          items:
                            type: object
                            properties:

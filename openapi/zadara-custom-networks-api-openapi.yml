                        example: a
                      user:
                        type: string
                        example: auser
                      cidr:
                        type: string
                        example: 160.60.2.0/16
                      gateway:
                        type: string
                        example: 160.60.2.1
                      vlan_id:
                        type: string
                        example: '50'
                        xml:
                          name: vlan-id
                      id:
                        type: string
                      reserved:
                        type: boolean
                      default_for_tenant:
                        type: boolean
                        xml:
                          name: default-for-tenant
                      allocatable_ip_ranges:
                        type: array
                        items:
                          type: string
                          xml:
                            name: allocatable-ip-range
                        xml:
                          name: allocatable-ip-ranges
                          wrapped: true
                    xml:
                      name: custom-network
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              - name
              - gateway
              properties:
                user:
                  type: string
                  example: '5'
                  description: Tenant id
                name:
                  type: string
                  example: mynetwork
                cidr:
                  type: string
                  example: 170.70.1.0/24
                ipv6_cidr:
                  type: string
                  example: 2001:16:58::/32
                gateway:
                  type: string
                  example: 170.70.1.1
                ipv6_gateway:
                  type: string
                  example: 2001:16:58::1
                ip_range:
                  type: string
                  example: 170.70.1.2-170.70.1.50
                ipv6_ip_range:
                  type: string
                  example: 2001:16:58::2-2001:16:58::52
                vlan_id:
                  type: integer
                  description: To automatically assign use "vlan_id":""
                  example: 50
        description: custom network creation body
        required: true
      summary: Create custom network
      x-summary-source: derived
    servers:
    - url: https://localhost/api

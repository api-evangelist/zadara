            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  custom_network:
                    type: object
                    properties:
                      name:
                        type: string
                        example: a
                      user:
                        type: string
                        example: auser
                      cidr:
                        type: string
                        example: 160.60.2.0/16
                      gateway:
                        type: string
                        example: 160.60.2.1
                      vlan_id:
                        type: string
                        example: '50'
                        xml:
                          name: vlan-id
                      id:
                        type: string
                      reserved:
                        type: boolean
                      default_for_tenant:
                        type: boolean
                        xml:
                          name: default-for-tenant
                      allocatable_ip_ranges:
                        type: array
                        items:
                          type: string
                          xml:
                            name: allocatable-ip-range
                        xml:
                          name: allocatable-ip-ranges
                          wrapped: true
                    xml:
                      name: custom-network
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  custom_network:
                    type: object
                    properties:

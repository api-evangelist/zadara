      summary: Get all custom networks
      x-summary-source: derived
    post:
      tags:
      - Custom Networks
      description: Creates a Custom Network (ipv4 or ipv6).
      operationId: create_custom_network
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error

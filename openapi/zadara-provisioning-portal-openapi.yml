swagger: "2.0"
info:
  description: |2

    # Overview

    This document outlines the methods available for creation and high-level administration of Zadara Storage VPSAs via a Zadara Storage Provisioning Portal. This API supports form-encoded requests, and can return either JSON or XML responses.

    ## Endpoint

    The base URL for the requests is the Provisioning Portal URL you created your VPSA through - for example: https://manage.zadarastorage.com/, and all APIs will be prefixed with /api as noted in the documentation below.

    ## Authentication

    To use this API, an authentication token is required. The API for retrieving this token can be found below in the Authentication section. You may pass this token in requests either via the the X-Token header or via basic authentication (base64 encoded) in Authorization header.

    ## Parameters and Operations for Specific Deployment Types

    Some of the parameters and operations of the API can be used only for a specific deployment type. The following tags are used to mark parameters and operations relevant to a specific deployment type:

    - Public - the publicly available global Provisioning Portal

    - OPaaS - a cloud-specific Provisioning Portal

    ## Parameters and Operations for Specific User Roles

    Some of the parameters and operations of the API can be used only by a specific user role. The following tags are used to mark parameters and operations relevant to a specific user role:

    - Platform Admin - the administrator user managing the Provisioning Portal

    - Platform Billing User - a user with permissions to view billing data in the Provisioning Portal

    - Organization Admin - an organization user that can oversee and manage the organization activity

    - Organization Billing User - an organization user that has permissions to view the organization billing data

    ## Questions

    If you have any questions or need support involving the REST API, please contact for assistance.
  contact:
    name: API Support
    email: support@zadarastorage.com
  version: '25.07'
  title: Zadara Provisioning Portal API
tags:
- name: Authentication
  description: Methods for authenticating with the Provisioning Portal.
- name: Billing
  description: Operations involving billing.
- name: Cloud
  description: Retrieve Cloud's Configurations
- name: Compute
  description: Compute accounts operations
- name: Organizations
  description: Organizations
- name: Prices
  description: Get the list of prices for all providers.
- name: Providers
  description: Retrieve Providers Configurations
- name: Settings
  description: Settings
- name: Tenant
  description: Retrieve Tenants information
- name: Users
  description: Retrieve Users Configurations
- name: Virtual Network
  description: Retrieve Vlan's Configurations
- name: Vlan
  description: Retrieve Vlan's Configurations
- name: VPSA
  description: VPSA-specific Operations
- name: Vpsa Requests
  description: Vpsa Requests Actions
basePath: /api/v2
host: localhost
schemes:
- https
paths:
  /token.json:
    post:
      tags:
      - Authentication
      description: Retrieve your authentication token without resetting it.
      operationId: get_authentication_token
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: get_authentication_token
        required: true
        schema:
          type: object
          required:
          - username
          - password
          properties:
            username:
              type: string
              description: Your Provisioning Portal username.
              example: zadarauser
            password:
              type: string
              description: Your Provisioning Portal password.
              example: securepassword0000
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  token:
                    type: string
                    example: (API token)
  /token/reset.json:
    post:
      tags:
      - Authentication
      description: Reset and retrieve your API token.
      operationId: reset_authentication_token
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: reset_authentication_token
        required: true
        schema:
          type: object
          required:
          - username
          - password
          properties:
            username:
              type: string
              description: Your Provisioning Portal username.
              example: zadarauser
            password:
              type: string
              description: Your Provisioning Portal password.
              example: securepassword0000
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  token:
                    type: string
                    example: (API token)
  /billing_items.json:
    get:
      tags:
      - Billing
      description: Download Billing Reports. The returned file is in zip format containing
        csv files.
      operationId: get_billing_items
      produces:
      - application/zip
      parameters:
      - in: query
        name: start_datetime
        description: Report start datetime in format yyyy-MM-DD HH:MM
        required: true
        type: string
      - in: query
        name: end_datetime
        description: Report end datetime in format yyyy-MM-DD HH:MM
        required: true
        type: string
      - in: query
        name: user_id
        description: Filter reports of a specific user
        type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: The returned file is in zip format containing csv files.
          schema:
            type: string
            format: binary
  /clouds.json:
    get:
      tags:
      - Cloud
      description: Get the list of available Clouds and their configuration options.
      operationId: get_all_clouds
      x-roles: Platform Admin, Organization Admin, Organization Billing User
      produces:
      - application/json
      - application/xml
      parameters:
      - $ref: "#/parameters/OrganizationId"
      - $ref: "#/parameters/IncludeDescendants"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: array
                items:
                  $ref: "#/definitions/Cloud"

                xml:
                  wrapped: true
    post:
      tags:
      - Cloud
      description: Create a cloud
      operationId: create_cloud
      x-roles: Platform Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_cloud
        required: true
        schema:
          type: object
          required:
          - name
          - ip
          - admin_user
          - admin_key
          properties:
            name:
              type: string
              description: zStorage cloud display name, only visible to the Provisioning
                Portal administrators
              example: cloud1
            enabled:
              type: boolean
              description: zStorage cloud will be synced
            ip:
              type: string
              description: zStorage Cloud IP address
              example: "1.2.3.4"
            fqdn:
              type: string
              description: zStorage Cloud FQDN
              example: vsa-00000001-public-cloud-name.zadarazios.com
            auth_url:
              type: string
              description: zStorage Auth API
              example: "https://1.2.3.4:5001/v2.0/"
            nova_url:
              type: string
              description: zStorage NOVA Service API
              example: "https://1.2.3.4:8775/v1.1/"
            keystone_url:
              type: string
              description: zStorage Keystone Admin API
              example: "https://1.2.3.4:35358/v1.1/"
            ssl_verify:
              x-EnvType: Public
              type: boolean
              description: SSL Certificate Validation
              example: false
            admin_user:
              type: string
              description: zStorage NOVA Admin user
              example: admin
            admin_key:
              type: string
              description: zStorage NOVA Admin key
              example: "12345678"
            organization_id:
              x-EnvType: Public
              type: string
              format: uuid
              description: "Include this param if the cloud belongs to a specific
                organization"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  cloud_id:
                    type: string
                    example: "5"
                    xml:
                      name: cloud-id
  /clouds/test_connection.json:
    post:
      tags:
      - Cloud
      description: Test connectivity to Auth, Nova and Keystone URLs of the cloud.
        Runs a background job and returns the job id. Job status and results should
        be tracked with /clouds/connection_test_status REST API.
      operationId: cloud_test_connection
      x-roles: Platform Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: cloud_test_connection
        required: true
        schema:
          type: object
          properties:
            cloud_id:
              type: integer
              description: Cloud ID. Opt out for testing new cloud connectivity.
              example: 1
            ip:
              type: string
              description: Cloud's ip address
              example: "1.2.3.4"
            admin_user:
              type: string
              description: Nova admin user
              example: admin
            admin_key:
              type: string
              description: Nova admin key. Only applies to new cloud. Do not provide
                for existing cloud.
              example: "12345678"
            auth_url:
              type: string
              description: Auth URL.
              example: http://10.0.17.1:5000/v2.0/
            nova_url:
              type: string
              description: Nova URL.
              example: https://10.0.17.1:8774/v1.1/
            keystone_url:
              type: string
              description: Keystone URL.
              example: http://10.0.17.1:35357/v1.1/
            ssl_verify:
              type: boolean
              description: Verify SSL (public ecommerce only).
              example: false
            gateway_address:
              type: string
              description: Gateway Address.
              example: 10.0.17.1
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              job_id:
                type: string
                example: d77b4b2c7f15ec569151de25
                xml:
                  name: "job-id"
  /clouds/connection_test_status.json:
    get:
      tags:
      - Cloud
      description: Gets the cloud connectivity test job status and results.
      operationId: cloud_connection_test_status
      x-roles: Platform Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: query
        name: job_id
        description: Job ID returned from /clouds/test_connection REST API.
        required: true
        type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: fail
              services_status:
                xml:
                  name: "services-status"
                  wrapped: true
                type: array
                items:
                  type: object
                  properties:
                    service_name:
                      type: string
                      example: "auth"
                      xml:
                        name: "service-name"
                    service_display_name:
                      type: string
                      example: "AUTH"
                      xml:
                        name: "service-display-name"
                    status:
                      type: string
                      example: "fail"
                    error:
                      type: string
                      example: "Failed to open TCP connection to 1.1.1.1:5000 (execution
                        expired)"
                  xml:
                    name: service-status
                example: [{"service_name": "auth", "service_display_name": "AUTH",
                    "status": "success"}, {"service_name": "nova", "service_display_name": "NOVA",
                    "status": "fail", "error": "Failed to open TCP connection to 1.1.1.1:5000
                      (execution expired)"}, {"service_name": "keystone", "service_display_name": "Keystone",
                    "status": "fail", "error": "Failed to open TCP connection to 1.1.1.1:5000
                      (execution expired)"}]
  /clouds/{id}.json:
    get:
      tags:
      - Cloud
      description: Get the configuration information for a single Cloud.
      operationId: get_cloud
      x-roles: Platform Admin, Organization Admin, Organization Billing User
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                $ref: "#/definitions/Cloud"
    post:
      tags:
      - Cloud
      description: Update a cloud
      operationId: update_cloud
      x-roles: Platform Admin, Organization Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      - in: body
        name: update_cloud
        required: true
        schema:
          type: object
          properties:
            name:
              type: string
              description: zStorage cloud display name, only visible to the Provisioning
                Portal administrators
              example: cloud1
            enabled:
              type: boolean
              description: zStorage cloud will be synced
            ip:
              type: string
              description: zStorage Cloud IP address
              example: "1.2.3.4"
            auth_url:
              type: string
              description: zStorage Auth API
              example: "https://1.2.3.4:5001/v2.0/"
            nova_url:
              type: string
              description: zStorage NOVA Service API
              example: "https://1.2.3.4:8775/v1.1/"
            keystone_url:
              type: string
              description: zStorage Keystone Admin API
              example: "https://1.2.3.4:35358/v1.1/"
            ssl_verify:
              x-EnvType: Public
              type: boolean
              description: SSL Certificate Validation
              example: false
            admin_user:
              type: string
              description: zStorage NOVA Admin user
              example: admin
            admin_key:
              type: string
              description: zStorage NOVA Admin key
              example: "12345678"
            organization_id:
              x-EnvType: Public
              format: uuid
              type: string
              description: "Include this param if you want to attach the cloud to
                a specific organization"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  cloud_id:
                    type: string
                    example: "5"
                    xml:
                      name: cloud-id
    delete:
      tags:
      - Cloud
      description: Delete a cloud
      operationId: delete_cloud
      x-roles: Platform Admin, Organization Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
  /computes.json:
    post:
      tags:
      - Compute
      description: Create Compute Account
      operationId: create_compute_account
      produces:
      - application/json
      - application/xml
      security:
      - api_key: []
      parameters:
      - in: body
        name: create_compute_account
        required: true
        schema:
          type: object
          required:
          - provider_id
          - display_name
          properties:
            provider_id:
              description: Your Cloud provider's id.
              type: integer
              example: 1
            display_name:
              description: Compute Account Name.
              type: string
              example: test_account
            display_description:
              description: Compute Account Description.
              type: string
              example: test_account description
            cores:
              description: CPU cores limit.
              type: integer
              default: 64
              example: 32
            ram:
              description: RAM limit.
              type: integer
              default: 238
              example: 200
            instances:
              description: Instances limit.
              type: integer
              default: 10
              example: 10
            moderate:
              type: boolean
              example: false
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
        '200':
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Compute created successfully
  /organizations.json:
    get:
      tags:
      - Organizations
      description: Get all organizations
      operationId: get_all_organizations
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin, Organization Billing User
      produces:
      - application/json
      - application/xml
      parameters:
      - in: query
        name: "tree"
        type: boolean
        description: "set this param to true to get the result in tree structure"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: array
                items:
                  $ref: "#/definitions/Organization"
                xml:
                  wrapped: true
    post:
      tags:
      - Organizations
      description: Create an organization
      operationId: create_organization
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: create_organization
        required: true
        schema:
          $ref: "#/definitions/OrganizationParams"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Successfully created
              data:
                $ref: "#/definitions/Organization"
  /organizations/{id}.json:
    get:
      tags:
      - Organizations
      description: Get a single organization
      operationId: get_organization
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin, Organization Billing User
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                $ref: "#/definitions/Organization"
    put:
      tags:
      - Organizations
      description: Update an organization
      operationId: update_organization
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      - in: body
        name: update_organization
        required: true
        schema:
          $ref: "#/definitions/OrganizationParams"
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Successfully updated
              data:
                $ref: "#/definitions/Organization"
    delete:
      tags:
      - Organizations
      description: Delete an organization
      operationId: delete_organization
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      - in: body
        name: delete_organization
        schema:
          type: object
          properties:
            include_descendants:
              type: boolean
              description: Set to true if you want to delete also the descendants
                of the organization
              example: false
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
  /organizations/{id}/sub_orgs.json:
    get:
      tags:
      - Organizations
      description: get all organization descendants
      operationId: sub_orgs
      x-EnvType: Public
      x-roles: Platform Admin, Organization Admin, Organization Billing User
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      - in: query
        name: tree
        type: boolean
        description: Set to true to recieve the descendants in a tree structure.
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: array
                items:
                  $ref: "#/definitions/Organization"
                xml:
                  wrapped: true
  /organizations/{id}/cost_explorer.json:
    get:
      tags:
      - Organizations
      description: Retrieve all an organization's costs. Note that the Cost and Usage
        Explorer service is currently in Early Preview.
      operationId: get_cost_explorer_report
      x-EnvType: Public
      x-roles: Organization Admin, Organization Billing User
      x-ApiStatus: Early Preview
      produces:
      - application/json
      - application/xml
      parameters:
      - in: path
        name: id
        type: string
        required: true
      - in: query
        name: granularity
        type: string
        enum:
        - monthly
        - daily
        default: monthly
        description: The granularity of costs data to return.
      - in: query
        name: from
        required: true
        type: string
        format: date
        description: Report start date.
      - in: query
        name: to
        required: true
        type: string
        format: date
        description: Report end date.
      - in: query
        name: group_by
        type: string
        enum:
        - resource_type
        - cloud
        description: Grouping costs by a field.
      - in: query
        name: cloud
        type: array
        items:
          type: string
        description: Filter by clouds name.
      - in: query
        name: resource_type
        type: array
        items:
          type: string
        description: Filter by resource type.
      - in: query
        name: item
        type: array
        items:
          type: string
        description: Filter by item.
      - in: query
        name: billable_type
        type: array
        items:
          type: string
        description: Filter by billable type.
      - in: query
        name: user
        type: array
        items:
          type: string
        description: Filter by Provisioning Portal user username.
      - in: query
        name: compute_account
        type: array
        items:
          type: string
        description: Filter by compute account UUID.
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            type: object
            properties:
              data:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    total:
                      type: number
                      description: Total amount for the month/day
                      example: 100500
                    metadata:
                      type: object
                      properties:
                        estimation:
                          type: boolean
                          example: true
                    additionalProperties:
                      type: number
                      description: Total amount of a group for the month/day
                      example: 75000
              totals:
                type: object
                additionalProperties:
                  type: number
                  description: Total amount of a group for the entire duration
                  example: 150000
                properties:
                  total:
                    type: number
                    description: Total amount for the entire duration
                    example: 201000
              currency:
                type: string
                description: Billing Organization currency name.
                example: 'USD'

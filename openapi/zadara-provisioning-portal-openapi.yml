                    type: integer
                    example: 69
                    description: When VPSA creation is moderated, this is the creation
                      request ID.
                    xml:
                      name: vpsa-request-id
                  allocation_zones:
                    type: array
                    items:
                      type: string
                      example: zone_0
                      xml:
                        name: allocation-zone
                    xml:
                      wrapped: true
                      name: allocation-zones
                  engine:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Basic
                      key:
                        type: string
                        example: vsa.V2.small.vf
                      specs:
                        type: string
                        example: 2 CPUs, 8GB RAM
                  description:
                    type: string
                    example: testvpsa description
                  management_url:
                    type: string
                    example: None
                    xml:
                      name: management-url
                  initial_passcode:
                    type: string
                    example: V3JAXQV2
                    xml:
                      name: initial-passcode
                  drive_count:
                    type: integer
                    xml:
                      name: drive-count
                  ip_address:
                    type: string
                    example: None
                    xml:
                      name: ip-address
                  id:
                    type: string
                    example: None
                  time_created_gmt:
                    type: string
                    example: "2014-01-29 02:05:31"
                    xml:
                      name: time-created-gmt
                  name:
                    type: string
                    example: vpsa1
                  cache:
                    type: object
                    properties:
                      total_partitions:
                        type: integer
                        xml:
                          name: total-partitions
                      total_gb:
                        type: integer
                        xml:
                          name: total-gb
                      gb_from_engine:
                        type: integer
                        xml:
                          name: gb-from-engine
                      partitions_from_engine:
                        type: integer
                        xml:
                          name: partitions-from-engine
                  version:
                    type: string
                    example: Z2
                  locked_down:
                    type: integer
                    xml:
                      name: locked-down
                  provider:
                    type: object
                    properties:
                      name:
                        type: string
                        example: AWS US East (N. Virginia) 1
                      key:
                        type: string
                        example: aws

securityDefinitions:
  api_key:
    type: apiKey
    name: X-Token
    in: header
definitions:
  Error:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
  default:
    type: object
    properties:
      status:
        type: integer
      status_msg:
        type: string
        xml:
          name: status-msg
      message:
        type: string
      response:
        type: object
        properties:
          status:
            type: integer
          message:
            type: string
  Cloud:
    type: object
    properties:
      id:
        type: string
        example: "1"
      name:
        type: string
        example: AWS US East (N. Virginia) 1
      uuid:
        type: string
        example: 59af475-2a28-4eb4_b9c6-9567d7fb8ae6
      enabled:
        type: string
        example: "true"
      app_engines:
        type: array
        items:
          type: object
          properties:
            default:
              type: string
              example: "true"
            memory_mb:
              type: string
              example: "1024"
              xml:
                name: memory-mb
            name:
              type: string
              example: "00"
            price:
              type: string
              example: "0.15"
            specs:
              type: string
              example: 2 CPUs, 1GB RAM
            vcpus:
              type: string
              example: "2"
          xml:
            name: app-engine
        xml:
          wrapped: true
          name: app-engines
      nova_url:
        type: string
        example: None
        xml:
          name: nova-url
      auth_url:
        type: string
        example: None
        xml:
          name: auth-url
      keystone_url:
        type: string
        example: None
        xml:
          name: keystone-url
      drive_types:
        type: array
        items:
          type: object
          properties:
            hourly_price_usd:
              type: string
              example: "0.11"
              xml:
                name: hourly-price-usd
            capacity_gb:
              type: integer
              xml:
                name: capacity-gb
            name:
              type: string
              example: 300GB SAS 15000 RPM
            key:
              type: string
              example: SAS_300GB_15KRPM
            id:
              type: string
              example: "1"
          xml:
            name: drive-type
        xml:
          wrapped: true
          name: drive-types
      engine_types:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              example: "1"
            hourly_price_usd:
              type: string
              example: "0.49"
              xml:
                name: hourly-price-usd
            name:
              type: string
              example: "200"
            max_drives:
              type: integer
              xml:
                name: max-drives
            max_cache_gb:
              type: integer
              xml:
                name: max-cache-gb
            key:
              type: string
              example: vsa.V2.baby.vf
            encryption_hourly_price_usd:
              type: string
              example: "0.49"
              xml:
                name: encryption-hourly-price-usd
            specs:
              type: string
              example: 1 CPU, 4GB RAM
            cache:
              type: object
              properties:
                base_cache_gb:
                  type: integer
                  xml:
                    name: base-cache-gb
                max_flash_cache_gb:
                  type: integer
                  xml:
                    name: max-flash-cache-gb
                recommended_flash_cache_gb:
                  type: integer
                  xml:
                    name: recommended-flash-cache-gb
          xml:
            name: engine-type
        xml:
          wrapped: true
          name: engine-types
      fibre_channel:
        type: object
        properties:
          enabled:
            type: boolean
        xml:
          name: fibre-channel
      flash_cache:
        type: object
        properties:
          enabled:
            type: boolean
          increment_gb:
            type: integer
            xml:
              name: increment-gb
        xml:
          name: flash-cache
      minimum_drives:
        type: integer
        xml:
          name: minimum-drives
      supports_app_engines:
        type: boolean
        xml:
          name: supports-app-engines
      zios:
        type: object
        properties:
          enabled:
            type: boolean
      zones:
        type: array
        items:
          type: object
          properties:
            allocation_zone_disp_name:
              type: string
              example: First Zone
              xml:
                name: allocation-zone-disp-name
            allocation_zone_name:
              type: string
              example: zone_0
              xml:
                name: allocation-zone-name
          xml:
            name: zone
        xml:
          wrapped: true
      vpsa_zone_group_storage_policy_types:
        type: array
        items:
          $ref: "#/definitions/vpsa_zone_group_storage_policy_type"
        xml:
          name: vpsa-zone-group-storage-policy-types
          wrapped: true
      recommended_storage_array_image_id:
        type: integer
        example: 1
        xml:
          name: recommended-storage-array-image-id
      last_synced:
        type: string
        format: date_time
        example: "2023-07-19T04:35:00Z"
        xml:
          name: last-synced
      sync_status:
        type: object
        properties:
          status:
            type: string
            example: "connectivity_error"
          sidekiq_jid:
            type: string
            example: "1e09afe26fa1661f09076403"
            xml:
              name: sidekiq-jid
          errors:
            type: array
            items:
              type: object
              properties:
                err_class:
                  type: string
                  example: "Faraday::ConnectionFailed"
                  xml:
                    name: err-class
                err_context:
                  type: string
                  example: "Images"
                  xml:
                    name: err-context
                err_message:
                  type: string
                  example: "Failed to open TCP connection to 1.2.3.4:5000 (execution
                    expired)"
                  xml:
                    name: err-message
              xml:
                name: error
            xml:
              wrapped: true
        xml:
          name: sync-status
      organization:
        x-EnvType: Public
        type: object
        properties:
          id:
            type: string
            format: uuid
            example: "955e1c45-d499-4de3-aa6d-2ef69983561e"
          display_name:
            type: string
            example: "z_org_01"
            xml:
              name: display-name
          name:
            type: string
            description: "Zadara organization"
    xml:
      name: datum
  vpsa_zone_group_storage_policy_type:
    type: object
    xml:
      name: vpsa-zone-group-storage-policy-type
    properties:
      id:
        type: number
        example: 1
      name:
        type: string
        example: "Standard"
      display_name:
        type: string
        example: "Standard Storage Policy"
        xml:
          name: display-name
      replicas:
        type: number
        example: 3
      data_fragments:
        type: number
        example: 1
        xml:
          name: data-fragments
      parity_fragments:
        type: number
        example: 2
        xml:
          name: parity-fragments
      enabled:
        type: boolean
        example: true
      num_of_allocation_zones:
        type: number
        example: 3
        xml:
          name: num-of-allocation-zones
      performance:
        type: string
        example: "High"
      scale:
        type: string
        example: "Up to 1PiB of usable capacity"
      fault_tolerance:
        type: string
        example: "1 failure"
        xml:
          name: fault-tolerance
      utilization:
        type: string
        example: "70%"
      deprecated:
        type: boolean
        example: false
  Organization:
    type: object
    properties:
      id:
        type: string
        example: "03389219-c6a2-4941-92dd-6a75c339e9c7"
      name:
        type: string
        example: "my_z_org"
      display_name:
        type: string
        example: "Zadara"
        xml:
          name: display-name
      country:
        type: string
        example: "IL"
        description: "The 2-letters code of the organization country"
      billing_id:
        type: string
        example: "ae34fa5b-bf74-43dd-805b-1f06f080082b"
        xml:
          name: billing-id
      billing_bucket_id:
        type: string
        example: "ae34fa5b-bf74-43dd-805b-1f06f080082b"
        xml:
          name: billing-bucket-id
      cost_explorer_enabled:
        type: boolean
        example: false
        xml:
          name: cost-explorer-enabled
      tax_id:
        type: string
        xml:
          name: tax-id
      updated_at:
        type: string
        format: date_time
        xml:
          name: updated-at
      created_at:
        type: string
        format: date_time
        xml:
          name: created-at
      deleted_at:
        type: string
        format: date_time
        xml:
          name: deleted-at
      parent:
        $ref: "#/definitions/Organization"
      children:
        type: array
        description: "List of all the descendants of the organization when the 'tree'
          param is specified"
        items:
          $ref: "#/definitions/Organization"
        xml:
          wrapped: true
      active:
        type: boolean
        description: "Organization has at least 1 active organization admin"
        example: true
      users_count:
        type: integer
        description: "Count of users attached to the organization"
        example: 1
        xml:
          name: users-count
      visibility:
        type: string
        enum:
        - org_clouds
        - provider_groups_clouds
        - all_clouds
        default: "all_clouds"
        description: "Which clouds are visible for the organization"
        example: "all_clouds"
      ancestors:
        type: array
        description: "List of all the ancestors of the organization when a specific
          org is retrieved"
        items:
          $ref: "#/definitions/Organization"
        xml:
          wrapped: true
    xml:
      name: organization
  OrganizationParams:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        description: Organization name, must be unique.
        example: "my_z_org"
      display_name:
        type: string
        description: Organization name to display.
        example: "Zadara"
      country:
        type: string
        example: "IL"
      billing_id:
        type: string
        description: "Billing Organization ID"
        example: "e88475a9-41cf-4fd0-abe2-f5e5560acbb0"
      billing_bucket_id:
        type: string
        description: Organization billing bucket name
        example: "e88475a9-41cf-4fd0-abe2-f5e5560acbb0"
      cost_explorer_enabled:
        type: boolean
        default: false
        description: Cost explorer enabled for the organization. Applicable only if
          billing_bucket_id is set.
      tax_id:
        type: string
      parent_id:
        type: string
        description: "Parent organization id"
        example: "ccd8b780-af96-4fc6-9ca2-8b0806e5f3e6/17137ad9-1a8e-4112-bb92-10d01305cd0f"
  CostExplorerDetails:
    type: object
    properties:
      id:
        type: integer
        example: 12345
      report_date:
        type: string
        format: date
        example: 2025-01-01
        xml:
          name: report-date
      org_id:
        type: string
        example: e88475a9-41cf-4fd0-abe2-f5e5560acbb0
        xml:
          name: org-id
      parent_org:
        type: string
        example: parent organization
        xml:
          name: parent-org
      cloud:
        type: string
        example: cloud-01
      cloud_id:
        type: string
        example: e88475a9-41cf-4fd0-abe2-f5e5560acbb0
        xml:
          name: cloud-id
      customer:
        type: string
        example: customer-01
      resource_type:
        type: string
        example: VPSA
        xml:
          name: resource-type
      resource_id:
        type: string
        example: vsa-01010101
        xml:
          name: resource-id
      resource_name:
        type: string
        example: STO_HDD_BKP_ZADARA
        xml:
          name: resource-name
      billable_type:
        type: string
        example: SAS_13038GB_7200RPM
        xml:
          name: billable-type
      item:
        type: string
        example: 14TB HDD
      item_description:
        type: string
        example: 14TB HDD Drive
        xml:
          name: item-description
      resource_created_at:
        type: string
        format: date-time
        example: 2025-01-01T12:00:00Z
        xml:
          name: resource-created-at
      resource_deleted_at:
        type: string
        format: date-time
        example: 2025-01-01T12:00:00Z
        xml:
          name: resource-deleted-at
      resource_status:
        type: string
        example: created
        xml:
          name: resource-status
      compute_account_id:
        type: string
        example: 3883528641024603d9c0258e5e9c760e
        xml:
          name: compute-account-id
      compute_account_name:
        type: string
        example: 12345678_ABCD
        xml:
          name: compute-account-name
      compute_project_id:
        type: string
        example: 9ea7ee2e51a9467d1672ecadcc88e1b1
        xml:
          name: compute-project-id
      compute_project_name:
        type: string
        example: 12345678_ABCD
        xml:
          name: compute-project-name
      compute_user_id:
        type: string
        example: e4a9f400683c8caef8de1a3ac5ea3ca6
        xml:
          name: compute-user-id
      compute_user_name:
        type: string
        example: compute.name
        xml:
          name: compute-user-name
      vm_cpus:
        type: integer
        example: 32
        xml:
          name: vm-cpus
      vm_ram:
        type: integer
        example: 64
        xml:
          name: vm-ram
      volume_disk_size:
        type: integer
        example: 4096
        xml:
          name: volume-disk-size
      vm_attached_to_uuid:
        type: string
        example: e4a9f400-683c-8cae-f8de-1a3ac5ea3ca6
        xml:
          name: vm-attached-to-uuid
      service_type:
        type: string
        example: a1
        xml:
          name: service-type
      compute_instance_type:
        type: string
        example: z2.large
        xml:
          name: compute-instance-type
      compute_instance_type_aws_alias:
        type: string
        example: m1.xlarge
        xml:
          name: compute-instance-type-aws-alias
      unit_price:
        type: number
        example: 0.344
        xml:
          name: unit-price
      discount:
        type: number
        example: 0.83
      quantity_mtd:
        type: integer
        example: 737
        xml:
          name: quantity-mtd
      quantity_est:
        type: integer
        example: 737
        xml:
          name: quantity-est
      hours_mtd:
        type: integer
        example: 737
        xml:
          name: hours-mtd
      hours_est:
        type: integer
        example: 737
        xml:
          name: hours-est
      gross_amount_mtd:
        type: number
        example: 63.98
        xml:
          name: gross-amount-mtd
      gross_amount_est:
        type: number
        example: 63.98
        xml:
          name: gross-amount-est
      net_amount_mtd:
        type: number
        example: 10.88
        xml:
          name: net-amount-mtd
      net_amount_est:
        type: number
        example: 10.88
        xml:
          name: net-amount-est
      image_source:
        type: string
        example: 73f05543-3672-a210-9df2f-40ab1f1764b
        xml:
          name: image-source
      billing_uuid:
        type: string
        example: "e88475a9-41cf-4fd0-abe2-f5e5560acbb0"
        xml:
          name: billing-uuid
      daily_quantity:
        type: integer
        example: 24
        xml:
          name: daily-quantity
        description: when granularity is daily calculated quantity_mtd(today) - quantity_mtd(yesterday)
      daily_hours:
        type: integer
        example: 24
        xml:
          name: daily-hours
        description: when granularity is daily calculated hours_mtd(today) - hours_mtd(yesterday)
      daily_gross_amount:
        type: number
        example: 95.75999
        xml:
          name: daily-gross-amount
        description: when granularity is daily calculated gross_amount_mtd(today)
          - gross_amount_mtd(yesterday)
      daily_net_amount:
        type: number
        example: 95.75999
        xml:
          name: daily-net-amount
        description: when granularity is daily calculated net_amount_mtd(today) -
          net_amount_mtd(yesterday)
      created_at:
        type: string
        format: date-time
        example: 2025-01-01T12:00:00Z
        xml:
          name: created-at
      updated_at:
        type: string
        format: date-time
        example: 2025-01-01T12:00:00Z
        xml:
          name: updated-at
      metadata:
        type: object
        properties:
          estimation:
            type: boolean
            example: true
    xml:
      name: billing-details

  ProviderGroup:
    type: object
    properties:
      id:
        type: string
        example: '1'
      name:
        type: string
        example: pg1
      visibility:
        x-roles: Platform Admin
        type: string
        example: specific_organizations
        enum:
        - specific_organizations
        - all_users
      visible_organizations:
        x-roles: Platform Admin
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              example: "03389219-c6a2-4941-92dd-6a75c339e9c7"
            name:
              type: string
              example: org
            display_name:
              type: string
              example: Organization
              xml:
                name: display-name
          xml:
            name: visible-organization
        xml:
          wrapped: true
          name: visible-organizations
    xml:
      name: provider-group

  Tenant:
    type: object
    properties:
      id:
        type: integer
      user_id:
        type: integer
        xml:
          name: user-id
      username:
        type: string
        example: test1
      name:
        type: string
        example: tenant_test1_bd8Bs
      pretty_name:
        type: string
        example: "admin"
        xml:
          name: pretty-name
      provider_id:
        type: integer
        xml:
          name: provider-id
      provider_name:
        type: string
        example: "zadara-qa18"
        xml:
          name: provider-name
      internal_id:
        type: integer
        xml:
          name: internal-id
    xml:
      name: tenant
  UpdateVersionBody:
    type: object
    required:
    - when
    - password
    properties:
      when:
        type: string
        description: When to perform the update. "now" to peform immediately. "schedule"
          to schedule update in the next 7 days, must include the scheduled_datetime
          parameter.
        example: now
        enum:
        - now
        - schedule
      password:
        type: string
        description: Your Provisioning Portal password
        example: my_password
      scheduled_datetime:
        type: string
        format: date_time
        example: "2023-08-28T11:41:33.000Z"
        description: Date and time within 30 minutes from now to the next 7 days to
          schedule the software update.
  Vpsa:
    type: object
    properties:
      allocation_zones:
        type: array
        items:
          type: string
          example: zone_2
          xml:
            name: allocation-zone
        xml:
          wrapped: true
          name: allocation-zones
      cache:
        type: object
        properties:
          extra_gb:
            type: integer
            example: 0
            xml:
              name: extra-gb
          extra_partitions:
            type: integer
            example: 0
            xml:
              name: extra-partitions
          included_gb:
            type: integer
            example: 20
            xml:
              name: included-gb
          included_partitions:
            type: integer
            example: 1
            xml:
              name: included-partitions
          total_gb:
            type: integer
            example: 20
            xml:
              name: total-gb
          total_partitions:
            type: integer
            example: 1
            xml:
              name: total-partitions
      app_engine:
        type: object
        properties:
          name:
            type: string
            example: Small
          key:
            type: string
            example: tiny
          specs:
            type: string
            example: 2 CPUs, 1GB RAM
        xml:
          name: app-engine
      status:
        type: string
        example: created
      description:
        type: string
        example: testvpsa description
      fibre_channel:
        type: boolean
        example: false
        xml:
          name: fibre-channel
      drives:
        type: object
        example:
          SATA_2793GB_7200RPM: "2"
          SSD_7152GB_1RPM: "4"
        properties:
          drive_type:
            type: string
            example: SATA_2793GB_7200RPM
            xml:
              name: drive-type
          quantity:
            type: integer
            example: 2
      drive_count:
        type: integer
        example: 2
        xml:
          name: drive-count
      engine:
        type: object
        properties:
          name:
            type: string
            example: Basic
          key:
            type: string
            example: vsa.V2.small.vf
          specs:
            type: string
            example: 2 CPUs, 8GB RAM
      nova_id:
        type: integer
        example: 4792
        xml:
          name: nova-id
      management_url:
        type: string
        example: https://vsa-000003d2_aws.zadaravpsa.com
        xml:
          name: management-url
      initial_passcode:
        type: string
        example: V3JAXQV2
        xml:
          name: initial-passcode
      ip_address:
        type: string
        example: "10.10.1.33"
        xml:
          name: ip-address
      id:
        type: integer
        example: 1
      time_created_gmt:
        type: string
        example: "2014-01-29 02:05:31"
        xml:
          name: time-created-gmt
      name:
        type: string
        example: testvpsa
      locked_down:
        type: boolean
        example: false
        xml:
          name: locked-down
      provider:
        type: object
        properties:
          name:
            type: string
            example: AWS US East (N. Virginia) 1
          key:
            type: string
            example: aws
      product:
        type: string
        example: storage_array
      type:
        type: string
        example: VPSA Storage Array
      virtual_network_interfaces:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Custom network id
              example: 1
            ip:
              type: string
              description: Custom network ip address
              example: "172.128.10.1"
            vni_id:
              type: integer
              description: Virtual Network Interface id
              example: 1
              xml:
                name: vni-id
            nova_id:
              type: integer
              description: Custom network Nova id
              example: 45
              xml:
                name: nova-id
            vlan_id:
              type: integer
              description: Custom network VLAN id
              example: 54
              xml:
                name: vlan-id
            cidr:
              type: string
              description: Custom network cidr
              example: "172.128.10.0/24"
            name:
              type: string
              description: Custom network name
              example: my_custom_network
            vpsa_id:
              type: integer
              description: VPSA id
              example: 1
              xml:
                name: vpsa-id
          xml:
            name: virtual-network-interface
        xml:
          wrapped: true
          name: virtual-network-interfaces
      file_lifecycle:
        type: boolean
        example: true
        xml:
          name: file-lifecycle
      iscsi_dual_target:
        type: boolean
        example: true
        xml:
          name: iscsi-dual-target
      scheduled_upgrade_capable:
        type: boolean
        example: true
        xml:
          name: scheduled-upgrade-capable
      update_available:
        type: boolean
        example: true
        xml:
          name: update-available
      upgrade_when:
        type: string
        description: When the VPSA software version is scheduled to be upgraded. "now"
          means immediate upgrade. "manual" means upgrade will occur after resume.
          Or a scheduled time when the upgrade will apply.
        example: "2023-08-19T04:35:00Z"
        xml:
          name: upgrade-when
      upgrade_target:
        type: string
        description: VPSA software upgrade target version
        example: "vc-23.09-115.img"
        xml:
          name: upgrade-target
      upgrade_initiator:
        type: string
        description: VPSA software upgrade initiator, "cc" represents Command Center
          user, "pp" represents Provisioning Portal user.
        xml:
          name: upgrade-initiator
      cancel_scheduled_upgrade_capable:
        type: boolean
        description: VPSA capable of processing cancellation of scheduled software
          version upgrade.
        example: true
        xml:
          name: cancel-scheduled-upgrade-capable
      created_at:
        type: string
        format: date_time
        example: "2023-07-19T04:35:00Z"
        xml:
          name: created-at
      replication_service_enabled:
        type: boolean
        example: false
        xml:
          name: replication-service-enabled
    xml:
      name: datum

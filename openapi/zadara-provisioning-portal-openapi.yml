              type: string
              description: Your VPSA's name.
              example: vpsa1
            description:
              type: string
              description: Your VPSA's description.
            provider:
              type: string
              description: The key for your desired site.
              example: aws
            allocation_zone:
              type: string
              description: Use this parameter to create vcs in a specific allocation
                zone. Use /providers API to get allocation zones. If using multiple
                zones, don't pass this parameter
              example: zone_0
            drives:
              type: object
              description: Specify a quantity for an available Drive Type.
              example:
                SATA_2793GB_7200RPM: "2"
                SSD_7152GB_1RPM: "4"
              properties:
                drive_type:
                  type: string
                  example: SATA_2793GB_5940RPM
                quantity:
                  type: integer
            custom_network_id:
              description: Specify a custom network according. If not specified and
                user has only one Custom Network, it will be automatically used.
              type: integer
            vlan_id:
              description: Specify a vlan ID
              type: integer
              example: 50
            engine:
              x-VpsaType: VPSA Storage Array
              type: string
              description: The Engine Type key for your desired Engine Type.
              example: vsa.V2.baby.mz.vf
            app_engine:
              x-VpsaType: VPSA Storage Array
              type: string
              description: The APP Engine Type key for your desired APP Engine Type.
              example: tiny
            flash_cache_capacity:
              x-VpsaType: VPSA Storage Array
              description: The amount of extended Flash Cache you would like your
                VPSA to be created with, if your Cloud supports extended Flash Cache.  Cannot
                exceed the maximum extended Flash Cache value for your VPSA's Engine
                Type, and must be in increments of `increment_gb`, as specified by
                the Cloud's `flash_cache` properties.
              example: 0
              type: integer
            enterprise_suite:
              x-VpsaType: VPSA Storage Array
              description: Any value for this parameter will enable Enterprise Suite
                features.  Omit the parameter to disable Enterprise Suite.
              type: string
            fibre_channel:
              x-VpsaType: VPSA Storage Array
              description: Any value for this parameter will enable Fibre Channel,
                if the Cloud supports it.  Omit this parameter to disable Fibre Channel.
              type: string
            iscsi_dual_target_mode_enabled:
              x-VpsaType: VPSA Storage Array
              description: Any value for this parameter will enable iSCSI Dual Target,
                if the Cloud supports it.  Omit this parameter to disable iSCSI Dual
                Target.
              type: string
            create_raid_10_pools:
              x-VpsaType: VPSA Storage Array
              description: VPSA will automatically create a Pool consisting of RAID10
                from requested disks. Default - true.
              type: boolean
            data_reduction_bundle:
              x-VpsaType: VPSA Storage Array
              description: Sets Data Reduction Bundle for Flash VPSAs (relevant only
                to vpsa flash array). Default - true.
              type: boolean
            vpsa_zone_group_storage_policy_type_id:
              x-VpsaType: VPSA Object Storage
              type: integer
              example: 2
            storage_profile:
              x-VpsaType: VPSA Object Storage
              type: string
              example: standard
            moderate:
              type: boolean
              description: Create vpsa request.
              example: false
              default: false
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
        "200":
          description: successful operation
          schema:
            xml:
              name: response
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: Request failed
              data:
                type: object
                properties:

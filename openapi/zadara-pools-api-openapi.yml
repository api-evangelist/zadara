openapi: 3.2.0
info:
  title: Zadara Pools API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Pools across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Pools
  description: Operations involving Pools.
paths:
  /pools.json:
    get:
      tags:
      - Pools
      description: Show all Pools.
      operationId: get_all_pools
      security:
      - api_key: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      pools:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: pool-00000001
                            display_name:
                              type: string
                              example: poolrenamed
                              xml:
                                name: display-name
                            status:
                              type: string
                              example: normal
                            capacity:
                              type: integer
                              minimum: 1
                              example: 462
                            available_capacity:
                              type: number
                              example: 451.875
                              xml:
                                name: available-capacity
                            version:
                              type: integer
                              example: 2
                            data_type:
                              type: string
                              example: None
                              xml:
                                name: data-type
                            mount_sync:
                              type: string
                              example: None
                              xml:
                                name: mount-sync
                            access_time_update:
                              type: string
                              example: None
                              xml:
                                name: access-time-update
                            raid_group_name:
                              type: string
                              example: raid_group_renamed
                              xml:
                                name: raid-group-name
                            mode:
                              type: string
                              example: simple
                            stripe_size:
                              type: integer
                              example: 64
                              xml:
                                name: stripe-size
                            cache:
                              type: string
                              example: 'NO'
                            cow_cache:
                              type: string
                              example: 'NO'
                              xml:
                                name: cow-cache
                            capacity_mode:
                              type: string
                              example: normal
                              xml:
                                name: capacity-mode
                            capacity_history:
                              type: integer
                              example: 10
                              xml:
                                name: capacity-history
                            alert_mode:
                              type: integer
                              example: 360
                              xml:
                                name: alert-mode
                            protected_mode:
                              type: integer
                              example: 60
                              xml:
                                name: protected-mode
                            emergency_mode:
                              type: integer
                              example: 100
                              xml:
                                name: emergency-mode
                            chunk_size:
                              type: integer
                              example: 256
                              xml:
                                name: chunk-size
                            type:
                              type: string
                              example: OLTP
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: pool

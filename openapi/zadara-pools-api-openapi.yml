      x-summary-source: derived
    post:
      tags:
      - Pools
      description: Create a Pool. Pool can be created either from disks or from raid groups.
      operationId: create_pool
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      pool_name:
                        type: string
                        example: pool-00000001
                        xml:
                          name: pool-name
                      status:
                        type: integer
                    xml:
                      name: create-pool-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      pool_name:
                        type: string
                        example: pool-00000001
                        xml:
                          name: pool-name
                      status:
                        type: integer
                    xml:
                      name: create-pool-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  description: The new pool display name
                  example: new-pool
                capacity:
                  type: string
                  minimum: 1
                  description: The new pool capacity followed by the letter G
                  x-VpsaType: hybrid
                  example: 30G
                cache:
                  type: string
                  description: Indicate whether the Pool will utilize the VPSA SSD cache. All Pools marked YES share the same cache capacity.
                  x-VpsaType: hybrid
                  enum:
                  - 'YES'
                  - 'NO'
                  default: 'NO'
                  example: 'NO'
                force:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                  default: 'NO'
                  example: 'NO'
                cooloffhours:
                  type: string
                  example: '1'
                cowcache:
                  type: boolean
                  description: 'Indicate whether snapshot Copy-On-Write operations are Cached. Default: YES'
                  x-VpsaType: hybrid
                  default: true
                mode:
                  type: string
                  enum:
                  - stripe
                  - simple
                  description: Indicate whether RAID groups are concatinated or striped inside the Pool.
                  x-VpsaType: hybrid
                  default: simple
                raid_groups:
                  type: string
                  pattern: (?:RaidGroup-[0-9]+[,]?)+
                  description: Comma separated list of RAID Group IDs.
                  example: RaidGroup-4
                disks:
                  type: string
                  pattern: (?:volume-[0-9a-f]{8}[,]?)+
                  description: Comma separated list of disk IDs.
                  example: volume-00000d56,volume-00000d57
                pooltype:
                  type: string
                  enum:
                  - Transactional Workloads
                  - Repository Storage
                  - Archival Storage
                  - IOPs-Optimized
                  - Balanced
                  - Throughput-Optimized
                  - Depot
                  - Depot Storage
                  description: 'The new pool type. VPSA Storage Array: Repository Storage, Transactional Workloads, Archival Storage, Depot Storage. VPSA Flash Array: IOPs-Optimized, Balanced, Throughput-Optimized.'
                  example: Repository Storage
        required: true
      summary: Create pool
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

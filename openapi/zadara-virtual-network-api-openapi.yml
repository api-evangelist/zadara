openapi: 3.2.0
info:
  title: Zadara Virtual Network API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Virtual Network across 2 of this provider''s published API definitions: zadara-provisioning-portal-25.07.yml, zadara-provisioning-portal-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api/v2
tags:
- name: Virtual Network
  description: Retrieve Vlan's Configurations
paths:
  /virtual_networks.json:
    get:
      tags:
      - Virtual Network
      description: Get the list of virtual networks.
      operationId: get_virtual_networks
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          example: vni_test16
                        vlan_id:
                          type: integer
                          xml:
                            name: vlan-id
                        tenant_id:
                          type: integer
                          xml:
                            name: tenant-id
                        provider_id:
                          type: integer
                          xml:
                            name: provider-id
                      xml:
                        name: datum
                    xml:
                      wrapped: true
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          example: vni_test16
                        vlan_id:
                          type: integer
                          xml:
                            name: vlan-id
                        tenant_id:
                          type: integer
                          xml:
                            name: tenant-id
                        provider_id:
                          type: integer
                          xml:
                            name: provider-id
                      xml:
                        name: datum
                    xml:
                      wrapped: true
      summary: Get virtual networks
      x-summary-source: derived
    post:
      tags:
      - Virtual Network
      description: Create a virtual network
      operationId: create_virtual_network
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Virtual Network successfully created
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Virtual Network successfully created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - provider_id
              - tenant_id
              properties:
                name:
                  type: string
                  example: mynetwork
                provider_id:
                  type: string
                  example: '1'
                tenant_id:
                  type: string
                  example: '1'
                gateway:
                  type: string
                  example: 170.70.1.1
                gateway_zone_1:
                  type: string
                  example: 170.70.1.1
                ipv6_gateway:
                  type: string
                  example: 2001:16:58::1
                ipv6_gateway_zone_1:
                  type: string
                  example: 2001:16:58::1
                cidr:
                  type: string
                  example: 170.70.1.0/24
                ipv6_cidr:
                  type: string
                  example: 2001:16:58::/32
                allocatable_ip_ranges:
                  type: string
                  example: 170.70.1.2-170.70.1.50
                ipv6_allocatable_ip_ranges:
                  type: string
                  example: 2001:16:58::2-2001:16:58::52
                vlan_id:
                  description: To automatically assign use "vlan_id":""
                  type: integer
                  example: 50
                default_for_tenant:
                  type: boolean
        required: true
      summary: Create virtual network
      x-summary-source: derived
    servers:
    - url: https://localhost/api/v2
  /virtual_networks/{id}.json:
    delete:
      tags:
      - Virtual Network
      description: Delete a virtual network
      operationId: delete_virtual_networks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Virtual Network successfully deleted
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Virtual Network successfully deleted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_id
              - vlan
              properties:
                provider_id:
                  type: integer
                  example: 1
                vlan:
                  type: integer
                  example: 50
        required: true
      summary: Delete virtual networks
      x-summary-source: derived
    servers:
    - url: https://localhost/api/v2
components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Token
      in: header

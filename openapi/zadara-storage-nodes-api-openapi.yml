openapi: 3.2.0
info:
  title: Zadara Storage Nodes API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Storage Nodes across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Storage Nodes
  description: Operations involving Storage Nodes.
paths:
  /clouds/{cloud_name}/nodes.json:
    get:
      tags:
      - Storage Nodes
      description: Returns a list of all Storage Nodes in a Zadara Storage Cloud.
      operationId: get_all_storage_nodes
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all storage nodes
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}.json:
    get:
      tags:
      - Storage Nodes
      description: Returns a single Storage Node.
      operationId: get_storage_node
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  node:
                    $ref: '#/components/schemas/Node'
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  node:
                    $ref: '#/components/schemas/Node'
      summary: Get storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/drives.json:
    get:
      tags:
      - Storage Nodes
      description: Returns the details for a Storage Node's drives.
      operationId: get_storage_node_drives
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-00003e4c
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: ubuntu_sata-51
                        size:
                          type: integer
                        type:
                          type: string
                          example: SAS 136GB 15000RPM
                        address:
                          type: string
                          example: 0:0:7 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: SEAGATE ST3300657SS-H
                          xml:
                            name: product-id
                        status:
                          type: string
                          example: Available
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-00003e4c
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: ubuntu_sata-51
                        size:
                          type: integer
                        type:
                          type: string
                          example: SAS 136GB 15000RPM
                        address:
                          type: string
                          example: 0:0:7 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: SEAGATE ST3300657SS-H
                          xml:
                            name: product-id
                        status:
                          type: string
                          example: Available
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get storage node drives
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/cache_partitions.json:
    get:
      tags:
      - Storage Nodes
      description: Returns the details for a Storage Node's cache partitions.
      operationId: get_sn_cache_partitions_details
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  cache_partitions:
                    type: object
                    properties:
                      cache_partition:
                        type: object
                        properties:
                          id:
                            type: string
                            example: volume-0000000d
                          drive:
                            type: object
                            properties:
                              device_name:
                                type: string
                                example: /dev/sdl
                                xml:
                                  name: device-name
                              url:
                                type: string
                                example: /clouds/openstack/vpsas/2
                              name:
                                type: string
                                example: Udi1407
                          size:
                            type: integer
                        xml:
                          name: cache-partition
                    xml:
                      name: cache-partitions
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  cache_partitions:
                    type: object
                    properties:
                      cache_partition:
                        type: object
                        properties:
                          id:
                            type: string
                            example: volume-0000000d
                          drive:
                            type: object
                            properties:
                              device_name:
                                type: string
                                example: /dev/sdl
                                xml:
                                  name: device-name
                              url:
                                type: string
                                example: /clouds/openstack/vpsas/2
                              name:
                                type: string
                                example: Udi1407
                          size:
                            type: integer
                        xml:
                          name: cache-partition
                    xml:
                      name: cache-partitions
                  count:
                    type: integer
      summary: Get sn cache partitions details
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/virtual_controllers.json:
    get:
      tags:
      - Storage Nodes
      description: Returns the details of the Virtual Controllers which are running inside a Storage Node's.
      operationId: get_sn_vcs_details
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  virtual_controllers:
                    type: object
                    xml:
                      name: virtual-controllers
                    properties:
                      virtual_controller:
                        type: object
                        xml:
                          name: virtual-controller
                        properties:
                          name:
                            type: string
                            example: vc-0:a_final
                          status:
                            type: string
                            example: Active
                          protection:
                            type: string
                            example: Baby (V2)
                          ofed_version:
                            type: string
                            example: 4.4-OFED.4.4.2.0.7.0.30+zadara06
                            xml:
                              name: ofed-version
                          ofed_short_version:
                            type: string
                            example: '4.4'
                            xml:
                              name: ofed-short-version
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  virtual_controllers:
                    type: object
                    xml:
                      name: virtual-controllers
                    properties:
                      virtual_controller:
                        type: object
                        xml:
                          name: virtual-controller
                        properties:
                          name:
                            type: string
                            example: vc-0:a_final
                          status:
                            type: string
                            example: Active
                          protection:
                            type: string
                            example: Baby (V2)
                          ofed_version:
                            type: string
                            example: 4.4-OFED.4.4.2.0.7.0.30+zadara06
                            xml:
                              name: ofed-version
                          ofed_short_version:
                            type: string
                            example: '4.4'
                            xml:
                              name: ofed-short-version
                  count:
                    type: integer
      summary: Get sn vcs details
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/evacuate_vcs.json:
    post:
      tags:
      - Storage Nodes
      description: Evacuate a Storage Node from all Virtual Controllers. The Virtual Controllers will be deleted and re_spawned on a different Storage Node.
      operationId: evacoate_vc_from_sn
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: In case the Storage Node that hosts the VC is offline and marked for decommission, use the force flag to allow the VC relocation.
                  example: true
        required: true
      summary: Evacoate vc from sn
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/evacuate_drives.json:
    post:
      tags:
      - Storage Nodes
      description: Evacuate a Storage Node from all allocated drives. Replacement drives for the affected VPSA will be allocated from other Storage Nodes
      operationId: evacoated_drives_from_sn
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      summary: Evacoated drives from sn
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/failover.json:
    post:
      tags:
      - Storage Nodes
      description: Failover a Storage Node.
      operationId: failover_storage_node
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Storage Node failover initiated.
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Storage Node failover initiated.
      summary: Failover storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/reboot.json:
    post:
      tags:
      - Storage Nodes
      description: Reboot a Storage Node.
      operationId: reboot_storage_node
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  example: true
                power_cycle:
                  type: boolean
                  example: true
        required: true
      summary: Reboot storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/shutdown.json:
    post:
      tags:
      - Storage Nodes
      description: Shutdown a Storage Node.
      operationId: shutdown_storage_node
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:

                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  example: true
        required: true
      summary: Shutdown storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/zsnap.json:
    post:
      tags:
      - Storage Nodes
      description: Create a Storage Node Zsnap.
      operationId: zsnap_storage_node
      parameters:
      - in: path
        name: cloud_name
        required: true

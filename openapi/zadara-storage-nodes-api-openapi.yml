                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prefix
              properties:
                prefix:
                  type: string
                  example: zsnap1
        required: true
      summary: Zsnap storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/license.json:
    post:
      tags:
      - Storage Nodes
      description: Activate a license key for a Storage Node.
      operationId: license_storage_node
      parameters:

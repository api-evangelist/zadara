      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/check_configuration.json:
    get:
      tags:
      - Storage Nodes
      description: Check the configuration for a Storage Node.
      operationId: get_sn_conf
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  configuration:
                    type: string
                    example: (configuration data...)
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  configuration:
                    type: string
                    example: (configuration data...)
      summary: Get sn conf
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{node_name}/install.json:
    post:
      tags:
      - Storage Nodes
      description: Install a Storage Node.
      operationId: install_sn
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: node_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:

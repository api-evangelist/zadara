                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                  example: 552AA-7AAAR-CVVVW-G3378-V776N
        required: true
      summary: License storage node
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/nodes/{id}/refresh_license.json:
    post:
      tags:
      - Storage Nodes
      description: Refresh a Storage Node's license status.
      operationId: refresh_sn_license_status

                          xml:
                            name: be-ip
                        be_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: be-vlan-id
                        hb_ip:
                          type: string
                          example: 150.50.0.116
                          xml:
                            name: hb-ip
                        hb_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: hb-vlan-id
                      xml:
                        name: virtual-controller
                    xml:
                      name: virtual-controllers
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  virtual_controllers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: vc-0:zios
                        state:
                          type: string
                          example: Created
                        node:
                          type: string
                          example: dev2_sn4
                        zios_storage_role:
                          type: string
                          example: Proxy+Storage
                          xml:
                            name: zios-storage-role
                        zios_management_role:
                          type: string
                          example: Ring Master
                          xml:
                            name: zios-management-role
                        vcpus:
                          type: array
                          items:
                            type: integer
                            xml:
                              name: vcpu
                          xml:
                            wrapped: true
                        fe_ip:
                          type: string
                          example: 150.50.2.116
                          xml:
                            name: fe-ip
                        fe_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: fe-vlan-id
                        be_ip:
                          type: string
                          example: 150.50.3.116
                          xml:
                            name: be-ip
                        be_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: be-vlan-id
                        hb_ip:
                          type: string
                          example: 150.50.0.116
                          xml:
                            name: hb-ip
                        hb_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: hb-vlan-id
                      xml:
                        name: virtual-controller
                    xml:
                      name: virtual-controllers
                      wrapped: true
                  count:
                    type: integer
      summary: Get vpsaos vcs
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/zioses/{id}/storage_policies.json:

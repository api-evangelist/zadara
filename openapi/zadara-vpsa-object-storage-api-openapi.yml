openapi: 3.2.0
info:
  title: Zadara VPSA Object Storage API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged VPSA Object Storage across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: VPSA Object Storage
  description: Operations involving VPSA Object Storage.
paths:
  /clouds/{cloud_name}/zioses.json:
    get:
      tags:
      - VPSA Object Storage
      description: Returns a list of all VPSA Object Storage Object stores.
      operationId: get_all_vpsaos
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  zioses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Zios'
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  zioses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Zios'
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all vpsaos
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/zioses/{id}.json:
    get:
      tags:
      - VPSA Object Storage
      description: Returns the details for a single VPSA Object Storage.
      operationId: get_zios_from_cloud
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA Object Storage 'id' or 'internal-name' value as returned by get_all_zioses.
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  zios:
                    $ref: '#/components/schemas/Zios'
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  zios:
                    $ref: '#/components/schemas/Zios'
      summary: Get zios from cloud
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/zioses/{id}/drives.json:
    get:
      tags:
      - VPSA Object Storage
      description: Returns the list of a VPSA Object Storage drives.
      operationId: get_all_zios_drives_from_cc
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA Object Storage 'id' or 'internal-name' value as returned by get_all_zioses.
        required: true
        schema:
          type: string
          pattern: vsa-[0-9a-z]+|[0-9]+
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-000009c9
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: dev2_sn4
                        size:
                          type: integer
                        type:
                          type: string
                          example: SSD CACHE DRIVES
                        uuid:
                          type: string
                          example: 5000039FF4CC7F35
                        address:
                          type: string
                          example: 0:0:5:0
                        location:
                          type: string
                          example: 0:7:3 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: ATA SDLF1CRM-016T-1HA
                          xml:
                            name: product-id
                        drive_id:
                          type: string
                          xml:
                            name: drive-id
                        partition_count_degraded:
                          type: string
                          xml:
                            name: partition-count-degraded
                        partition_count_critical:
                          type: string
                          xml:
                            name: partition-count-critical
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        internal_name:
                          type: string
                          example: volume-000009c9
                          xml:
                            name: internal-name
                        node:
                          type: string
                          example: dev2_sn4
                        size:
                          type: integer
                        type:
                          type: string
                          example: SSD CACHE DRIVES
                        uuid:
                          type: string
                          example: 5000039FF4CC7F35
                        address:
                          type: string
                          example: 0:0:5:0
                        location:
                          type: string
                          example: 0:7:3 (Ad:En:Sl)
                        product_id:
                          type: string
                          example: ATA SDLF1CRM-016T-1HA
                          xml:
                            name: product-id
                        drive_id:
                          type: string
                          xml:
                            name: drive-id
                        partition_count_degraded:
                          type: string
                          xml:
                            name: partition-count-degraded
                        partition_count_critical:
                          type: string
                          xml:
                            name: partition-count-critical
                      xml:
                        name: drive
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all zios drives from cc
      x-summary-source: derived
    post:
      tags:
      - VPSA Object Storage
      description: Add drives to VPSA Object Storage.
      operationId: add_drives_to_zios
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA Object Storage 'id' or 'internal-name' value as returned by get_all_zioses.
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Submitted request to add 2 SATA_2793GB_5940RPM drive(s).
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Submitted request to add 2 SATA_2793GB_5940RPM drive(s).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - drive_type
              - quantity
              - policy_id
              properties:
                drive_type:
                  type: string
                  example: SATA_2793GB_5940RPM
                  description: Drive type internal name
                quantity:
                  type: integer
                  example: 2
                  description: Number of drives to add
                policy_id:
                  type: string
                  example: storage-policy-00000001
                  description: policy id or internal_name
        required: true
      summary: Add drives to zios
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/zioses/{id}/virtual_controllers.json:

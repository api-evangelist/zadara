  /clouds/{cloud_name}/zioses/{id}/accounts.json:
    get:
      tags:
      - VPSA Object Storage
      description: Returns the list of a VPSA Object Storage accounts.
      operationId: get_vpsaos_accounts
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: The VPSA Object Storage 'id' or 'internal-name' value as returned by get_all_zioses.
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: zios_admin
                        enabled:
                          type: boolean
                        users:
                          type: integer
                        containers:
                          type: integer
                        objects:
                          type: integer
                        used_capacity:
                          type: integer
                          xml:
                            name: used-capacity
                      xml:
                        name: account
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  accounts:

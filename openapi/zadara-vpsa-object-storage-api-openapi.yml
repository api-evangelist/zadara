                              xml:
                                name: critical-count
                          xml:
                            name: ring-balance
                        used_capacity:
                          type: integer
                          xml:
                            name: used-capacity
                        free_capacity:
                          type: integer
                          xml:
                            name: free-capacity
                      xml:
                        name: zios-storage-policy
                    xml:
                      name: zios-storage-policies
                      wrapped: true
                  count:

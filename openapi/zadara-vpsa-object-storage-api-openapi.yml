                            name: zios-storage-role
                        zios_management_role:
                          type: string
                          example: Ring Master
                          xml:
                            name: zios-management-role
                        vcpus:
                          type: array
                          items:
                            type: integer
                            xml:
                              name: vcpu
                          xml:
                            wrapped: true
                        fe_ip:
                          type: string
                          example: 150.50.2.116
                          xml:
                            name: fe-ip
                        fe_vlan_id:
                          type: integer
                          example: 50
                          xml:
                            name: fe-vlan-id
                        be_ip:
                          type: string

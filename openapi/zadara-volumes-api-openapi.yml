    post:
      tags:
      - Volumes
      description: Create a Volume.
      operationId: create_volume
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      vol_name:
                        type: string
                        example: volume-00000001
                        xml:
                          name: vol-name
                      status:
                        type: integer
                    xml:
                      name: create-volume-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      vol_name:
                        type: string
                        example: volume-00000001
                        xml:
                          name: vol-name
                      status:
                        type: integer
                    xml:
                      name: create-volume-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - capacity
              - pool
              properties:
                name:
                  type: string
                  description: The new volume name
                  example: my-volume
                capacity:
                  type: string
                  description: Capacity in GB followed by the letter G.
                  example: 10G
                block:
                  type: string
                  description: YES for a Block Volume, NO for a File Share.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                pool:
                  type: string
                  description: The Pool ID to create the Volume/Share on.
                  example: pool-00000001
                dedupe:
                  type: string
                  description: 'Enable Dedupe For Volume. Default: YES.'
                  x-VpsaType: VPSA Flash Array
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                compress:
                  type: string
                  description: 'Enable compress For Volume. Default: YES.'
                  x-VpsaType: VPSA Flash Array
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                crypt:
                  type: string
                  description: Enable encryption for this Volume.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                attachpolicies:
                  type: string
                  description: Attach default policies.
                  enum:
                  - 'YES'
                  - 'NO'
                mountsync:
                  type: string
                  description: Filesystem write policy. YES for Synchronous Writing, NO for Asynchronous Writing.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                export_name:
                  type: string
                  description: Export Name, required for a Share.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                atimeupdate:
                  type: string
                  description: Enable/disable atime updates for a Share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbaiosize:
                  type: string
                smbguest:
                  type: string
                  description: Allow/disallow SMB guest access for a Share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbonly:
                  type: string
                  description: Allow/disallow SMB access only for a share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbwindowsacl:
                  type: string
                  description: Enable/disabled enhanced Windows ACL for a Share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbfilecreatemask:
                  type: string
                  description: Set file creation permission for a Share.
                smbbrowseable:
                  type: string
                  description: Allow/disallow SMB to be browseable.
                  enum:
                  - 'YES'
                  - 'NO'
                smbhiddenfiles:
                  type: string
                  description: SMB files to hide.
                smbhideunreadable:
                  type: string
                  description: hide/show SMB unreadable files.
                  enum:
                  - 'YES'
                  - 'NO'
                smbhideunwriteable:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                smbhidedotfiles:
                  type: string
                  description: hide/show SMB unwriteable files.
                  enum:
                  - 'YES'
                  - 'NO'
                smbstoredosattributes:
                  type: string
                  description: enable/disable SMB store dos attributes.
                  enum:
                  - 'YES'
                  - 'NO'
                smbdircreatemask:
                  type: string
                  description: Set directory creation permission for a Share.
                smbmaparchive:
                  type: string
                  description: Set map archive for smb Share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbencryptionmode:
                  type: string
                  description: Set encryption mode for smb Share.
                  enum:
                  - 'off'
                  - desired
                  - required
                smbenableoplocks:
                  type: string
                  description: Set if smb oplocks enabled.
                  enum:
                  - 'YES'
                  - 'NO'
                smbmanglednames:
                  type: string
                  description: Set mangling unsupported filenames handling.
                  enum:
                  - 'YES'
                  - 'NO'
                  - ILLEGAL
                smbcasesensitive:
                  type: string
                  description: Set file names case sensitivity.
                  enum:
                  - 'YES'
                  - 'NO'
                  - AUTO
                nfsrootsquash:
                  type: string
                  description: Set root squash for nfs mount
                  enum:
                  - 'YES'
                  - 'NO'
                nfsallsquash:
                  type: string
                  description: Set all squash for nfs mount
                  enum:
                  - 'YES'
                  - 'NO'
                nfsanongid:
                  type: integer
                  description: Set anonymous GID for nfs mount (0 is reserved for default)
                nfsanonuid:
                  type: integer
                  description: Set anonymous UID for nfs mount (0 is reserved for default)
                readaheadkb:
                  type: string
                  enum:
                  - '16'
                  - '64'
                  - '128'
                  - '256'
                  - '512'
                  description: Set Read Ahead Value (KB)
                enableoas:
                  type: string
                enableods:
                  type: string
                filetypestoscan:
                  type: string
                includefiletypes:
                  type: string
                excludefiletypes:
                  type: string
                excludepath:
                  type: string
                autoexpand:
                  type: string
                  description: Enable capacity auto expand
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                maxexpand:
                  type: string
                maxcapacity:
                  type: string
                  description: Max Capacity to expand in GB followed by the letter G.
                  example: 300G
                autoexpandby:
                  type: string
                  description: Capacity to expand by in GB followed by the letter G.
                  example: 300G
                auditenable:
                  type: string
                  description: Enable file access auditing on the volume.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                flcenabled:
                  type: string
                  description: Enable file lifecycle indexing on the volume.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                write_mbps_capping:
                  type: integer
                  description: Block only.
                  example: 300
                read_mbps_capping:
                  type: integer
                  description: Block only.
                  example: 1300
                write_iops_capping:
                  type: integer
                  description: Block only.
                  example: 2300
                read_iops_capping:
                  type: integer
                  description: Block only.
                  example: 1500
                managedfor:
                  type: string
                  description: For externally managed VPSA, set what the volume is managed for.
                thin:
                  type: string
        required: true
      summary: Create volume
      x-summary-source: derived

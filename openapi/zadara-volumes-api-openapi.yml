      summary: Get volume
      x-summary-source: derived
    put:
      tags:
      - Volumes
      description: Update Volume's options.
      operationId: update_volume_nas_options
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      vol_name:
                        type: string
                        example: volume-00000002
                        xml:
                          name: vol-name
                      status:
                        type: integer
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      vol_name:
                        type: string
                        example: volume-00000002
                        xml:
                          name: vol-name
                      status:
                        type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dedupe:
                  type: string
                  description: Enable Dedupe For Volume.
                  x-VpsaType: VPSA Flash Array
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                compress:
                  type: string
                  description: Enable compress For Volume.
                  x-VpsaType: VPSA Flash Array
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                atimeupdate:
                  type: string
                  description: Enable/disable update access times.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                mountsync:
                  type: string
                  description: Filesystem write policy. YES for Synchronous Writing, NO for Asynchronous Writing.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                smbguest:
                  type: string
                  description: Allow/disallow SMB guest access for a Share. YES for Synchronous Writing, NO for Asynchronous Writing.
                  enum:
                  - 'YES'
                  - 'NO'
                smbonly:
                  type: string
                  description: Allow/disallow SMB access only for a share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbwindowsacl:
                  type: string
                  description: Enable/disabled enhanced Windows ACL for a Share.
                  enum:
                  - 'YES'
                  - 'NO'
                smbfilecreatemask:
                  type: string
                  description: Updates file creation permission for a Share.
                smbdircreatemask:
                  type: string
                  description: Updates directory creation permission for a Share.
                  example: '0600'
                smbbrowseable:
                  type: string
                  description: Allow/disallow SMB to be browseable.
                  enum:
                  - 'YES'
                  - 'NO'
                smbhiddenfiles:
                  type: string
                  description: SMB files to hide.
                smbhideunreadable:
                  type: string
                  description: hide/show SMB unreadable files.
                  enum:
                  - 'YES'
                  - 'NO'
                smbhidedotfiles:
                  type: string
                  description: hide/show SMB dot files.
                  enum:
                  - 'YES'
                  - 'NO'
                smbhideunwriteable:
                  type: string
                  description: hide/show SMB unwriteable files.
                  enum:
                  - 'YES'
                  - 'NO'
                smbmaparchive:
                  type: string
                  description: Allow/disallow map archive for smb Share.
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'NO'
                smbaiosize:
                  type: string
                smbencryptionmode:
                  type: string
                  description: Set encryption mode for smb Share.
                  enum:
                  - 'off'
                  - desired
                  - required
                smbenableoplocks:
                  type: string
                  description: Set if smb oplocks enabled.
                  enum:
                  - 'YES'
                  - 'NO'
                smbmanglednames:
                  type: string
                  description: Set mangling unsupported filenames handling.
                  enum:
                  - 'YES'
                  - 'NO'
                  - ILLEGAL
                smbcasesensitive:
                  type: string
                  description: Set file names case sensitivity.
                  enum:
                  - 'YES'
                  - 'NO'
                  - AUTO
                nfsrootsquash:
                  type: string
                  description: Set root squash for nfs mount
                  enum:
                  - 'YES'
                  - 'NO'
                nfsallsquash:
                  type: string
                  description: Set all squash for nfs mount
                  enum:
                  - 'YES'
                  - 'NO'
                nfsanongid:
                  type: integer
                  description: Set anonymous GID for nfs mount (0 is reserved for default)
                nfsanonuid:
                  type: integer
                  description: Set anonymous UID for nfs mount (0 is reserved for default)
                readaheadkb:
                  type: string
                  description: Update Read Ahead Value (KB)
                  enum:
                  - '16'
                  - '64'

      description: Show all Volumes.
      operationId: show_all_volumes
      parameters:
      - in: query
        name: showonlyblock
        description: show only block volumes
        schema:
          type: string
          enum:
          - 'YES'
          - 'NO'
      - in: query
        name: showonlyfile
        description: Show only NAS shares.
        schema:
          type: string
          enum:
          - 'YES'
          - 'NO'
      - in: query
        name: display_name
        description: Filter volumes by name.
        schema:
          type: string
      - in: query
        name: sort
        description: 'The field to sort by, and direction. allowed Fields to sort by are: display-name, comment, provisioned-capacity, status, data-type, pool-display-name or server-name. Example: [{"property":"display-name","direction":"DESC"}]'
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter
        description: 'The field and value to filter by. allowed Fields to filter by are: comment, showonlyblock, showonlyfile, hasauditenabled, hasflcindexingstate, pooldisplayname, smbonly, tagkey and tagvalue if tagkey is present. Example: [{"property":"displaynamewildcard","value":"name"}] '
        schema:
          type: array
          items:
            type: string

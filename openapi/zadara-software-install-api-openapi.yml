openapi: 3.2.0
info:
  title: Zadara Software install API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Software install across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Software install
  description: Operations involving logs.
paths:
  /clouds/{cloud_name}/software_install/list_sns.json:
    get:
      tags:
      - Software install
      description: Lists Storage Nodes.
      operationId: list_sns
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: object
                    properties:
                      sns:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: string
                              example: connected
                            installer_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: installer-version
                            sn_uname:
                              type: string
                              example: ubuntu-61
                              xml:
                                name: sn-uname
                            nova_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: nova-version
                            extmgmt_ip:
                              type: string
                              example: 172.16.0.61
                              xml:
                                name: extmgmt-ip
                            sn_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: sn-version
                          xml:
                            name: sn
                        xml:
                          wrapped: true
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: object
                    properties:
                      sns:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: string
                              example: connected
                            installer_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: installer-version
                            sn_uname:
                              type: string
                              example: ubuntu-61
                              xml:
                                name: sn-uname
                            nova_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: nova-version
                            extmgmt_ip:
                              type: string
                              example: 172.16.0.61
                              xml:
                                name: extmgmt-ip
                            sn_version:
                              type: string
                              example: 14.07-1419-36
                              xml:
                                name: sn-version
                          xml:
                            name: sn
                        xml:
                          wrapped: true
      summary: List sns
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/list_packages.json:
    get:
      tags:
      - Software install
      description: Lists Install packages. Shows packages from local and renote repository. If remote_repo is not defined, the default Zadara repo is used.
      operationId: list_packages
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: query
        name: remote_repo
        description: Remote repository
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: object
                    properties:
                      pkgs:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: 14.07-1419-34
                            state:
                              type: string
                              example: '[downloaded:not-in-s3]'
                          xml:
                            name: pkg
                        xml:
                          wrapped: true
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: object
                    properties:
                      pkgs:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: 14.07-1419-34
                            state:
                              type: string
                              example: '[downloaded:not-in-s3]'
                          xml:
                            name: pkg
                        xml:
                          wrapped: true
      summary: List packages
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/download_package.json:
    post:
      tags:
      - Software install
      description: Download and Install package from a remote repository. If remote_repo is not defined, the default Zadara repo is used.
      operationId: download_package
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: package downloading
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: package downloading
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              properties:
                package:
                  type: string
                  example: 14.07.100
                remote_repo:
                  type: string
                  description: Optional remote repository name. If not provided, the default Zadara repo is used.
        required: true
      summary: Download package
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/upload_settings.json:
    post:
      tags:
      - Software install
      description: Upload deb settings file.
      operationId: upload_settings
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: .deb file upload
                  format: binary
              required:
              - file
      summary: Upload settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/erase_package.json:
    post:
      tags:
      - Software install
      description: Erase package from the local repository.
      operationId: erase_package
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string

              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: package erased
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: package erased
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              properties:
                package:
                  type: string
                  example: 14.07.100
        required: true
      summary: Erase package
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/register_images.json:
    post:
      tags:
      - Software install
      description: Register image in the local repository.
      operationId: register_images
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              - components
              properties:
                package:
                  type: string
                  example: 14.07.100
                components:
                  type: array
                  items:
                    type: string
                    enum:
                    - vpsa
                    - ccvm
                    - zios
                  example:
                  - vpsa
                  - ccvm
                  description: Register only the specified component types. vpsa - register VPSA image. ccvm - register CCVM image. zios - register VPSA Object Storage image
                set_default:
                  type: boolean
                  description: Sets the image as the default for its cloud.
                  example: true
        required: true
      summary: Register images
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/sn_install.json:
    post:
      tags:
      - Software install
      description: Install a new Storage Node.
      operationId: sn_install
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: sn installing
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: sn installing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              - sn_uname
              properties:
                package:
                  type: string
                  example: 14.07.100
                sn_uname:
                  description: Storage node
                  type: string
                  example: sn-10
        required: true
      summary: Sn install
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/software_install/cloud_upgrade.json:
    post:
      tags:
      - Software install
      description: Upgrade the selected compoments (SN\VPSA\CCVM) in the Zadara Cloud to the specified software package. If no components are passed, all components will be upgraded.
      operationId: cloud_upgrade
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: sn installing
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: sn installing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              properties:
                package:
                  type: string
                  example: 14.07.100
                components:
                  type: array
                  example:
                  - sns
                  - vpsas
                  - ccvm
                  items:
                    type: string
                    enum:
                    - sns
                    - vpsas
                    - ccvm
                  description: Upgrade only the specified component types. sns - upgrade all Storage Nodes. vpsas - upgrade all VPSAs. ccvm - upgrade the CCVM
        required: true
      summary: Cloud upgrade
      x-summary-source: derived
    servers:
    - url: https://localhost/api

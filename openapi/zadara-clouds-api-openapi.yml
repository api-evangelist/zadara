openapi: 3.2.0
info:
  title: Zadara Clouds API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Clouds across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Clouds
  description: Operations involving Clouds.
paths:
  /clouds.json:
    get:
      tags:
      - Clouds
      description: Returns a list of all Zadara Storage Clouds which are managed by this Command Center.
      operationId: get_all_clouds
      security:
      - api_key: []
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  clouds:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: cloud1
                        resources:
                          type: object
                          properties:
                            used_memory:
                              type: integer
                              xml:
                                name: used-memory
                            total_memory:
                              type: integer
                              xml:
                                name: total-memory
                            used_vcpus:
                              type: integer
                              xml:
                                name: used-vcpus
                            total_vcpus:
                              type: integer
                              xml:
                                name: total-vcpus
                            used_drives:
                              type: integer
                              xml:
                                name: used-drives
                            total_drives:
                              type: integer
                              xml:
                                name: total-drives
                            used_capacity:
                              type: integer
                              xml:
                                name: used-capacity
                            total_capacity:
                              type: integer
                              xml:
                                name: total-capacity
                            used_cache:
                              type: integer
                              xml:
                                name: used-cache
                            total_cache:
                              type: integer
                              xml:
                                name: total-cache
                        inventory:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: SAS 136GB 15000RPM
                              used:
                                type: integer
                              total:
                                type: integer
                            xml:
                              name: inventory
                          xml:
                            wrapped: true
                        networking:
                          type: object
                          properties:
                            be_allocated_count:
                              type: integer
                              xml:
                                name: be-allocated-count
                            be_range_end:
                              type: string
                              example: 170.70.3.255
                              xml:
                                name: be-range-end
                            be_range_start:
                              type: string
                              example: 170.70.3.0
                              xml:
                                name: be-range-start
                            be_total_count:
                              type: integer
                              xml:
                                name: be-total-count
                            cloud_id:
                              type: integer
                              xml:
                                name: cloud-id
                            fe_allocated_count:
                              type: integer
                              xml:
                                name: fe-allocated-count
                            fe_range_end:
                              type: string
                              example: 170.70.2.255
                              xml:
                                name: fe-range-end
                            fe_range_start:
                              type: string
                              example: 170.70.2.0
                              xml:
                                name: fe-range-start
                            fe_total_count:
                              type: integer
                              xml:
                                name: fe-total-count
                            hb_allocated_count:
                              type: integer
                              xml:
                                name: hb-allocated-count
                            hb_range_end:
                              type: string
                              example: 170.70.0.255
                              xml:
                                name: hb-range-end
                            hb_range_start:
                              type: string
                              example: 170.70.0.0
                              xml:
                                name: hb-range-start
                            hb_total_count:
                              type: integer
                              xml:
                                name: hb-total-count
                            id:
                              type: integer
                      xml:
                        name: cloud
                    xml:
                      wrapped: true
                  count:
                    type: integer
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  clouds:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: cloud1
                        resources:
                          type: object
                          properties:
                            used_memory:
                              type: integer
                              xml:
                                name: used-memory
                            total_memory:
                              type: integer
                              xml:
                                name: total-memory
                            used_vcpus:
                              type: integer
                              xml:
                                name: used-vcpus
                            total_vcpus:
                              type: integer
                              xml:
                                name: total-vcpus
                            used_drives:
                              type: integer
                              xml:
                                name: used-drives
                            total_drives:
                              type: integer
                              xml:
                                name: total-drives
                            used_capacity:
                              type: integer
                              xml:
                                name: used-capacity
                            total_capacity:
                              type: integer
                              xml:
                                name: total-capacity
                            used_cache:
                              type: integer
                              xml:
                                name: used-cache
                            total_cache:
                              type: integer
                              xml:
                                name: total-cache
                        inventory:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: SAS 136GB 15000RPM
                              used:
                                type: integer
                              total:
                                type: integer
                            xml:
                              name: inventory
                          xml:
                            wrapped: true
                        networking:
                          type: object
                          properties:
                            be_allocated_count:
                              type: integer
                              xml:
                                name: be-allocated-count
                            be_range_end:
                              type: string
                              example: 170.70.3.255
                              xml:
                                name: be-range-end
                            be_range_start:
                              type: string
                              example: 170.70.3.0
                              xml:
                                name: be-range-start
                            be_total_count:
                              type: integer
                              xml:
                                name: be-total-count
                            cloud_id:
                              type: integer
                              xml:
                                name: cloud-id
                            fe_allocated_count:
                              type: integer
                              xml:
                                name: fe-allocated-count
                            fe_range_end:
                              type: string
                              example: 170.70.2.255
                              xml:
                                name: fe-range-end
                            fe_range_start:
                              type: string
                              example: 170.70.2.0
                              xml:
                                name: fe-range-start
                            fe_total_count:
                              type: integer
                              xml:
                                name: fe-total-count
                            hb_allocated_count:
                              type: integer
                              xml:
                                name: hb-allocated-count
                            hb_range_end:
                              type: string
                              example: 170.70.0.255
                              xml:
                                name: hb-range-end
                            hb_range_start:
                              type: string
                              example: 170.70.0.0
                              xml:
                                name: hb-range-start
                            hb_total_count:
                              type: integer
                              xml:
                                name: hb-total-count
                            id:
                              type: integer
                      xml:
                        name: cloud
                    xml:
                      wrapped: true
                  count:
                    type: integer
      summary: Get all clouds
      x-summary-source: derived
    servers:
    - url: https://localhost/api

  /clouds/{name}/public_ips.json:
    get:
      tags:
      - Clouds
      description: Returns a list of all of the cloud public IP's
      operationId: list_cloud_public_ips
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: status
        required: true
        description: Show only assigned or free ip's
        schema:
          type: string
          enum:
          - assigned
          - free
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  public_ips:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        cloud_id:
                          type: integer
                          xml:
                            name: cloud-id
                        vpsa_id:
                          type: integer
                          xml:
                            name: vpsa-id
                        public_address:
                          type: string
                          example: 192.168.10.42
                          xml:
                            name: public-address
                        vlan:
                          type: integer
                        label:
                          type: string
                          example: e_pub_192_168_10_0
                        netmask:
                          type: string
                          example: 255.255.255.0
                        address:
                          type: string
                          example: 192.168.10.42
                        internal_id:
                          type: integer
                          xml:
                            name: internal-id
                        network_label:
                          type: string
                          example: FE_MGMT_FEBOND_2
                          xml:
                            name: network-label
                        gateway:
                          type: string
                          example: 192.168.10.1
                        created_at:
                          type: string
                          format: date_time
                          example: '2017-01-04T12:23:02+02:00'
                          xml:
                            name: created-at
                        updated_at:
                          type: string
                          format: date_time
                          example: '2017-01-04T12:23:02+02:00'
                          xml:
                            name: updated-at
                      xml:
                        name: public-ip
                    xml:

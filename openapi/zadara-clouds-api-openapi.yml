                    example: success
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - package
              properties:
                package:
                  type: string
                  example: 14.07.100
                components:
                  type: array
                  items:
                    type: string
                  example:
                  - vpsas
                  - ccvm
                  description: Upgrade only the specified component types. sns - upgrade all Storage Nodes. vpsas - upgrade all VPSA. ccvm - upgrade the CCVM
        required: true
      summary: Upgrade cloud

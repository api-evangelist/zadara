openapi: 3.2.0
info:
  title: Zadara File Lifecycle Policies API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged File Lifecycle Policies across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: File Lifecycle Policies
  description: Operations involving File Lifecycle Policies.
paths:
  /flc_policies.json:
    get:
      tags:
      - File Lifecycle Policies
      description: Show file lifecycle policies.
      operationId: get_all_flc_policies
      parameters:
      - in: query
        name: volume_name
        description: Show file lifecycle policies attached to a given volume.
        schema:
          type: string
      - in: query
        name: first
        description: Retrieve policies starting from the given index. Can be used for pagination with the number parameter.
        schema:
          type: integer
      - in: query
        name: number
        description: Retrieve the given number of policies. Can be used for pagination with the first parameter.
        schema:
          type: integer
      - in: query
        name: order_by
        description: Order policies by given attribute.
        schema:
          type: string
      - in: query
        name: descend
        description: Controls order direction.
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      lc_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: lc-policy-00000002
                            display_name:
                              type: string
                              example: policy1
                              xml:
                                name: display-name
                            enabled:
                              type: string
                              example: 'YES'
                            dry_run_mode:
                              type: string
                              example: 'YES'
                              xml:
                                name: dry-run-mode
                            use_recycle_bin:
                              type: string
                              example: 'NO'
                              xml:
                                name: use-recycle-bin
                            file_selection_criteria:
                              type: string
                              example: '{ "$and": [ { "$in": ["$extension", ["log", "tmp"]] }, { "$gt": ["$size", 1024] } ] }'
                              xml:
                                name: file-selection-criteria
                            whitelist_paths:
                              type: string
                              example: /tmp
                              xml:
                                name: whitelist-paths
                            blacklist_paths:
                              type: string
                              example: /var,/etc
                              xml:
                                name: blacklist-paths
                            action:
                              type: string
                              example: expire
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: lc-policy
                        xml:
                          name: lc-policies
                          wrapped: true
                    xml:
                      name: TODO/
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      lc_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: lc-policy-00000002
                            display_name:
                              type: string
                              example: policy1
                              xml:
                                name: display-name
                            enabled:
                              type: string
                              example: 'YES'
                            dry_run_mode:
                              type: string
                              example: 'YES'
                              xml:
                                name: dry-run-mode
                            use_recycle_bin:
                              type: string
                              example: 'NO'
                              xml:
                                name: use-recycle-bin
                            file_selection_criteria:
                              type: string
                              example: '{ "$and": [ { "$in": ["$extension", ["log", "tmp"]] }, { "$gt": ["$size", 1024] } ] }'
                              xml:
                                name: file-selection-criteria
                            whitelist_paths:
                              type: string
                              example: /tmp
                              xml:
                                name: whitelist-paths
                            blacklist_paths:
                              type: string
                              example: /var,/etc
                              xml:
                                name: blacklist-paths
                            action:
                              type: string
                              example: expire
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: lc-policy
                        xml:
                          name: lc-policies
                          wrapped: true
                    xml:
                      name: TODO/
      summary: Get all flc policies
      x-summary-source: derived
    post:
      tags:
      - File Lifecycle Policies
      description: Create a new file lifecycle policy.
      operationId: create_flc_policy
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: create-life-cycle-policy-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                    xml:
                      name: create-life-cycle-policy-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - file_selection_criteria
              - lc_action
              properties:
                display_name:
                  type: string
                  description: Policy name.
                  example: my_policy
                file_selection_criteria:
                  type: string
                  description: The criteria by which the policy files will be selected. Should be in a MongoDB $match aggregation format.
                  example: '{ \"$and\": [ { \"$in\": [\"$extension\", [\"log\", \"tmp\"]] }, { \"$gt\": [\"$size\", 1024] } ] }'
                lc_action:
                  type: string
                  enum:
                  - archive
                  - expire
                  description: The action that the policy performs on the selected files.
                  example: expire
                enabled:
                  type: string
                  description: Controls enablement of the policy after it is created.
                  enum:
                  - 'YES'
                  - 'NO'
                dry_run:
                  type: string
                  description: When the policy is in dry run mode, it'll only print its actions to the log instead of actually performing them.
                  enum:
                  - 'YES'
                  - 'NO'
                use_recycle_bin:
                  type: string
                  description: When using recycle bin, files that are handled by the policy are also copied to the recycle bin.
                  enum:
                  - 'YES'
                  - 'NO'
                whitelist_paths:
                  type: string
                  description: Comma delimited list of paths that the policy should only run on them.
                blacklist_paths:
                  type: string
                  description: Comma delimited list of paths that the policy should not run on.
                dest_obs_name:
                  type: string
                  description: Destination object storage to archive files to. Relevant only for archive policy.
        required: true
      summary: Create flc policy
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /flc_policies/rules.json:
    get:
      tags:
      - File Lifecycle Policies
      description: Show the rules attaching file lifecycle policies to volumes.
      operationId: get_all_flc_policies_rules
      parameters:
      - in: query
        name: volume_name
        description: Retrieve only rules relevant to the given volume.
        schema:
          type: string
      - in: query
        name: policy_name
        description: Retrieve only rules relevant to the given policy.
        schema:
          type: string
      - in: query
        name: first
        description: Retrieve rules starting from the given index. Can be used for pagination with the number parameter.
        schema:
          type: integer
      - in: query
        name: number
        description: Retrieve the given number of rules. Can be used for pagination with the first parameter.
        schema:
          type: integer
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  TODO:
                    type: string
                    example: None
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  TODO:
                    type: string
                    example: None
      summary: Get all flc policies rules
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api
  /flc_policies/{id}.json:
    put:
      tags:

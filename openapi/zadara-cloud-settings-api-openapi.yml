openapi: 3.2.0
info:
  title: Zadara Cloud Settings API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Cloud Settings across 2 of this provider''s published API definitions: zadara-command-center-25.07.yml, zadara-command-center-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
tags:
- name: Cloud Settings
  description: Operations involving Cloud Settings.
paths:
  /clouds/{cloud_name}/settings.json:
    get:
      tags:
      - Cloud Settings
      description: Get cloud settings.
      operationId: get_cloud_settings
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  general:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_name:
                          type: string
                          example: cloud1
                          xml:
                            name: domain-name
                        support_tickets:
                          type: object
                          properties:
                            method:
                              type: string
                              example: zendesk
                            url:
                              type: string
                              example: https://zadarastorage123.zendesk.com
                            username:
                              type: string
                              example: support@zadarastorage.com
                          xml:
                            name: support-tickets
                        zsnap_settings:
                          type: object
                          properties:
                            method:
                              type: string
                              example: ftp
                            data:
                              type: object
                              properties:
                                server:
                                  type: string
                                  example: 10.0.0.111
                                user:
                                  type: string
                                  example: zsnap
                                max_allowed_mb:
                                  type: integer
                                  example: 102400
                                  xml:
                                    name: max-allowed-mb
                                max_retain_mb:
                                  type: integer
                                  example: 81920
                                  xml:
                                    name: max-retain-mb
                          xml:
                            name: zsnap-settings
                        cache_or_afa_meta_drives_settings:
                          type: object
                          properties:
                            ssd_cache_max_usable_capacity_gb:
                              type: integer
                              example: 800
                              xml:
                                name: ssd-cache-max-usable-capacity-gb
                            allow_temporarily_set_ssds_as_afa_meta:
                              type: string
                              xml:
                                name: allow-temporarily-set-ssds-as-afa-meta
                          xml:
                            name: cache-or-afa-meta-drives-settings
                        ticket_threshold:
                          type: object
                          properties:
                            failed_drive_ticket_time:
                              type: integer
                              example: 34
                              xml:
                                name: failed-drive-ticket-time
                            failed_drive_support_ticket_time:
                              type: integer
                              example: 2
                              xml:
                                name: failed-drive-support-ticket-time
                            failed_heartbeat_ticket_time:
                              type: integer
                              example: 5
                              xml:
                                name: failed-heartbeat-ticket-time
                          xml:
                            name: ticket-threshold
                        default_ccvm_engine:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 14
                            name:
                              type: string
                              example: BASIC
                            vcpus:
                              type: integer
                              example: 1
                            ram:
                              type: integer
                              example: 2048
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            updated_at:
                              type: string
                              format: date_time
                              xml:
                                name: updated-at
                          xml:
                            name: default-ccvm-engine
                      xml:
                        name: general
                    xml:
                      wrapped: true
                  security:
                    type: array
                    items:
                      type: object
                      properties:
                        password_status:
                          type: object
                          properties:
                            password_experation_limit:
                              type: boolean
                              xml:
                                name: password-experation-limit
                            password_history:
                              type: integer
                              example: 8
                              xml:
                                name: password-history
                          xml:
                            name: password-status
                        vpsa_api_passthrough:
                          type: boolean
                          xml:
                            name: vpsa-api-passthrough
                        dual_factor:
                          type: boolean
                          xml:
                            name: dual-factor
                      xml:
                        name: security
                    xml:
                      wrapped: true
                  vpsa:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_name:
                          type: string
                          xml:
                            name: domain-name
                        recycle_bin:
                          type: object
                          properties:
                            days_in_recycle_bin:
                              type: integer
                              example: 7
                              xml:
                                name: days-in-recycle-bin
                          xml:
                            name: recycle-bin
                      xml:
                        name: vpsa
                    xml:
                      wrapped: true
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  general:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_name:
                          type: string
                          example: cloud1
                          xml:
                            name: domain-name
                        support_tickets:
                          type: object
                          properties:
                            method:
                              type: string
                              example: zendesk
                            url:
                              type: string
                              example: https://zadarastorage123.zendesk.com
                            username:
                              type: string
                              example: support@zadarastorage.com
                          xml:
                            name: support-tickets
                        zsnap_settings:
                          type: object
                          properties:
                            method:
                              type: string
                              example: ftp
                            data:
                              type: object
                              properties:
                                server:
                                  type: string
                                  example: 10.0.0.111
                                user:
                                  type: string
                                  example: zsnap
                                max_allowed_mb:
                                  type: integer
                                  example: 102400
                                  xml:
                                    name: max-allowed-mb
                                max_retain_mb:
                                  type: integer
                                  example: 81920
                                  xml:
                                    name: max-retain-mb
                          xml:
                            name: zsnap-settings
                        cache_or_afa_meta_drives_settings:
                          type: object
                          properties:
                            ssd_cache_max_usable_capacity_gb:
                              type: integer
                              example: 800
                              xml:
                                name: ssd-cache-max-usable-capacity-gb
                            allow_temporarily_set_ssds_as_afa_meta:
                              type: string
                              xml:
                                name: allow-temporarily-set-ssds-as-afa-meta
                          xml:
                            name: cache-or-afa-meta-drives-settings
                        ticket_threshold:
                          type: object
                          properties:
                            failed_drive_ticket_time:
                              type: integer
                              example: 34
                              xml:
                                name: failed-drive-ticket-time
                            failed_drive_support_ticket_time:
                              type: integer
                              example: 2
                              xml:
                                name: failed-drive-support-ticket-time
                            failed_heartbeat_ticket_time:
                              type: integer
                              example: 5
                              xml:
                                name: failed-heartbeat-ticket-time
                          xml:
                            name: ticket-threshold
                        default_ccvm_engine:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 14
                            name:
                              type: string
                              example: BASIC
                            vcpus:
                              type: integer
                              example: 1
                            ram:
                              type: integer
                              example: 2048
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            updated_at:
                              type: string
                              format: date_time
                              xml:
                                name: updated-at
                          xml:
                            name: default-ccvm-engine
                      xml:
                        name: general
                    xml:
                      wrapped: true
                  security:
                    type: array
                    items:
                      type: object
                      properties:
                        password_status:
                          type: object
                          properties:
                            password_experation_limit:
                              type: boolean
                              xml:
                                name: password-experation-limit
                            password_history:
                              type: integer
                              example: 8
                              xml:
                                name: password-history
                          xml:
                            name: password-status
                        vpsa_api_passthrough:
                          type: boolean
                          xml:
                            name: vpsa-api-passthrough
                        dual_factor:
                          type: boolean
                          xml:
                            name: dual-factor
                      xml:
                        name: security
                    xml:
                      wrapped: true
                  vpsa:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_name:
                          type: string
                          xml:
                            name: domain-name
                        recycle_bin:
                          type: object
                          properties:
                            days_in_recycle_bin:
                              type: integer
                              example: 7
                              xml:
                                name: days-in-recycle-bin
                          xml:
                            name: recycle-bin
                      xml:
                        name: vpsa
                    xml:
                      wrapped: true
      summary: Get cloud settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/set_ccvm_default_engine.json:
    post:
      tags:
      - Cloud Settings
      description: Sets the default CCVM Engine.
      operationId: set_ccvm_default_engine
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing default CCVM engine to vsa.small has been made
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing default CCVM engine to vsa.small has been made
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - engine_type
              properties:
                engine_type:
                  type: string
                  description: CCVM Engine Type
                  example: vsa.baby
        required: true
      summary: Set ccvm default engine
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/set_remote_region_backend_protocol.json:
    post:
      tags:
      - Cloud Settings
      description: 'Sets the protocol for remote region backend. (Default: iSER)'
      operationId: set_remote_region_backend_protocol
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing remote region backend protocol to iSCSI has been made
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing remote region backend protocol to iSCSI has been made
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - protocol
              properties:
                protocol:
                  type: string
                  example: iser
                  enum:
                  - iser
                  - iscsi
        required: true
      summary: Set remote region backend protocol
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/set_mount_capacity_alert_threshold.json:
    post:
      tags:
      - Cloud Settings
      description: 'Sets the mount capacity alert threshold. (Default: 30GiB)'
      operationId: set_mount_capacity_alert_threshold
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing mount capacity alert threshold to 35 GiB has been made
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Request for changing mount capacity alert threshold to 35 GiB has been made
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - threshold
              properties:
                threshold:
                  type: integer
                  example: 35
        required: true
      summary: Set mount capacity alert threshold
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/set_snmp.json:
    post:
      tags:
      - Cloud Settings
      description: Sets SNMP
      operationId: set_snmp
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: SNMP configuration changed
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: SNMP configuration changed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - trap_recipient
              - proto_version
              - community
              - security_level
              properties:
                enabled:
                  type: boolean
                min_severity:
                  type: string
                  example: low
                  enum:
                  - low
                  - normal
                  - high
                  - urgent
                trap_recipient:
                  type: string
                  example: iser
                proto_version:
                  type: string
                  example: v3
                community:
                  type: string
                  example: public
                security_level:
                  type: string
                  enum:
                  - NoAuthNoPriv
                  - AuthNoPriv
                  - AuthPriv
                auth_proto:
                  type: string
                  enum:
                  - MD5
                  - SHA-1
                  - SHA-2-224
                  - SHA-2-256
                  - SHA-2-384
                  - SHA2-2-512
                auth_user:
                  type: string
                auth_password:
                  type: string
                privacy_proto:
                  type: string
                  enum:
                  - DES
                  - AES128
                  - AES192
                  - AES256
                  - 3DES
                privacy_password:
                  type: string
        required: true
      summary: Set snmp
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/get_tickets_settings.json:
    get:
      tags:
      - Cloud Settings
      description: Gets all support tickets settings
      operationId: get_tickets_settings
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  ticket_settings:
                    type: array
                    xml:
                      name: ticket-settings
                      wrapped: true
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          example: TICKET_TEST
                          xml:
                            name: message-id
                        comment:
                          type: string
                          example: comment
                        priority:
                          type: string
                          example: default
                          enum:
                          - default
                          - low
                          - normal
                          - high
                          - urgent
                        zsnap:
                          type: string
                          example: default
                          enum:
                          - default
                          - 'yes'
                          - 'no'
                          - lite
                        to_user:
                          xml:
                            name: to-user
                          type: string
                          example: default
                          enum:
                          - default
                          - 'yes'
                          - 'no'
                        suppression_exp:
                          type: string
                          example: 2025-12-31Z19:00
                          xml:
                            name: suppression-exp
                        created_by:
                          type: string
                          example: user@email.com
                          xml:
                            name: created-by
                        rate_limit:
                          type: integer
                          description: rate limit in seconds
                          example: 7
                          xml:
                            name: rate-limit
                      xml:
                        name: ticket-settings
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  ticket_settings:
                    type: array
                    xml:
                      name: ticket-settings
                      wrapped: true
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          example: TICKET_TEST
                          xml:
                            name: message-id
                        comment:
                          type: string
                          example: comment
                        priority:
                          type: string
                          example: default
                          enum:
                          - default
                          - low
                          - normal
                          - high
                          - urgent
                        zsnap:
                          type: string
                          example: default
                          enum:
                          - default
                          - 'yes'
                          - 'no'
                          - lite
                        to_user:
                          xml:
                            name: to-user
                          type: string
                          example: default
                          enum:
                          - default
                          - 'yes'
                          - 'no'
                        suppression_exp:
                          type: string
                          example: 2025-12-31Z19:00
                          xml:
                            name: suppression-exp
                        created_by:
                          type: string
                          example: user@email.com
                          xml:
                            name: created-by
                        rate_limit:
                          type: integer
                          description: rate limit in seconds
                          example: 7
                          xml:
                            name: rate-limit
                      xml:
                        name: ticket-settings
      summary: Get tickets settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/set_ticket_settings.json:
    post:
      tags:
      - Cloud Settings
      description: Create/edit support ticket settings. Overrides all previous ticket settings.
      operationId: set_ticket_settings
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Ticket settings set
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Ticket settings set
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - message_id
              - comment
              properties:
                message_id:
                  type: string
                  description: Message id up to 120 characters
                  example: myticket
                expiration_date:
                  type: string
                  format: date_time
                  description: Support ticket suppression expiration date and time (UTC)
                  example: 2025-12-31 19:00
                priority:
                  type: string
                  description: Support ticket priority (empty string for default)
                  enum:
                  - low
                  - normal
                  - high
                  - urgent
                  example: low
                zsnap:
                  type: string
                  description: Support ticket zsnap (empty string for default)
                  enum:
                  - 'yes'
                  - 'no'
                  - lite
                  example: 'yes'
                to_user:
                  type: string
                  description: Support ticket send to users (empty string for default)
                  enum:
                  - 'yes'
                  - 'no'
                  example: 'yes'
                rate_limit:
                  type: integer
                  description: Rate limit must be at least 1
                  example: 5
                comment:
                  type: string
                  description: Comment text up to 120 characters
                  example: my comment
        required: true
      summary: Set ticket settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/delete_ticket_settings.json:
    delete:
      tags:
      - Cloud Settings
      description: Delete support ticket settings
      operationId: delete_ticket_settings
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Ticket settings deleted
            application/xml:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Ticket settings deleted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - message_id
              properties:
                message_id:
                  type: string
                  example: myticket
        required: true
      summary: Delete ticket settings
      x-summary-source: derived
    servers:
    - url: https://localhost/api
  /clouds/{cloud_name}/settings/endpoints.json:
    get:
      tags:
      - Cloud Settings
      description: Gets all cloud upload endpoints including default endpoints
      operationId: get_endpoints
      security:
      - api_key: []
      parameters:
      - in: path
        name: cloud_name
        required: true
        schema:
          type: string
      - in: query
        name: methods_requested
        description: Upload methods requested
        schema:
          type: array
          items:
            type: string
            enum:
            - s3_aws
            - s3_zios
            - ftp
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  cloud_upload_endpoints:

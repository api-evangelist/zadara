      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for remote object storage
                  example: remote object storage 1
                bucket:
                  type: string
                  description: remote object storage bucket name / Azure cloud container name
                  example: my bucket or container
                endpoint:
                  type: string
                  description: Endpoint for remote object storage (use 'storage.googleapis.com' for Google cloud, use 'blob.core.windows.net' for Azure cloud).
                  enum:
                  - s3-eu-west-1.amazonaws.com
                  - blob.core.windows.net
                username:
                  type: string
                  description: Access Key ID for remote object storage / Account in Azure cloud.
                  example: mys3username or my_azure_account
                password:
                  type: string
                  description: Secret Access Key for remote object storage / Storage account key in Azure cloud.
                  example: mys3password or my_azure_account_key
                connectVia:
                  type: string
                  description: Connection method for remote object storage / Azure cloud
                  enum:
                  - fe
                  - public
                  - outnet
                  example: public
                proxyhost:
                  type: string
                  description: Proxy host
                  example: 10.10.10.10
                proxyport:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  example: 7878
                  description: Port for proxy
                proxyuser:
                  type: string
                  description: Username for proxy
                  example: user
                proxypassword:
                  type: string
                  description: Password for proxy
                  example: password
                allow_lifecycle_policies:
                  type: boolean
                  description: Allow bucket to have lifecycle policies. Not applicable to remote object storage type NGOS_S3.
                  example: true
                notify_on_failures:
                  $ref: '#/components/schemas/NotifyOnFailures'
                kmskeyid:
                  type: string
                  description: KMS key ID. Can be set to an empty string to clear the KMS key.
                  example: my-kms-key-id
        required: true
      summary: Update ros destination
      x-summary-source: derived
    delete:

openapi: 3.2.0
info:
  title: Zadara Remote object storage API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Remote object storage across 2 of this provider''s published API definitions: zadara-vpsa-25.07.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Remote object storage
  description: Operations for Remote Object Storages.
paths:
  /object_storage_destinations.json:
    get:
      tags:
      - Remote object storage
      description: Returns a List of all remote Object Storages.
      operationId: get_all_ros_destinations
      security:
      - api_key: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      obs_destinations:
                        type: array
                        items:
                          $ref: '#/components/schemas/ObsDestination'
                        xml:
                          name: obs-destinations
                          wrapped: true
                    xml:
                      name: show-obs-destinations-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      obs_destinations:
                        type: array
                        items:
                          $ref: '#/components/schemas/ObsDestination'
                        xml:
                          name: obs-destinations
                          wrapped: true
                    xml:
                      name: show-obs-destinations-response
      summary: Get all ros destinations
      x-summary-source: derived
    post:
      tags:
      - Remote object storage
      description: Create a remote object storage.
      operationId: create_ros_destination
      security:
      - api_key: []
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      obs_destination_name:
                        type: string
                        example: obsdst-00000003
                        xml:
                          name: obs-destination-name
                    xml:
                      name: update-obs-destination-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      obs_destination_name:
                        type: string
                        example: obsdst-00000003
                        xml:
                          name: obs-destination-name
                    xml:
                      name: update-obs-destination-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - bucket
              - endpoint
              - username
              - password
              - connectVia
              properties:
                name:
                  type: string
                  description: Display Name for remote object storage
                  example: remote object storage 1
                type:
                  type: string
                  description: Type for remote object storage.
                  enum:
                  - AWS_S3
                  - GCS_S3
                  - ZIOS_S3
                  - NGOS_S3
                  - AZURE
                  example: AWS_S3
                  default: AWS_S3
                bucket:
                  type: string
                  description: remote object storage bucket name / Azure cloud container name
                  example: my bucket or container
                endpoint:
                  type: string
                  description: Endpoint for remote object storage (use 'storage.googleapis.com' for Google cloud, use 'blob.core.windows.net' for Azure cloud).
                  example: s3.eu-central-1.amazonaws.com
                username:
                  type: string
                  description: Access Key ID for remote object storage / Account in Azure cloud
                  example: my_s3_access_key or my_azure_account
                password:
                  type: string
                  description: Secret Access Key for remote object storage / Storage account key in Azure cloud.
                  example: mys3password or my_azure_account_key
                connectVia:
                  type: string
                  description: Connection method to Azure cloud.
                  enum:
                  - fe
                  - public
                  - outnet
                  example: public
                allow_lifecycle_policies:
                  type: boolean
                  example: true
                  description: Allow bucket to have lifecycle policies. Not applicable to remote object storage type NGOS_S3.
                notify_on_failures:
                  $ref: '#/components/schemas/NotifyOnFailures'
                proxyhost:
                  type: string
                  description: Proxy host
                  example: 10.10.10.10
                proxyport:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: Port for proxy
                  example: 7878
                proxyuser:
                  type: string
                  description: Username for proxy
                  example: user
                proxypassword:
                  type: string
                  description: Password for proxy
                  example: password
                kmskeyid:
                  type: string
                  description: KMS Key ID
                  example: my-kms-key-id
        required: true
      summary: Create ros destination
      x-summary-source: derived
    servers:
    - url: https://localhost/api
    - url: http://localhost/api

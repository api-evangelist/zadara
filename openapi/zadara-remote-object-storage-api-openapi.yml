              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      obs_backup_job_name:
                        type: string
                        example: bkpjobs-00000003
                        xml:
                          name: obs-backup-job-name
                    xml:
                      name: create-obs-backup-job-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      obs_backup_job_name:
                        type: string
                        example: bkpjobs-00000003
                        xml:
                          name: obs-backup-job-name
                    xml:
                      name: create-obs-backup-job-response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - destination
              - volume
              - policy
              - compression
              - sse
              properties:
                name:
                  type: string
                  description: Display Name for object storage backup job
                  example: test
                destination:
                  type: string
                  description: Object storage destination for the backup
                  example: obsdst-00000001
                volume:
                  type: string
                  pattern: ^volume-[0-9a-f]{8}$
                  description: Volume to backup
                  example: volume-00000001
                policy:
                  type: string
                  pattern: ^policy-[0-9a-f]{8}$
                  description: snapshot policy for backup
                  example: policy-00000001
                compression:
                  type: string
                  description: enable compression
                  enum:
                  - 'YES'
                  - 'NO'
                  example: 'YES'
                sse:
                  type: string
                  description: SSE - use 'NO' for Azure cloud.
                  enum:
                  - 'NO'
                  - AES256
                  - KMS
                  - KMSKEYID
                  example: AES256

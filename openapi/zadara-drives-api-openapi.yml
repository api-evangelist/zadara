openapi: 3.2.0
info:
  title: Zadara Drives API
  version: '25.07'
  contact:
    name: API Support
    email: support@zadarastorage.com
  description: 'Operations tagged Drives across 4 of this provider''s published API definitions: zadara-object-storage-25.07.yml, zadara-vpsa-25.07.yml, zadara-object-storage-openapi.yml, zadara-vpsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/api
- url: http://localhost/api
tags:
- name: Drives
  description: Operations involving Drives.
paths:
  /zios/drives.json:
    get:
      tags:
      - Drives
      description: Returns a list of all drives.
      operationId: get_all_drives
      security:
      - api_key: []
      parameters:
      - $ref: '#/components/parameters/startParam'
      - $ref: '#/components/parameters/limitParam'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: integer
                      count:
                        type: integer
                      disks:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: volume-00000a6f
                            display_name:
                              type: string
                              example: drive-002
                              xml:
                                name: display-name
                            disk_type:
                              type: string
                              example: SAS_9313GB_7200RPM
                              xml:
                                name: disk-type
                            disk_uuid:
                              type: string
                              example: 5000CCA26755A338
                              xml:
                                name: disk-uuid
                            storage_node:
                              type: string
                              example: qa14_sn1
                              xml:
                                name: storage-node
                            vc:
                              type: string
                              example: vc-1
                            region_id:
                              type: integer
                              xml:
                                name: region-id
                            zone_id:
                              type: integer
                              xml:
                                name: zone-id
                            policy_type:
                              type: integer
                              xml:
                                name: policy-type
                            allocation_zone:
                              type: string
                              example: zone_0
                              xml:
                                name: allocation-zone
                            allocation_zone_display_name:
                              type: string
                              example: primary
                              xml:
                                name: allocation-zone-display-name
                            storage_policy:
                              type: string
                              example: 9-3_Erasure_Coding_Protection_Multi-Zone_HA
                              xml:
                                name: storage-policy
                            capacity_protection:
                              type: string
                              example: '0'
                              xml:
                                name: capacity-protection
                            status:
                              type: string
                              example: Absent
                            capacity:
                              type: integer
                            partition_count_degraded:
                              type: integer
                              xml:
                                name: partition-count-degraded
                            partition_count_critical:
                              type: integer
                              xml:
                                name: partition-count-critical
                            created_at:
                              type: string
                              format: date_time
                              xml:
                                name: created-at
                            modified_at:
                              type: string
                              format: date_time
                              xml:
                                name: modified-at
                          xml:
                            name: disk
                        xml:
                          wrapped: true
                    xml:
                      name: show-disks-response
            application/xml:
              schema:
                xml:
                  name: xml
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object
                    properties:
                      message:

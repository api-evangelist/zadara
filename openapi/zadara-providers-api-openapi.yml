          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                xml:
                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '4'
                        name:
                          type: string
                          example: provider1
                        key:
                          type: string
                          example: provider1
                        provider_group_id:
                          type: string
                          example: 'null'
                          xml:
                            name: provider-group-id
                        cloud_id:
                          type: string
                          example: 'null'
                          xml:
                            name: cloud-id
                        enabled:
                          type: string
                          example: 'null'
                        hidden:
                          type: string
                          example: 'null'
                      xml:
                        name: datum
                    xml:
                      wrapped: true
            application/xml:

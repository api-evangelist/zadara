                  name: response
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      provider_id:
                        type: string
                        example: '5'
                        xml:
                          name: provider-id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - key
              - cloud_id
              properties:
                name:
                  type: string
                  example: provider1
                key:
                  type: string
                  example: provider1key
                cloud_id:
                  type: integer
                  example: 1
                enabled:
                  type: boolean
        required: true
      summary: Create provider
      x-summary-source: derived
    servers:
    - url: https://localhost/api/v2

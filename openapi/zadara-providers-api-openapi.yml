components:
  parameters:
    OrganizationId:
      x-EnvType: Public
      name: organization_id
      in: query
      description: Include this parameter if you want to get all entities of a specific organization
      schema:
        type: string
        format: uuid
    IncludeDescendants:
      x-EnvType: Public
      name: include_descendants
      in: query
      description: Set to true if you want to get entities of descendants organizations too
      schema:
        type: boolean
  schemas:
    ProviderGroup:
      type: object
      properties:
        id:
          type: string
          example: '1'
        name:
          type: string
          example: pg1
        visibility:
          x-roles: Platform Admin
          type: string
          example: specific_organizations
          enum:
          - specific_organizations
          - all_users
        visible_organizations:
          x-roles: Platform Admin
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 03389219-c6a2-4941-92dd-6a75c339e9c7
              name:
                type: string
                example: org
              display_name:
                type: string
                example: Organization
                xml:
                  name: display-name
            xml:
              name: visible-organization
          xml:
            wrapped: true
            name: visible-organizations
      xml:
        name: provider-group
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Token
      in: header

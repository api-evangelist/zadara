components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ReplicationTarget:
      type: object
      properties:
        created_at:
          type: string
          format: date_time
          xml:
            name: created-at
        modified_at:
          type: string
          format: date_time
          xml:
            name: modified-at
        display_name:
          type: string

          example: AUTH_104248df08414c659b269e09b355b08b
          xml:
            name: src-account
        destination_account:
          type: string
          example: AUTH_104248df08414c659b269e09b355b08b
          xml:
            name: destination-account
        destination_access_key:
          type: string
          example: 99ef94c76d30451abd41e1c8d9c6aa83
          xml:
            name: destination-access-key
        destination_endpoint:
          type: string
          example: https://vsa-0000048a-my-cloud.zadarazios.com:443
          xml:
            name: destination-endpoint
        destination_region:
          type: string
          example: https://vsa-0000048a-my-cloud.zadarazios.com:443
          xml:
            name: destination-region
        source_access_key:
          type: string
          example: 99ef94c76d30451abd41e1c8d9c6aa83
          xml:
            name: source-access-key
        source_endpoint:
          type: string
          example: https://vsa-0000048a-my-cloud.zadarazios.com:443
          xml:
            name: source-endpoint
        source_region:
          type: string
          format: date_time
          example: us-east-1
          xml:
            name: source-region
        interface:
          type: string
          example: feip
        job_count:
          type: integer
          example: 1
          xml:
            name: job-count
        target_id:
          type: string
          example: replication-target-1727775350
          xml:
            name: target-id
      xml:
        name: replication-target
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Access-Key
      in: header
